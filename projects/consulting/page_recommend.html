<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAMORU 맞춤 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- =========================================================
   MAMORU 맞춤 추천 결과 페이지 v2

   ★ v2 수정사항:
   1. iframe 내 스크롤/여백 문제 해결
   2. 아임웹 페이지 이동 (window.top 사용)
   3. postMessage로 높이 전송
   ========================================================= -->

<style>
/* =========================================================
   캐논 디자인 토큰 — Brand Guide v1.0 Monochrome (다크 배경 유지)
   ========================================================= */
:root {
  --void:#1A1A1A; --graphite:#2D2D2D; --stone:#4A4A4A; --warm-gray:#8A8580; --mist:#B8B4AF; --sand:#D4D0CB; --parchment:#EDEBE8; --shell:#F5F3F0; --cream:#FAF9F7; --white:#FFFFFF;
}

/* =========================================================
   HTML/Body Reset (iframe 대응)
   ========================================================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scrollbar-width: none;
  -ms-overflow-style: none;
  overflow-x: hidden;
}

html::-webkit-scrollbar { display: none; }

body {
  overflow-x: hidden;
  overflow-y: visible;
  height: auto !important;
  min-height: auto !important;
  font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: #1A1A1A;
  color: #ffffff;
  -webkit-font-smoothing: antialiased;
}

/* =========================================================
   기본 설정 + 반응형
   ========================================================= */
.mamoru-recommend {
  background: #1A1A1A;
  color: #ffffff;
  min-height: auto;  /* iframe 환경 대응 */
  margin: 0 auto;
  max-width: 900px;
  padding: 24px 24px 40px;  /* 하단 여백만 적당히 */
}

@media screen and (max-width: 768px) {
  .mamoru-recommend {
    max-width: 100%;
    padding: 16px 16px 32px;
  }
}

@media screen and (max-width: 480px) {
  .mamoru-recommend {
    padding: 12px 12px 24px;
  }
}

/* =========================================================
   헤더
   ========================================================= */
.rec-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.rec-back-btn {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.rec-back-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.2);
  color: #ffffff;
}

.rec-header-content {
  flex: 1;
}

.rec-title {
  font-family: 'Outfit', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: #ffffff;
}

@media screen and (max-width: 768px) {
  .rec-title {
    font-size: 20px;
  }
}

/* =========================================================
   진단 요약
   ========================================================= */
.rec-summary {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 28px;
}

@media screen and (max-width: 768px) {
  .rec-summary {
    padding: 14px 16px;
    margin-bottom: 24px;
    border-radius: 14px;
  }
}

.rec-summary-label {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.6);
  font-weight: 600;
  margin-bottom: 10px;
}

.rec-summary-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.rec-summary-tag {
  display: inline-block;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 100px;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.8);
}

@media screen and (max-width: 768px) {
  .rec-summary-tag {
    padding: 5px 10px;
    font-size: 13px;
  }
}

/* =========================================================
   가위 종류별 섹션
   ========================================================= */
.rec-section {
  margin-bottom: 36px;
}

@media screen and (max-width: 768px) {
  .rec-section {
    margin-bottom: 28px;
  }
}

.rec-section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.rec-section-icon {
  font-size: 22px;
}

.rec-section-title {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #ffffff;
}

@media screen and (max-width: 768px) {
  .rec-section-title {
    font-size: 18px;
  }
}

.rec-section-tip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  margin-bottom: 14px;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.7);
  line-height: 1.5;
}

@media screen and (max-width: 768px) {
  .rec-section-tip {
    padding: 10px 14px;
    font-size: 13px;
  }
}

/* =========================================================
   제품 그리드
   ========================================================= */
.rec-products-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

@media screen and (max-width: 768px) {
  .rec-products-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
}

@media screen and (max-width: 480px) {
  .rec-products-grid {
    grid-template-columns: repeat(2, 1fr);  /* 모바일도 2열 유지 */
    gap: 10px;
  }
}

/* 모바일 카드 크기 최적화 (2열에 맞게) */
@media screen and (max-width: 480px) {
  .rec-product-info {
    padding: 10px;
  }
  .rec-product-name {
    font-size: 13px;
  }
  .rec-product-price {
    font-size: 14px;
  }
}

/* =========================================================
   제품 카드
   ========================================================= */
.rec-product-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1.5px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, background 0.2s;
  text-decoration: none;
  display: block;
}

.rec-product-card:hover {
  transform: translateY(-4px);
  border-color: rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
}

.rec-product-card:active {
  transform: scale(0.98);
}

.rec-product-card.recommended {
  border-color: rgba(255, 255, 255, 0.25);
}

.rec-product-card.recommended:hover {
  border-color: rgba(255, 255, 255, 0.5);
}

.rec-product-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: rgba(255, 255, 255, 0.02);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.rec-product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.rec-product-image-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.2);
  font-size: 13px;
}

.rec-product-image-placeholder-icon {
  font-size: 40px;
  margin-bottom: 8px;
  opacity: 0.5;
}

.rec-product-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 5px 10px;
  background: #FFFFFF;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 700;
  color: #1A1A1A;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.rec-product-info {
  padding: 14px;
}

@media screen and (max-width: 768px) {
  .rec-product-info {
    padding: 12px;
  }
}

.rec-product-name {
  font-size: 15px;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 6px;
  line-height: 1.4;
}

@media screen and (max-width: 768px) {
  .rec-product-name {
    font-size: 14px;
  }
}

.rec-product-price {
  font-size: 16px;
  font-weight: 700;
  color: #FFFFFF;
}

@media screen and (max-width: 768px) {
  .rec-product-price {
    font-size: 15px;
  }
}

.rec-product-score {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.4);
  margin-top: 4px;
}

/* =========================================================
   하단 CTA 버튼 - 일반 레이아웃 (sticky 제거)
   ========================================================= */
.rec-footer {
  margin-top: 40px;
  padding: 20px 0;
}

@media screen and (max-width: 768px) {
  .rec-footer {
    margin-top: 32px;
    padding: 16px 0;
  }
}

@media screen and (max-width: 480px) {
  .rec-footer {
    margin-top: 24px;
    padding: 12px 0;
  }
}

.rec-footer-inner {
  max-width: 100%;
}

.rec-cta-btn {
  width: 100%;
  height: 54px;
  background: #FFFFFF;
  border: none;
  border-radius: 999px;  /* Primary CTA pill 통일 */
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  color: #1A1A1A;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}

@media screen and (max-width: 768px) {
  .rec-cta-btn {
    height: 50px;
    font-size: 15px;
  }
}

.rec-cta-btn:hover {
  opacity: 0.9;
}

.rec-cta-btn:active {
  transform: scale(0.98);
}

/* =========================================================
   에러 상태
   ========================================================= */
.rec-error {
  text-align: center;
  padding: 60px 20px;
}

.rec-error-icon {
  font-size: 56px;
  margin-bottom: 20px;
  opacity: 0.5;
}

.rec-error-title {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 12px;
}

.rec-error-desc {
  font-size: 15px;
  color: rgba(255, 255, 255, 0.5);
  line-height: 1.6;
  margin-bottom: 28px;
}

.rec-error-btn {
  display: inline-block;
  padding: 14px 28px;
  background: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  color: #1A1A1A;
  cursor: pointer;
  text-decoration: none;
  transition: opacity 0.2s;
}

.rec-error-btn:hover {
  opacity: 0.9;
}

/* =========================================================
   로딩 상태
   ========================================================= */
.rec-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  color: rgba(255, 255, 255, 0.5);
}

.rec-loading-spinner {
  width: 44px;
  height: 44px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: #FFFFFF;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 14px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="mamoru-recommend">
  <div id="recommendContent">
    <div class="rec-loading">
      <div class="rec-loading-spinner"></div>
      <span>추천 제품을 불러오는 중...</span>
    </div>
  </div>
</div>

<!-- 제품 데이터 로드 -->
<script src="products.js"></script>

<script>
/* =========================================================
   MAMORU 맞춤 추천 결과 v2

   ★ 수정 가이드:
   - 상담접수 URL: CONSULT_PAGE_URL 변수
   - 진단 페이지 URL: DIAG_PAGE_URL 변수
   ========================================================= */

// ★★★ URL 설정 ★★★
const CONSULT_PAGE_URL = '/52';  // 상담접수 페이지
const DIAG_PAGE_URL = '/51';     // 진단 페이지

/* 라벨 매핑 - 진단 결과 태그에 표시되는 텍스트 [수정문구] */
const labelMap = {
  CE: '자격증 준비', IN: '인턴/스탭', DE: '디자이너',  /* [수정문구] 경력 라벨 */
  BL: '블런트', TH: '틴닝', LO: '장가위', SL: '슬라이싱',  /* [수정문구] 가위종류 라벨 */
  FEEL_SOFT: '부드러운 커트감', FEEL_POWER: '힘있고 강한 느낌', FEEL_NONE: '아직 모름',  /* [수정문구] */
  St_GO: '직진성 커트', St_BACK: '스트로크 커트', St_NONE: '기준 없음',  /* [수정문구] */
  HAB_WET: 'WET 커트', HAB_DRY: 'DRY 커트', HAB_NONE: '반반',  /* [수정문구] */
  TH_25: '25%', TH_15: '15%', TH_35: '35%',  /* [수정문구] */
  FM: '여성', M: '남성'  /* [수정문구] */
};

/* =========================================================
   초기화
   ========================================================= */
function initRecommend() {
  // ★ 1순위: URL 파라미터에서 읽기 (도메인 간 전달용)
  const urlParams = new URLSearchParams(window.location.search);
  let diagData = urlParams.get('diagnosis');

  // ★ 2순위: localStorage에서 읽기 (같은 도메인 fallback)
  if (!diagData) {
    diagData = localStorage.getItem('MAMORU_DIAGNOSIS');
  }

  if (!diagData) {
    renderError();
    return;
  }

  try {
    // URL 파라미터는 encodeURIComponent로 인코딩됨
    const diagnosis = JSON.parse(decodeURIComponent(diagData));
    renderRecommendations(diagnosis);
  } catch (e) {
    // localStorage 형식 시도 (encodeURIComponent 없이 저장된 경우)
    try {
      const diagnosis = JSON.parse(diagData);
      renderRecommendations(diagnosis);
    } catch (e2) {
      console.error('진단 데이터 파싱 오류:', e2);
      renderError();
    }
  }
}

/* =========================================================
   에러 화면 렌더링
   ========================================================= */
function renderError() {
  const container = document.getElementById('recommendContent');
  container.innerHTML = `
    <div class="rec-error">
      <div class="rec-error-icon">🔍</div><!-- [수정아이콘] 에러 아이콘 -->
      <h2 class="rec-error-title">진단 정보가 없습니다</h2><!-- [수정문구] 에러 제목 -->
      <p class="rec-error-desc">
        맞춤 제품 추천을 받으려면 먼저 간편진단을 진행해주세요.<!-- [수정문구] 에러 설명 -->
      </p>
      <a href="javascript:void(0)" onclick="goToDiag()" class="rec-error-btn">
        간편진단 시작하기<!-- [수정문구] 에러 버튼 -->
      </a>
    </div>
  `;
  notifyHeight();
}

/* =========================================================
   추천 결과 렌더링
   ========================================================= */
function renderRecommendations(diagnosis) {
  // ★ 디버깅: 전달받은 진단 데이터 확인
  console.log('[MAMORU] 진단 데이터:', diagnosis);
  console.log('[MAMORU] 선택한 가위 종류 (Q_TYPE):', diagnosis.Q_TYPE);

  const container = document.getElementById('recommendContent');
  const recommendations = getRecommendedProducts(diagnosis);
  const userTypes = diagnosis.Q_TYPE || [];

  console.log('[MAMORU] userTypes:', userTypes);
  console.log('[MAMORU] 추천 결과:', recommendations);

  // 진단 요약 태그 생성
  const summaryTags = [];
  if (diagnosis.Q_STAGE && labelMap[diagnosis.Q_STAGE]) {
    summaryTags.push(labelMap[diagnosis.Q_STAGE]);
  }
  if (diagnosis.Q_FEEL && labelMap[diagnosis.Q_FEEL]) {
    summaryTags.push(labelMap[diagnosis.Q_FEEL]);
  }
  if (diagnosis.Q_HABIT && labelMap[diagnosis.Q_HABIT]) {
    summaryTags.push(labelMap[diagnosis.Q_HABIT]);
  }
  if (diagnosis.Q_GENDER && labelMap[diagnosis.Q_GENDER]) {
    summaryTags.push(labelMap[diagnosis.Q_GENDER]);
  }

  // HTML 생성
  let html = `
    <!-- 헤더 -->
    <div class="rec-header">
      <button class="rec-back-btn" onclick="goBack()">←</button>
      <div class="rec-header-content">
        <h1 class="rec-title">고객님 맞춤 추천 제품</h1><!-- [수정문구] 페이지 제목 -->
      </div>
    </div>

    <!-- 진단 요약 -->
    <div class="rec-summary">
      <div class="rec-summary-label">진단 결과</div><!-- [수정문구] -->
      <div class="rec-summary-tags">
        ${summaryTags.map(tag => `<span class="rec-summary-tag">${tag}</span>`).join('')}
      </div>
    </div>
  `;

  // 가위 종류별 섹션 렌더링
  userTypes.forEach(type => {
    const typeInfo = TYPE_INFO[type];
    const products = recommendations[type] || [];

    if (products.length === 0) return;

    html += `
      <div class="rec-section">
        <div class="rec-section-header">
          <span class="rec-section-icon">${typeInfo.icon}</span>
          <h2 class="rec-section-title">${typeInfo.name} 추천</h2>
        </div>

        ${typeInfo.tip ? `<div class="rec-section-tip">${typeInfo.tip}</div>` : ''}

        <div class="rec-products-grid">
          ${products.map((product, index) => renderProductCard(product, index === 0)).join('')}
        </div>
      </div>
    `;
  });

  // 하단 CTA 버튼
  html += `
    <div class="rec-footer">
      <div class="rec-footer-inner">
        <button class="rec-cta-btn" onclick="goToConsult()">
          진단첨부하여 상담접수하기<!-- [수정문구] CTA 버튼 -->
        </button>
      </div>
    </div>
  `;

  container.innerHTML = html;

  // 높이 재계산
  setTimeout(notifyHeight, 100);
}

/* =========================================================
   제품 카드 렌더링
   ========================================================= */
function renderProductCard(product, isTop) {
  const hasImage = product.image && !product.image.includes('sample-');

  return `
    <a href="${product.detailUrl}"
       target="_top"
       class="rec-product-card ${isTop ? 'recommended' : ''}">
      <div class="rec-product-image">
        ${hasImage
          ? `<img src="${product.image}" alt="${product.name}">`
          : `<div class="rec-product-image-placeholder">
               <span class="rec-product-image-placeholder-icon">✂️</span>
               <span>이미지 준비중</span>
             </div>`
        }
        ${isTop ? '<span class="rec-product-badge">추천</span>' : ''}
      </div>
      <div class="rec-product-info">
        <div class="rec-product-name">${product.name}</div>
        <div class="rec-product-price">${product.priceText}</div>
        <div class="rec-product-score">매칭 점수: ${product.score}점</div>
      </div>
    </a>
  `;
}

/* =========================================================
   네비게이션 - 아임웹 부모 페이지로 이동
   ========================================================= */
function goBack() {
  // postMessage 방식으로 아임웹 부모 페이지 이동 (cross-origin 해결)
  window.parent.postMessage({ type: 'MAMORU_NAVIGATE', url: DIAG_PAGE_URL }, '*');
}

function goToDiag() {
  window.parent.postMessage({ type: 'MAMORU_NAVIGATE', url: DIAG_PAGE_URL }, '*');
}

function goToConsult() {
  window.parent.postMessage({ type: 'MAMORU_NAVIGATE', url: CONSULT_PAGE_URL }, '*');
}

/* =========================================================
   iframe 높이 전송
   ========================================================= */
var lastSentHeight = 0; // 마지막 전송 높이 저장 (무한루프 방지)

function getFullHeight() {
  var recEl = document.querySelector('.mamoru-recommend');
  if (recEl) {
    var rect = recEl.getBoundingClientRect();
    return Math.ceil(rect.height + 50);
  }
  return Math.ceil(document.body.scrollHeight + 50);
}

function notifyHeight() {
  var height = getFullHeight();
  // 높이가 변경되었을 때만 전송 (무한루프 방지)
  if (window.parent && window.parent !== window && height > 0 && Math.abs(height - lastSentHeight) > 5) {
    lastSentHeight = height;
    window.parent.postMessage({ type: 'MAMORU_IFRAME_SIZE', height: height }, '*');
  }
}

window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'REQUEST_HEIGHT') notifyHeight();
});

window.addEventListener('load', function() {
  setTimeout(notifyHeight, 100);
  setTimeout(notifyHeight, 500);
  setTimeout(notifyHeight, 1000);
});

// resize 이벤트 debounce 적용 (무한루프 방지)
var resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(notifyHeight, 200);
});

// 초기화 실행
initRecommend();
</script>

</body>
</html>
