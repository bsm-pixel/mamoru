<!-- MAMORU 맞춤 추천 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯에 전체 복사하세요 ★ -->
<!-- GitHub Pages 이전 버전 - postMessage 동적 높이 조절 -->

<style>
#mamoruRecWrap {
  position: relative;
  width: 100%;
}
#mamoruRecFrame {
  width: 100%;
  border: none;
  display: block;
}
/* 로딩 스피너 애니메이션 */
@keyframes mamoruSpin {
  to { transform: rotate(360deg); }
}
@keyframes mamoruPulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
</style>

<div id="mamoruRecWrap">
  <!-- 로딩 스피너 (iframe 로드 전 표시) -->
  <div id="mamoruRecLoader" style="
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: #1C1C1E;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  ">
    <div style="
      width: 48px;
      height: 48px;
      border: 2px solid rgba(201, 169, 98, 0.2);
      border-top-color: #C9A962;
      border-radius: 50%;
      animation: mamoruSpin 1s linear infinite;
    "></div>
    <p style="
      margin-top: 16px;
      color: #C9A962;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      animation: mamoruPulse 2s ease-in-out infinite;
    ">맞춤 추천</p>
  </div>

  <iframe
    id="mamoruRecFrame"
    src="https://bsm-pixel.github.io/mamoru/projects/consulting/page_recommend.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruRecFrame');
  var currentHeight = 0;

  // postMessage로 동적 높이 수신
  window.addEventListener('message', function(e) {
    // GitHub Pages origin 확인
    if (e.origin !== 'https://bsm-pixel.github.io') return;

    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      if (newHeight !== currentHeight && newHeight > 0) {
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    // 페이지 이동 요청 처리 (cross-origin 해결)
    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });

  // 초기 높이 (postMessage 수신 전 fallback)
  iframe.style.height = (window.innerWidth <= 768 ? 1200 : 1500) + 'px';

  // 로드 후 로딩 스피너 숨김
  iframe.addEventListener('load', function() {
    setTimeout(function() {
      var loader = document.getElementById('mamoruRecLoader');
      if (loader) loader.style.display = 'none';
    }, 300);
  });
})();
</script>
