<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAMORU 간편진단</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"></noscript>
<script type="module" src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"></script>
<!-- =========================================================
   MAMORU 간편진단 페이지 v4

   ★ v4 수정사항:
   1. iframe 내 스크롤/여백 문제 해결
   2. 아임웹 페이지 이동 (window.top 사용)
   3. postMessage로 높이 전송
   ========================================================= -->

<style>
/* =========================================================
   HTML/Body Reset (iframe 대응)
   ========================================================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scrollbar-width: none;
  -ms-overflow-style: none;
  overflow-x: hidden;
}

html::-webkit-scrollbar { display: none; }

body {
  overflow-x: hidden;
  overflow-y: visible;
  height: auto !important;
  min-height: auto !important;
  font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: #1C1C1E;
  color: #ffffff;
  -webkit-font-smoothing: antialiased;
}
/* =========================================================
   기본 설정 + PC/모바일 반응형
   ========================================================= */
.mamoru-diagnosis {
  background: #1C1C1E;
  color: #ffffff;
  min-height: 500px;  /* 100vh → 고정값: iframe 피드백 루프 방지 */
  margin: 0 auto;
  /* PC: 중앙 정렬 + 최대 너비 */
  max-width: 800px;
  padding: 40px 24px 60px;
}

/* 모바일: 좌우 여백 최소화 */
@media screen and (max-width: 768px) {
  .mamoru-diagnosis {
    max-width: 100%;
    padding: 16px 16px 40px;
  }
}

/* 소형 모바일 (480px 이하) */
@media screen and (max-width: 480px) {
  .mamoru-diagnosis {
    padding: 12px 12px 32px;
  }
}

/* =========================================================
   헤더
   ========================================================= */
.diag-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0 24px;
  margin-bottom: 8px;
}

@media screen and (max-width: 768px) {
  .diag-header {
    padding: 8px 0 20px;
    margin-bottom: 0;
  }
}

.diag-back-btn {
  width: 48px;   /* 터치 영역 확대 (접근성) */
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.diag-back-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.2);
  color: #ffffff;
}

.diag-title {
  font-size: 18px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
}

@media screen and (max-width: 768px) {
  .diag-title {
    font-size: 16px;
  }
}

.diag-step-indicator {
  font-size: 15px;
  color: #C9A962;
  font-weight: 600;
  background: rgba(201, 169, 98, 0.1);
  padding: 6px 14px;
  border-radius: 100px;
}

@media screen and (max-width: 768px) {
  .diag-step-indicator {
    font-size: 14px;
    padding: 4px 12px;
  }
}

/* =========================================================
   프로그레스 바
   ========================================================= */
.diag-progress-container {
  margin-bottom: 40px;
}

@media screen and (max-width: 768px) {
  .diag-progress-container {
    margin-bottom: 32px;
  }
}

.diag-progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 100px;
  overflow: hidden;
}

@media screen and (max-width: 768px) {
  .diag-progress-bar {
    height: 6px;  /* 시인성 개선 (4px → 6px) */
  }
}

.diag-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #C9A962 0%, #E8D5A3 100%);
  border-radius: 100px;
  transition: width 0.4s ease;
}

/* =========================================================
   질문 영역
   ========================================================= */
.diag-content {
  min-height: 450px;
}

@media screen and (max-width: 768px) {
  .diag-content {
    min-height: 400px;
  }
}

/* ★ 수정: 선택 시 깜빡임 제거, 전환 시에만 애니메이션 */
.diag-question-wrapper {
  opacity: 1;
}

.diag-question-wrapper.fade-enter {
  animation: fadeInSmooth 0.35s ease-out;
}

@keyframes fadeInSmooth {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.diag-question-label {
  display: inline-block;
  padding: 6px 14px;
  background: rgba(201, 169, 98, 0.15);
  border-radius: 100px;
  color: #C9A962;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 20px;
}

@media screen and (max-width: 768px) {
  .diag-question-label {
    padding: 4px 12px;
    font-size: 12px;
    margin-bottom: 16px;
  }
}

.diag-question-text {
  font-size: 40px;  /* PC: 더 큰 제목 */
  font-weight: 700;
  line-height: 1.35;
  margin-bottom: 16px;
  color: #ffffff;
}

@media screen and (max-width: 768px) {
  .diag-question-text {
    font-size: 24px;  /* 모바일: 원래 크기 */
    margin-bottom: 8px;
  }
}

@media screen and (max-width: 480px) {
  .diag-question-text {
    font-size: 22px;  /* 소형 모바일 가독성 */
  }
}

.diag-question-sub {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.5);
  line-height: 1.5;
  margin-bottom: 36px;
}

@media screen and (max-width: 768px) {
  .diag-question-sub {
    font-size: 14px;
    margin-bottom: 24px;
  }
}

/* =========================================================
   선택지 - 기본형
   ========================================================= */
.diag-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);  /* PC: 2열 그리드 */
  gap: 16px;
}

@media screen and (max-width: 768px) {
  .diag-options {
    grid-template-columns: 1fr;  /* 모바일: 1열 */
    gap: 12px;
  }
}

.diag-option {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  background: rgba(255, 255, 255, 0.03);
  border: 1.5px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
}

@media screen and (max-width: 768px) {
  .diag-option {
    gap: 14px;
    padding: 16px 18px;
    border-radius: 12px;
  }
}

.diag-option:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.15);
}

.diag-option:active {
  transform: scale(0.98);
}

.diag-option.selected {
  background: rgba(201, 169, 98, 0.12);
  border-color: #C9A962;
  transform: scale(1.01);  /* 선택 피드백 강화 */
}

.diag-option-icon {
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  font-size: 26px;
  flex-shrink: 0;
}

/* 커스텀 아이콘 이미지 지원 - 인라인 SVG와 동일 크기 */
.diag-custom-icon {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

@media screen and (max-width: 768px) {
  .diag-option-icon {
    width: 44px;
    height: 44px;
    font-size: 22px;
    border-radius: 10px;
  }
}

.diag-option.selected .diag-option-icon {
  background: rgba(201, 169, 98, 0.2);
}

.diag-option-content {
  flex: 1;
  min-width: 0;
}

.diag-option-title {
  font-size: 17px;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}

@media screen and (max-width: 768px) {
  .diag-option-title {
    font-size: 15px;
    margin-bottom: 2px;
  }
}

.diag-option-desc {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.5);
}

@media screen and (max-width: 768px) {
  .diag-option-desc {
    font-size: 13px;
  }
}

.diag-option-check {
  width: 26px;
  height: 26px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
  transition: all 0.2s;
}

@media screen and (max-width: 768px) {
  .diag-option-check {
    width: 22px;
    height: 22px;
  }
}

.diag-option.selected .diag-option-check {
  background: #C9A962;
  border-color: #C9A962;
}

.diag-option.selected .diag-option-check::after {
  content: '✓';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #1C1C1E;
  font-size: 14px;
  font-weight: bold;
}

@media screen and (max-width: 768px) {
  .diag-option.selected .diag-option-check::after {
    font-size: 12px;
  }
}

/* =========================================================
   선택지 - GIF 포함형
   ========================================================= */
.diag-options--with-gif {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

@media screen and (max-width: 768px) {
  .diag-options--with-gif {
    grid-template-columns: repeat(2, 1fr);  /* 모바일도 2열 유지 */
    gap: 10px;
  }
}

.diag-option--with-gif {
  display: flex;
  flex-direction: column;
  padding: 0;
  background: rgba(255, 255, 255, 0.03);
  border: 1.5px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
  overflow: hidden;
}

.diag-option--with-gif:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.15);
}

.diag-option--with-gif:active {
  transform: scale(0.98);
}

.diag-option--with-gif.selected {
  background: rgba(201, 169, 98, 0.12);
  border-color: #C9A962;
  transform: scale(1.01);  /* 선택 피드백 강화 */
}

.diag-option-gif {
  width: 100%;
  height: 160px;
  background: rgba(255, 255, 255, 0.02);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

@media screen and (max-width: 768px) {
  .diag-option-gif {
    height: 80px;  /* 모바일 컴팩트 */
  }
  .diag-option-gif-placeholder-icon {
    font-size: 28px;
    margin-bottom: 4px;
  }
  .diag-option-gif-placeholder {
    font-size: 11px;
  }
}

.diag-option-gif img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.diag-option-gif-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.3);
  font-size: 13px;
}

.diag-option-gif-placeholder-icon {
  font-size: 36px;
  margin-bottom: 8px;
  opacity: 0.5;
}

.diag-option-info {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
}

@media screen and (max-width: 768px) {
  .diag-option-info {
    padding: 10px 12px;
  }
}

.diag-option-info-content {
  flex: 1;
  min-width: 0;
}

.diag-option-info-title {
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 2px;
}

@media screen and (max-width: 768px) {
  .diag-option-info-title {
    font-size: 13px;
  }
  .diag-option-info-desc {
    font-size: 11px;
  }
}

.diag-option-info-desc {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.5);
}

.diag-option-info-check {
  width: 24px;
  height: 24px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
  transition: all 0.2s;
}

.diag-option--with-gif.selected .diag-option-info-check {
  background: #C9A962;
  border-color: #C9A962;
}

.diag-option--with-gif.selected .diag-option-info-check::after {
  content: '✓';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #1C1C1E;
  font-size: 12px;
  font-weight: bold;
}

/* =========================================================
   복수선택 안내
   ========================================================= */
.diag-multiple-hint {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 20px;
  padding: 12px;
  background: rgba(201, 169, 98, 0.08);
  border-radius: 10px;
  font-size: 14px;
  color: #C9A962;
}

@media screen and (max-width: 768px) {
  .diag-multiple-hint {
    margin-top: 16px;
    padding: 10px;
    font-size: 13px;
  }
}

/* =========================================================
   하단 버튼 - PC: 콘텐츠 내 우측 정렬 / 모바일: 하단 고정
   ========================================================= */

/* 기본(PC): 콘텐츠 영역 내 우측 정렬 */
.diag-footer {
  display: flex;
  justify-content: flex-end;  /* 우측 정렬 */
  margin-top: 48px;  /* 선택지와 간격 */
  padding: 0;
  background: transparent;
  z-index: 100;
}

.diag-footer-inner {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* PC: 버튼 스타일 조정 */
@media screen and (min-width: 769px) {
  .diag-back-btn-bottom {
    width: 52px;
    height: 52px;
  }
  .diag-next-btn {
    width: 180px;
    flex: none;
  }
}

/* 모바일: 콘텐츠 내 배치 (브라우저 UI 가림 방지) */
@media screen and (max-width: 768px) {
  .diag-footer {
    justify-content: center;  /* 모바일은 중앙 정렬 */
    margin-top: 32px;
    padding: 0;
    background: transparent;
  }
  .diag-footer-inner {
    width: 100%;
    max-width: 100%;
  }
  .diag-back-btn-bottom {
    width: 48px;
    height: 48px;
  }
  .diag-next-btn {
    flex: 1;
  }
}

/* 이전 버튼 - 하단으로 이동 */
.diag-back-btn-bottom {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.diag-back-btn-bottom:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.25);
  color: #ffffff;
}

@media screen and (max-width: 768px) {
  .diag-back-btn-bottom {
    width: 48px;
    height: 48px;
  }
}

.diag-next-btn {
  flex: 1;  /* 남은 공간 채우기 */
  height: 58px;
  background: linear-gradient(135deg, #C9A962 0%, #B8963E 100%);
  border: none;
  border-radius: 14px;
  font-family: inherit;
  font-size: 17px;
  font-weight: 600;
  color: #ffffff;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}

@media screen and (max-width: 768px) {
  .diag-next-btn {
    height: 54px;
    border-radius: 12px;
    font-size: 16px;
  }
}

@media screen and (max-width: 480px) {
  .diag-next-btn {
    height: 52px;
    font-size: 15px;
  }
}

.diag-next-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.diag-next-btn:not(:disabled):hover {
  opacity: 0.9;
}

.diag-next-btn:not(:disabled):active {
  transform: scale(0.98);
}

/* =========================================================
   결과 화면
   ========================================================= */
.diag-result {
  display: none;
}

.diag-result.show {
  display: block;
  animation: fadeInSmooth 0.4s ease-out;
}

.diag-result-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 32px 28px;
  margin-bottom: 24px;
}

@media screen and (max-width: 768px) {
  .diag-result-card {
    border-radius: 16px;
    padding: 24px 20px;
    margin-bottom: 20px;
  }
}

@media screen and (max-width: 480px) {
  .diag-result-card {
    padding: 20px 16px;
    margin-bottom: 16px;
  }
}

.diag-result-badge {
  display: inline-block;
  padding: 8px 16px;
  background: rgba(201, 169, 98, 0.15);
  border-radius: 100px;
  color: #C9A962;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 20px;
}

@media screen and (max-width: 768px) {
  .diag-result-badge {
    padding: 6px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }
}

.diag-result-title {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.35;
  margin-bottom: 16px;
  color: #ffffff;
}

@media screen and (max-width: 768px) {
  .diag-result-title {
    font-size: 22px;
    margin-bottom: 12px;
  }
}

@media screen and (max-width: 480px) {
  .diag-result-title {
    font-size: 20px;
  }
}

.diag-result-desc {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.6);
  line-height: 1.7;
}

@media screen and (max-width: 768px) {
  .diag-result-desc {
    font-size: 15px;
  }
}

/* 가위 종류별 그룹 블록 */
.diag-result-group {
  margin-top: 16px;
}
.diag-result-group-chip {
  display: inline-block;
  padding: 4px 12px;
  background: rgba(201, 169, 98, 0.18);
  color: #C9A962;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
}
.diag-result-group-list {
  list-style: none;
  margin: 8px 0 0 0;
  padding: 0;
}
.diag-result-group-list li {
  color: rgba(255, 255, 255, 0.65);
  line-height: 1.6;
  font-size: 15px;
  padding-left: 14px;
  position: relative;
}
.diag-result-group-list li::before {
  content: '·';
  position: absolute;
  left: 0;
  color: rgba(255, 255, 255, 0.4);
}
/* 인사말 / 마무리 텍스트 */
.diag-result-intro {
  white-space: pre-line;
  margin-bottom: 4px;
}
.diag-result-outro {
  margin-top: 16px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 14px;
}

@media screen and (max-width: 768px) {
  .diag-result-group-chip {
    font-size: 12px;
    padding: 3px 10px;
  }
  .diag-result-group-list li {
    font-size: 14px;
  }
  .diag-result-outro {
    font-size: 13px;
  }
}

.diag-result-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

@media screen and (max-width: 768px) {
  .diag-result-tags {
    gap: 8px;
    margin-top: 20px;
    padding-top: 20px;
  }
}

.diag-result-tag {
  display: inline-block;
  padding: 8px 14px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 100px;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.7);
}

@media screen and (max-width: 768px) {
  .diag-result-tag {
    padding: 6px 12px;
    font-size: 13px;
  }
}

.diag-result-actions {
  display: flex;
  flex-direction: column;
  align-items: center;  /* PC: 중앙 정렬 */
  gap: 14px;
  margin-top: 28px;
}

.diag-result-actions .diag-result-btn {

/* 개인화 결과 메시지 생성 (HTML 반환) */
function buildPersonalizedMessage(answers) {
  const stage = answers.Q_STAGE;
  const types = answers.Q_TYPE || [];
  const parts = [];

  /* 1) 경력별 인사말 */
  const intro = messagesData['MSG_' + stage] || '진단이 완료되었습니다!';
  parts.push(`<p class="diag-result-intro">${intro}</p>`);

  /* 2) 가위 종류별 그룹 블록 */
  /* -- 블런트 그룹 -- */
  if (types.includes('BL')) {
    const items = [];
    const feelMap = { FEEL_SOFT: '부드러운 커트감을 선호하시는군요.', FEEL_POWER: '힘있고 강한 커트감을 원하시는군요.', FEEL_NONE: '커트감은 상담에서 함께 찾아보면 좋겠어요.' };
    const styleMap = { St_GO: '직진성 커트 스타일이시네요.', St_BACK: '스트로크(뒤로 빼면서) 커트 스타일이시네요.', St_NONE: '커트 스타일은 상담에서 함께 파악해볼게요.' };
    const habitMap = { HAB_WET: 'WET 커트 위주로 작업하시는군요.', HAB_DRY: 'DRY 커트를 주로 하시는군요.', HAB_NONE: 'WET/DRY 비율은 상담에서 함께 맞춰볼게요.' };
    if (answers.Q_FEEL && feelMap[answers.Q_FEEL]) items.push(feelMap[answers.Q_FEEL]);
    if (answers.Q_STYLE && styleMap[answers.Q_STYLE]) items.push(styleMap[answers.Q_STYLE]);
    if (answers.Q_HABIT && habitMap[answers.Q_HABIT]) items.push(habitMap[answers.Q_HABIT]);
    if (items.length > 0) {
      parts.push(`<div class="diag-result-group"><span class="diag-result-group-chip">블런트</span><ul class="diag-result-group-list">${items.map(i => '<li>' + i + '</li>').join('')}</ul></div>`);
    }
  }

  /* -- 틴닝 그룹 -- */
  if (types.includes('TH')) {
    const items = [];
    if (answers.Q_TH_RATIO) items.push('감모량은 ' + (labelMap[answers.Q_TH_RATIO] || answers.Q_TH_RATIO) + '을 원하시는군요.');
    const thWhyMap = { TH_WHY_NEW: '새로운 감모량을 추가하시려는 거군요.', TH_WHY_SAME: '기존 틴닝을 교체하시려는 거군요.', TH_WHY_UP: '더 좋은 틴닝으로 업그레이드를 원하시는군요.' };
    if (answers.Q_TH_WHY && thWhyMap[answers.Q_TH_WHY]) items.push(thWhyMap[answers.Q_TH_WHY]);
    if (items.length > 0) {
      parts.push(`<div class="diag-result-group"><span class="diag-result-group-chip">틴닝</span><ul class="diag-result-group-list">${items.map(i => '<li>' + i + '</li>').join('')}</ul></div>`);
    }
  }

  /* -- 장가위 그룹 -- */
  if (types.includes('LO')) {
    const items = [];
    const feelMap = { FEEL_SOFT: '부드러운 커트감을 선호하시는군요.', FEEL_POWER: '힘있고 강한 커트감을 원하시는군요.', FEEL_NONE: '커트감은 상담에서 함께 찾아보면 좋겠어요.' };
    const habitMap = { HAB_WET: 'WET 커트 위주로 작업하시는군요.', HAB_DRY: 'DRY 커트를 주로 하시는군요.', HAB_NONE: 'WET/DRY 비율은 상담에서 함께 맞춰볼게요.' };
    /* 장가위는 블런트와 커트감/습관 공유하되, 블런트 그룹에 이미 표시했으면 중복 생략 */
    if (!types.includes('BL')) {
      if (answers.Q_FEEL && feelMap[answers.Q_FEEL]) items.push(feelMap[answers.Q_FEEL]);
      if (answers.Q_HABIT && habitMap[answers.Q_HABIT]) items.push(habitMap[answers.Q_HABIT]);
    }
    const loMap = { LO_BL: '블런트 겸용으로 사용하실 예정이시군요.', LO_SING: '싱글링 전용 장가위를 찾고 계시군요.' };
    if (answers.Q_LO_USE && loMap[answers.Q_LO_USE]) items.push(loMap[answers.Q_LO_USE]);
    if (items.length > 0) {
      parts.push(`<div class="diag-result-group"><span class="diag-result-group-chip">장가위</span><ul class="diag-result-group-list">${items.map(i => '<li>' + i + '</li>').join('')}</ul></div>`);
    }
  }

  /* -- 슬라이싱 그룹 -- */
  if (types.includes('SL')) {
    const items = [];
    const slMap = { SL_NEW: '슬라이싱 가위는 처음이시군요.', SL_SAME: '기존 슬라이싱 가위에 불만족하셨군요.' };
    if (answers.Q_SL_WHY && slMap[answers.Q_SL_WHY]) items.push(slMap[answers.Q_SL_WHY]);
    const slWhyMap = { SL_SAME_WHY_UNCOM: '밀리기만 하고 잘 안 잘렸군요.', SL_SAME_WHY_UNCOM1: '너무 많이 잘려나가는 문제가 있으셨군요.', SL_SAME_WHY_HAND: '핸들이 불편하셨군요.' };
    if (answers.Q_SL_SAME_WHY && slWhyMap[answers.Q_SL_SAME_WHY]) items.push(slWhyMap[answers.Q_SL_SAME_WHY]);
    if (items.length > 0) {
      parts.push(`<div class="diag-result-group"><span class="diag-result-group-chip">슬라이싱</span><ul class="diag-result-group-list">${items.map(i => '<li>' + i + '</li>').join('')}</ul></div>`);
    }
  }

  /* 3) 마무리 */
  parts.push('<p class="diag-result-outro">이 내용을 바탕으로 맞춤 제안을 준비해드리겠습니다.</p>');
  return parts.join('');
}

/* 복원수리 안내 섹션 (조건부 HTML 생성) */
function buildRestorationSection(answers) {
  const types = answers.Q_TYPE || [];
  const showTH = types.includes('TH') && answers.Q_TH_WHY === 'TH_WHY_SAME';
  const showSL = types.includes('SL') && answers.Q_SL_WHY === 'SL_SAME'
    && (answers.Q_SL_SAME_WHY === 'SL_SAME_WHY_UNCOM' || answers.Q_SL_SAME_WHY === 'SL_SAME_WHY_UNCOM1');

  if (!showTH && !showSL) return '';

  /* 설명문 분기 */
  let descText = '';
  if (showTH && showSL) {
    descText = '잘 사용하시던 틴닝·슬라이싱 가위가 갑자기 불편해졌다면, 날의 미세한 틀어짐이 원인일 수 있어요. 새 가위 구매 전에 복원수리를 먼저 확인해보시는 것도 좋은 방법입니다.';
  } else if (showTH) {
    descText = '잘 사용하시던 틴닝 가위가 갑자기 불편해졌다면, 날의 미세한 틀어짐이 원인일 수 있어요. 새 가위 구매 전에 복원수리를 먼저 확인해보시는 것도 좋은 방법입니다.';
  } else {
    descText = '슬라이싱 가위의 커트감 변화는 날 상태에 따라 복원수리로 개선될 수 있어요. 새 가위 구매 전에 한 번 확인해보시는 것을 추천드립니다.';
  }

  /* YouTube 영상 제목 */
  const videoItems = [];
  if (showTH) videoItems.push('틴닝 가위, 교체 전에 꼭 확인하세요');
  if (showSL) videoItems.push('슬라이싱 가위 복원수리 안내');

  const videoHtml = videoItems.map(title => `
    <a href="#" class="diag-result-youtube-link">
      <span class="diag-result-youtube-thumb">
        <span class="diag-result-youtube-play"><svg viewBox="0 0 24 24" fill="#C9A962" stroke="none"><polygon points="8,5 20,12 8,19"/></svg></span>
        <span class="diag-result-youtube-coming">영상 준비중</span>
      </span>
      <span class="diag-result-youtube-text">${title}</span>
    </a>
  `).join('');

  return `
    <div class="diag-result-restore">
      <div class="diag-result-restore-header">
        <span class="diag-result-restore-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#C9A962" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
        <span class="diag-result-restore-title">복원수리 안내</span>
      </div>
      <p class="diag-result-restore-desc">${descText}</p>
      <div class="diag-result-youtube">${videoHtml}</div>
    </div>
  `;
}

  TH_25: '25%', TH_15: '15%', TH_35: '35%',
  TH_WHY_NEW: '새 감모량', TH_WHY_SAME: '교체', TH_WHY_UP: '업그레이드',
  LO_BL: '블런트 겸용', LO_SING: '싱글링 전용',
  SL_NEW: '첫 구매', SL_SAME: '불만족 교체',
  SL_SAME_WHY_UNCOM: '안 잘림', SL_SAME_WHY_UNCOM1: '과다 절삭', SL_SAME_WHY_HAND: '핸들 불편',
  FM: '여성', M: '남성',
  FING_NORMAL: '보통', FING_THICK: '두꺼움'
};

/* =========================================================
   로직
   ========================================================= */
let diagCurrentStep = 0;
let diagAnswers = {};
let diagVisibleQuestions = [];
let isTransitioning = false;  // ★ 전환 중 플래그

/* ★ 아이콘 렌더링 함수: SVG/img 태그면 그대로, 경로면 img, 아니면 텍스트 */
function renderIcon(icon) {
  if (!icon) return '';
  if (icon.startsWith('<svg') || icon.startsWith('<img')) return icon;
  if (icon.includes('/') || icon.includes('.')) {
    return `<img src="${icon}" alt="" class="diag-custom-icon">`;
  }
  return icon;
}

function diagInit() {
  diagAnswers = {};
  diagCurrentStep = 0;
  diagCalculateVisible();
  diagRenderQuestion(true);
  document.getElementById('resultContent').classList.remove('show');
  document.getElementById('questionContent').style.display = 'block';
  document.getElementById('diagFooter').style.display = 'block';
}

function diagCalculateVisible() {
  diagVisibleQuestions = questionsData.filter(q => {
    if (q.condition === null) return true;
    return q.condition(diagAnswers);
  });
}

// ★ 수정: 전환 시에만 애니메이션 적용
function diagRenderQuestion(withAnimation = false) {
  diagCalculateVisible();
  
  if (diagCurrentStep >= diagVisibleQuestions.length) {
    diagShowResult();
    return;
  }
  
  const q = diagVisibleQuestions[diagCurrentStep];
  const totalSteps = diagVisibleQuestions.length;
  const progress = ((diagCurrentStep + 1) / totalSteps) * 100;
  
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('stepIndicator').textContent = `${diagCurrentStep + 1}/${totalSteps}`;
  
  const currentAnswers = diagAnswers[q.id] || (q.multiple ? [] : null);
  
  let optionsHtml = '';
  
  if (q.hasGif) {
    optionsHtml = '<div class="diag-options--with-gif">';
    optionsHtml += q.options.map(opt => {
      const isSelected = q.multiple 
        ? (currentAnswers || []).includes(opt.id)
        : currentAnswers === opt.id;
      
      /* 우선순위: lottieUrl → gifUrl → placeholder */
      let gifContent;
      if (opt.lottieUrl) {
        gifContent = `<dotlottie-player src="${opt.lottieUrl}" autoplay loop mode="normal" style="width:100%;height:100%"></dotlottie-player>`;
      } else if (opt.gifUrl) {
        gifContent = `<img src="${opt.gifUrl}" alt="${opt.label}">`;
      } else {
        gifContent = `<div class="diag-option-gif-placeholder">
             <span class="diag-option-gif-placeholder-icon">${renderIcon(opt.icon)}</span>
             <span>준비중</span>
           </div>`;
      }
      
      return `
        <div class="diag-option--with-gif ${isSelected ? 'selected' : ''}" 
             onclick="diagSelectOption('${q.id}', '${opt.id}', ${q.multiple})">
          <div class="diag-option-gif">${gifContent}</div>
          <div class="diag-option-info">
            <div class="diag-option-info-content">
              <div class="diag-option-info-title">${opt.label}</div>
              ${opt.desc ? `<div class="diag-option-info-desc">${opt.desc}</div>` : ''}
            </div>
            <div class="diag-option-info-check"></div>
          </div>
        </div>
      `;
    }).join('');
    optionsHtml += '</div>';
  } else {
    optionsHtml = '<div class="diag-options">';
    optionsHtml += q.options.map(opt => {
      const isSelected = q.multiple 
        ? (currentAnswers || []).includes(opt.id)
        : currentAnswers === opt.id;
      
      return `
        <div class="diag-option ${isSelected ? 'selected' : ''}"
             onclick="diagSelectOption('${q.id}', '${opt.id}', ${q.multiple})">
          <div class="diag-option-icon">${renderIcon(opt.icon)}</div>
          <div class="diag-option-content">
            <div class="diag-option-title">${opt.label}</div>
            ${opt.desc ? `<div class="diag-option-desc">${opt.desc}</div>` : ''}
          </div>
          <div class="diag-option-check"></div>
        </div>
      `;
    }).join('');
    optionsHtml += '</div>';
  }
  
  // ★ 전환 시에만 애니메이션 클래스 추가
  const animClass = withAnimation ? 'fade-enter' : '';
  
  const html = `
    <div class="diag-question-wrapper ${animClass}">
      <span class="diag-question-label">${q.label}</span>
      <h2 class="diag-question-text">${q.question.replace(/\n/g, '<br>')}</h2>
      ${q.sub ? `<p class="diag-question-sub">${q.sub}</p>` : ''}
      ${optionsHtml}
      ${q.multiple ? '<div class="diag-multiple-hint"><svg viewBox="0 0 24 24" fill="none" stroke="#C9A962" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:middle;display:inline"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M12 2V0" stroke-width="1"/><path d="M9.5 19.5h5"/></svg> 여러 개 선택 가능</div>' : ''}
    </div>
  `;
  
  document.getElementById('questionContent').innerHTML = html;
  diagUpdateNextButton();
}

// ★ 수정: 선택 시 깜빡임 없이 상태만 업데이트
function diagSelectOption(qId, optId, isMultiple) {
  if (isTransitioning) return;
  
  if (isMultiple) {
    if (!diagAnswers[qId]) diagAnswers[qId] = [];
    const idx = diagAnswers[qId].indexOf(optId);
    if (idx > -1) {
      diagAnswers[qId].splice(idx, 1);
    } else {
      diagAnswers[qId].push(optId);
    }
  } else {
    diagAnswers[qId] = optId;
  }
  
  // ★ 선택 상태만 업데이트 (전체 리렌더링 없이)
  diagUpdateSelectionUI(qId, optId, isMultiple);
  diagUpdateNextButton();
}

// ★ 새로 추가: 선택 UI만 업데이트
function diagUpdateSelectionUI(qId, optId, isMultiple) {
  const options = document.querySelectorAll('.diag-option, .diag-option--with-gif');
  
  options.forEach(opt => {
    // onclick 속성에서 optId 추출
    const onclickAttr = opt.getAttribute('onclick') || '';
    const match = onclickAttr.match(/'([^']+)'/g);
    if (match && match.length >= 2) {
      const thisOptId = match[1].replace(/'/g, '');
      
      if (isMultiple) {
        const selected = (diagAnswers[qId] || []).includes(thisOptId);
        opt.classList.toggle('selected', selected);
      } else {
        opt.classList.toggle('selected', thisOptId === optId);
      }
    }
  });
}

function diagUpdateNextButton() {
  const q = diagVisibleQuestions[diagCurrentStep];
  const btn = document.getElementById('nextBtn');
  
  if (!q) {
    btn.disabled = true;
    return;
  }
  
  const ans = diagAnswers[q.id];
  
  if (q.multiple) {
    btn.disabled = !ans || ans.length === 0;
  } else {
    btn.disabled = !ans;
  }
}

// ★ 수정: 전환 시 애니메이션
function diagNextQuestion() {
  if (isTransitioning) return;
  isTransitioning = true;
  
  diagCurrentStep++;
  diagCalculateVisible();
  
  if (diagCurrentStep >= diagVisibleQuestions.length) {
    diagShowResult();
    isTransitioning = false;
  } else {
    diagRenderQuestion(true);  // 애니메이션 적용
    setTimeout(() => { isTransitioning = false; }, 350);
  }
}

function diagGoBack() {
  if (isTransitioning) return;
  
  if (diagCurrentStep > 0) {
    isTransitioning = true;
    diagCurrentStep--;
    diagRenderQuestion(true);
    setTimeout(() => { isTransitioning = false; }, 350);
  } else {
    if (window.history.length > 1) {
      window.history.back();
    }
  }
}

function diagShowResult() {
  document.getElementById('questionContent').style.display = 'none';
  document.getElementById('diagFooter').style.display = 'none';
  
  const resultEl = document.getElementById('resultContent');
  resultEl.classList.add('show');
  
  /* 개인화 메시지 생성 */
  let resultMsg = buildPersonalizedMessage(diagAnswers);

  const tags = [];
  const tagKeys = new Set(['Q_STAGE', 'Q_TYPE', 'Q_GENDER', 'Q_FING']); /* 핵심 태그만 표시 */
  Object.keys(diagAnswers).forEach(key => {
    if (!tagKeys.has(key)) return;
    const val = diagAnswers[key];
    if (Array.isArray(val)) {
      val.forEach(v => {
        if (labelMap[v]) tags.push(labelMap[v]);
      });
    } else {
      if (labelMap[val]) tags.push(labelMap[val]);
    }
  });

  const tagsHtml = tags.map(t => `<span class="diag-result-tag">${t}</span>`).join('');

  /* 복원수리 안내 섹션 (조건부) */
  const restoreHtml = buildRestorationSection(diagAnswers);

  resultEl.innerHTML = `
    <div class="diag-result-card">
      <span class="diag-result-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#C9A962" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:middle;display:inline"><path d="M12 2l2 6.5L20 12l-6 3.5L12 22l-2-6.5L4 12l6-3.5z" fill="#C9A962" stroke="#C9A962"/><circle cx="20" cy="4" r="1" fill="#C9A962" stroke="none"/><circle cx="4" cy="20" r="0.75" fill="#C9A962" stroke="none"/></svg> 진단 완료</span>
      <h2 class="diag-result-title">맞춤 가위 상담 준비 완료!</h2>
      <div class="diag-result-desc">${resultMsg}</div>
      <div class="diag-result-tags">${tagsHtml}</div>
    </div>

    ${restoreHtml}

    <div class="diag-result-actions">
      <button class="diag-result-btn diag-result-btn-primary" onclick="diagGoToRecommend()">
        진단에 알맞는 제품 보러가기
      </button>
      <p class="diag-result-btn-hint">진단 데이터를 기반으로 만족도 높은 제품을 안내해드려요<br>더 꼼꼼한 맞춤이 필요하시면 상담접수를 이용해주세요</p>

      <button class="diag-result-btn diag-result-btn-secondary" onclick="diagGoToConsult()">
        이 진단서로 상담접수하기
      </button>

      <button class="diag-result-btn diag-result-btn-secondary" onclick="diagInit()" style="margin-top: 8px;">
        다시 진단하기
      </button>
    </div>
  `;
}

/* =========================================================
   ★★★ 상담접수 연동 (아임웹 iframe 구조 대응) ★★★
   ========================================================= */

function diagGoToConsult() {
  // ★ URL 파라미터로 진단 데이터 전달 (도메인 간 localStorage 공유 불가)
  const diagData = encodeURIComponent(JSON.stringify(diagAnswers));
  const url = CONSULT_PAGE_URL + '?diagnosis=' + diagData;

  // ★ postMessage 방식으로 아임웹 부모 페이지 이동 (cross-origin 해결)
  window.parent.postMessage({ type: 'MAMORU_NAVIGATE', url: url }, '*');
}

// ★ 맞춤 추천 페이지로 이동
function diagGoToRecommend() {
  // ★ URL 파라미터로 진단 데이터 전달 (도메인 간 localStorage 공유 불가 대비)
  const diagData = encodeURIComponent(JSON.stringify(diagAnswers));
  const url = RECOMMEND_PAGE_URL + '?diagnosis=' + diagData;

  // localStorage도 시도 (같은 도메인일 경우 대비)
  try {
    localStorage.setItem('MAMORU_DIAGNOSIS', JSON.stringify(diagAnswers));
  } catch(e) {}

  // ★ postMessage 방식으로 아임웹 부모 페이지 이동 (cross-origin 해결)
  window.parent.postMessage({ type: 'MAMORU_NAVIGATE', url: url }, '*');
}

/* =========================================================
   iframe 높이 전송 (아임웹 코드위젯 대응)
   ========================================================= */
(function() {
  var lastSentHeight = 0; // 마지막 전송 높이 저장 (무한루프 방지)

  function getFullHeight() {
    var diagEl = document.querySelector('.mamoru-diagnosis');
    if (diagEl) {
      var rect = diagEl.getBoundingClientRect();
      return Math.ceil(rect.height + 50);
    }
    return Math.ceil(document.body.scrollHeight + 50);
  }

  function notifyHeight() {
    var height = getFullHeight();
    // 높이가 변경되었을 때만 전송 (무한루프 방지)
    if (window.parent && window.parent !== window && height > 0 && Math.abs(height - lastSentHeight) > 5) {
      lastSentHeight = height;
      window.parent.postMessage({ type: 'MAMORU_IFRAME_SIZE', height: height }, '*');
    }
  }

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'REQUEST_HEIGHT') notifyHeight();
  });

  window.addEventListener('load', function() {
    setTimeout(notifyHeight, 100);
    setTimeout(notifyHeight, 500);
    setTimeout(notifyHeight, 1000);
  });

  // resize 이벤트 debounce 적용 (무한루프 방지)
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(notifyHeight, 200);
  });

  // 질문 전환 시에도 높이 재계산
  var origRender = window.diagRenderQuestion;
  if (typeof origRender === 'function') {
    window.diagRenderQuestion = function() {
      origRender.apply(this, arguments);
      setTimeout(notifyHeight, 100);
    };
  }

  // ★ 결과 화면 전환 시에도 높이 재계산
  var origShowResult = window.diagShowResult;
  if (typeof origShowResult === 'function') {
    window.diagShowResult = function() {
      origShowResult.apply(this, arguments);
      setTimeout(notifyHeight, 100);
      setTimeout(notifyHeight, 500);
    };
  }
})();

// 초기화
diagInit();
</script>
