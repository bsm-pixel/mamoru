<div id="csWrapPC" style="position:relative; max-width: 1200px; margin: 0 auto;">
  <iframe
    id="csFramePC"
    src=""
    style="width:100%; height:1600px; border:0; display:block; overflow:hidden;"
    scrolling="no"
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
    allowtransparency="true">
  </iframe>
</div>
<script>
(function(){
  // ★ GitHub Pages의 page_form.html 로드 (GAS는 백엔드 API로만 사용)
  var PAGE_URL = 'https://bsm-pixel.github.io/mamoru/projects/consulting/page_form.html';
  var f = document.getElementById('csFramePC');

  // ★ URL 파라미터에서 진단 데이터 확인 (여러 방법 시도)
  var diagnosisData = null;

  // 방법 1: 현재 window
  try {
    var urlParams = new URLSearchParams(window.location.search);
    diagnosisData = urlParams.get('diagnosis');
    console.log('[MAMORU] window.location.search:', window.location.search);
  } catch(e) { console.log('[MAMORU] window.location 접근 실패'); }

  // 방법 2: top window (아임웹 페이지)
  if (!diagnosisData) {
    try {
      var topParams = new URLSearchParams(window.top.location.search);
      diagnosisData = topParams.get('diagnosis');
      console.log('[MAMORU] window.top.location.search:', window.top.location.search);
    } catch(e) { console.log('[MAMORU] window.top 접근 실패 (cross-origin)'); }
  }

  // 방법 3: parent window
  if (!diagnosisData) {
    try {
      var parentParams = new URLSearchParams(window.parent.location.search);
      diagnosisData = parentParams.get('diagnosis');
      console.log('[MAMORU] window.parent.location.search:', window.parent.location.search);
    } catch(e) { console.log('[MAMORU] window.parent 접근 실패 (cross-origin)'); }
  }

  // 방법 4: localStorage (모바일 대응 - iframe_diag.html에서 저장)
  if (!diagnosisData) {
    try {
      diagnosisData = localStorage.getItem('MAMORU_DIAGNOSIS_DATA');
      if (diagnosisData) {
        console.log('[MAMORU] localStorage에서 진단 데이터 읽기 성공');
        localStorage.removeItem('MAMORU_DIAGNOSIS_DATA');  // 사용 후 삭제
      }
    } catch(e) { console.log('[MAMORU] localStorage 접근 실패'); }
  }

  var finalURL = PAGE_URL;

  if (diagnosisData) {
    finalURL = PAGE_URL + '?diagnosis=' + encodeURIComponent(diagnosisData);
    console.log('[MAMORU] 진단 데이터 전달 성공:', diagnosisData);
  } else {
    console.log('[MAMORU] 진단 데이터 없음 - 일반 접수 모드');
  }

  f.src = finalURL;
  
  // 높이 자동 조절 - MAX 3000으로 제한 (5000은 과도함)
  var MIN = 1600, MAX = 3000;
  function setH(h){
    var hh = Math.max(MIN, Math.min(MAX, Number(h)||0));
    if (f && hh) f.style.height = hh + 'px';
  }
  
  window.addEventListener('message', function(e){
    var d = e && e.data;
    if (!d || d.type !== 'MAMORU_IFRAME_SIZE') return;
    setH((d.height||0) + 20);
  });
  
  f.addEventListener('load', function(){ setH(MIN); });
  setTimeout(function(){ setH(MIN); }, 3000);
})();
</script>
