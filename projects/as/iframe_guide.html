<!-- MAMORU 복원수리 안내 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯에 전체 복사하세요 ★ -->
<!-- 아임웹 경로: /60 -->

<style>
#mamoruAsGuideWrap {
  position: relative;
  width: 100%;
}
#mamoruAsGuideFrame {
  width: 100%;
  border: none;
  display: block;
}

/* ── 부모 측 모바일 floating CTA (iframe 안 fixed가 iframe document 끝점 기준이라 작동 X — 부모에서 직접 fixed) ── */
#mamoruAsFloatingCta {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9999;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: rgba(250,249,247,0.95);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(26,26,26,0.08);
  display: flex;
  justify-content: center;
  font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
#mamoruAsFloatingCta > button {
  max-width: 480px;
  width: 100%;
  padding: 14px 18px;
  border-radius: 12px;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  line-height: 1;
  background: #1A1A1A;
  color: #FAF9F7;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
#mamoruAsFloatingCta > button:active {
  transform: scale(0.98);
}
/* PC 768px 이상에서는 숨김 */
@media (min-width: 768px) {
  #mamoruAsFloatingCta { display: none !important; }
}
</style>

<div id="mamoruAsGuideWrap">
  <iframe
    id="mamoruAsGuideFrame"
    src="https://page.mamoru.kr/projects/as/page_guide.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<!-- 부모 측 floating CTA (모바일 한정, iframe 박스 외부 — 부모 viewport 기준 fixed) -->
<!-- 통합 접수 페이지 = /53 (마모루+타사 통합, 2026-03-10). page_guide.html 의 goToASForm() 과 동일 (2026-05-23 fix: /56 → /53) -->
<div id="mamoruAsFloatingCta" role="region" aria-label="복원수리 빠른 진입">
  <button onclick="window.location.href='/53'">복원수리 접수하기</button>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruAsGuideFrame');
  var currentHeight = 0;

  window.addEventListener('message', function(e) {
    if (e.origin !== 'https://page.mamoru.kr') return;

    // iframe 높이 조절
    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      if (newHeight !== currentHeight && newHeight > 0) {
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    // 맨 위로 스크롤 요청 처리
    if (e.data && e.data.type === 'MAMORU_SCROLL_TOP') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 페이지 이동 요청 처리 (cross-origin 해결)
    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });

  // 초기 높이
  iframe.style.height = (window.innerWidth <= 768 ? 2000 : 2500) + 'px';
})();
</script>
