<!-- AS 접수 코드위젯: 아임웹 /53 페이지에 붙여넣기 -->
<!-- [CONFIG] GitHub Pages URL - 필요시 수정 -->
<div id="asWrapPC" style="position:relative; max-width: 1200px; margin: 0 auto;">
  <iframe
    id="asFramePC"
    src=""
    style="width:100%; height:1600px; border:0; display:block; overflow:hidden;"
    scrolling="no"
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
    allowtransparency="true">
  </iframe>
</div>
<script>
(function(){
  // [CONFIG] GitHub Pages 호스팅 URL (GAS 대신 정적 페이지 사용)
  var PAGE_URL = 'https://bsm-pixel.github.io/mamoru/projects/as/page_form.html';
  var f = document.getElementById('asFramePC');

  f.src = PAGE_URL;

  // 높이 자동 조절 (debounce 적용 - 무한루프 방지)
  var MIN = 1600, MAX = 5000;
  var lastHeight = 0;
  var debounceTimer = null;
  var heightReceived = false; // postMessage 수신 여부

  function setH(h){
    var hh = Math.max(MIN, Math.min(MAX, Number(h)||0));
    // 높이 변화가 10px 이상일 때만 업데이트 (무한루프 방지)
    if (f && hh && Math.abs(hh - lastHeight) > 10) {
      f.style.height = hh + 'px';
      lastHeight = hh;
    }
  }

  window.addEventListener('message', function(e){
    var d = e && e.data;
    if (!d) return;

    // iframe 높이 조절
    if (d.type === 'MAMORU_IFRAME_SIZE') {
      heightReceived = true;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function(){ setH(d.height||0); }, 60);
      return;
    }

    // 모달/달력 중앙 배치용 뷰포트 정보 응답
    if (d.type === 'MAMORU_REQUEST_VIEWPORT') {
      var rect = f.getBoundingClientRect();
      var visibleTop = Math.max(0, -rect.top);
      var visibleHeight = Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0);
      if (visibleHeight > 0) {
        f.contentWindow.postMessage({
          type: 'MAMORU_VIEWPORT_INFO',
          visibleTop: visibleTop,
          visibleHeight: visibleHeight
        }, '*');
      }
    }
  });

  // postMessage가 3초 내 안 오면 MIN 유지, 왔으면 건드리지 않음
  f.addEventListener('load', function(){
    setTimeout(function(){ if (!heightReceived) setH(MIN); }, 3000);
  });
})();
</script>
