<!-- MAMORU 브랜드 소개 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯에 전체 복사하세요 ★ -->
<!-- GitHub Pages 이전 버전 - postMessage 동적 높이 조절 -->

<style>
#mamoruIntroWrap {
  position: relative;
  width: 100%;
}
#mamoruIntroFrame {
  width: 100%;
  border: none;
  display: block;
}
</style>

<div id="mamoruIntroWrap">
  <iframe
    id="mamoruIntroFrame"
    src="https://bsm-pixel.github.io/mamoru/projects/brand/page_intro.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruIntroFrame');
  var currentHeight = 0;

  // postMessage로 동적 높이 수신 (index.html에서 MAMORU_IFRAME_SIZE 타입으로 전송)
  window.addEventListener('message', function(e) {
    // GitHub Pages origin 확인
    if (e.origin !== 'https://bsm-pixel.github.io') return;

    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      if (newHeight !== currentHeight && newHeight > 0) {
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    // 페이지 이동 요청 처리 (cross-origin 해결)
    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });

  // 초기 높이 (postMessage 수신 전 fallback — 섹션 추가 후 재측정)
  iframe.style.height = (window.innerWidth <= 768 ? 4800 : 7200) + 'px';
})();
</script>
