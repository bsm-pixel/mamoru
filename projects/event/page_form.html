<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MAMORU · EVENT 접수</title>
<style>
  :root{ --void:#1A1A1A; --ink:#2A2A2A; --gray:#8A8A8A; --line:#E7E5E2; --shell:#F4F2EF; --cream:#FAF9F7; --ok:#2563EB; --warn:#B45309; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html{ overflow-x:hidden; }
  body{ font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,system-ui,sans-serif; color:var(--ink); background:var(--cream); line-height:1.55; }
  .mm-wrap{ max-width:560px; margin:0 auto; padding:24px 18px 120px; }
  .mm-head{ text-align:center; padding:8px 0 18px; }
  .mm-head__kicker{ font-size:11px; letter-spacing:.18em; color:var(--gray); text-transform:uppercase; }
  .mm-head__title{ font-size:27px; font-weight:800; color:var(--void); margin-top:6px; letter-spacing:-.02em; }
  .mm-head__sub{ font-size:13px; color:var(--gray); margin-top:8px; }
  .mm-sec{ margin-top:28px; }
  .mm-sec__label{ font-size:15px; font-weight:800; color:var(--void); margin-bottom:12px; display:flex; align-items:center; gap:8px; letter-spacing:-.01em; }
  .mm-sec__label::before{ content:''; width:3px; height:15px; border-radius:2px; background:var(--void); flex:0 0 auto; }
  .mm-sec__label small{ font-weight:500; color:var(--gray); font-size:12px; }
  .mm-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .mm-chip{ flex:1 1 auto; min-width:72px; text-align:center; padding:11px 10px; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; transition:.15s; }
  .mm-chip[aria-pressed="true"]{ background:var(--void); color:#fff; border-color:var(--void); }
  .mm-card{ border:1px solid var(--line); border-radius:14px; background:#fff; padding:14px; margin-bottom:10px; }
  .mm-card__row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .mm-card__name{ font-size:14px; font-weight:700; color:var(--void); }
  .mm-card__meta{ font-size:12px; color:var(--gray); margin-top:2px; }
  .mm-card__price{ font-size:15px; font-weight:800; color:var(--void); white-space:nowrap; }
  .mm-stock{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; margin-top:6px; }
  .mm-stock--low{ background:#FEF3C7; color:var(--warn); }
  .mm-stock--ok{ background:#EEF2FF; color:var(--ok); }
  .mm-stock--soldout{ background:#F3F4F6; color:#9CA3AF; }
  .mm-card__ctrl{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px; }
  .mm-qty{ display:flex; align-items:center; gap:8px; }
  .mm-qty button{ width:34px; height:34px; border:1px solid var(--line); border-radius:9px; background:#fff; font-size:18px; cursor:pointer; }
  .mm-qty span{ min-width:24px; text-align:center; font-weight:700; }
  .mm-add{ flex:1; min-width:90px; height:38px; border-radius:10px; background:var(--void); color:#fff; font-size:13px; font-weight:700; border:0; cursor:pointer; }
  .mm-add:disabled{ background:#CFCBC6; cursor:not-allowed; }
  .mm-slice{ display:flex; align-items:flex-start; gap:8px; margin-top:10px; padding:9px 10px; background:var(--shell); border-radius:10px; font-size:12px; color:var(--ink); }
  .mm-slice input{ margin-top:2px; width:16px; height:16px; }
  .mm-slice b{ color:var(--void); }
  .mm-cart{ border:1px solid var(--void); border-radius:14px; background:#fff; padding:14px; }
  .mm-cart__item{ display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); }
  .mm-cart__item button{ color:#C0392B; background:none; border:0; font-size:11px; cursor:pointer; }
  .mm-cart__total{ display:flex; justify-content:space-between; font-size:15px; font-weight:800; color:var(--void); padding-top:10px; }
  .mm-field{ margin-top:12px; }
  .mm-field label{ display:block; font-size:12px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .mm-field input, .mm-field textarea{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:11px; font-size:14px; background:#fff; font-family:inherit; }
  .mm-field textarea{ resize:none; min-height:64px; }
  .mm-consent{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--gray); margin-top:14px; }
  .mm-submit{ position:fixed; left:0; right:0; bottom:0; padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(250,249,247,0),var(--cream) 30%); }
  .mm-submit__inner{ max-width:560px; margin:0 auto; }
  .mm-submit button{ width:100%; height:52px; border-radius:14px; background:var(--void); color:#fff; font-size:15px; font-weight:800; border:0; cursor:pointer; }
  .mm-submit button:disabled{ background:#CFCBC6; }
  .mm-empty{ font-size:13px; color:var(--gray); text-align:center; padding:18px 0; }
  .mm-modal{ position:fixed; inset:0; background:rgba(26,26,26,.45); display:none; align-items:center; justify-content:center; padding:24px; z-index:50; }
  .mm-modal.on{ display:flex; }
  .mm-modal__box{ background:#fff; border-radius:18px; padding:26px 22px; max-width:340px; text-align:center; }
  .mm-modal__box h3{ font-size:18px; font-weight:800; color:var(--void); }
  .mm-modal__box p{ font-size:13px; color:var(--gray); margin-top:8px; }
  .mm-modal__box button{ margin-top:18px; width:100%; height:46px; border-radius:12px; background:var(--void); color:#fff; font-weight:700; border:0; }
  .mm-hide{ display:none !important; }
  /* 주소 검색 행 + 비활성 입력 */
  .mm-addr-search{ display:flex; gap:8px; }
  .mm-addr-search input{ flex:1; min-width:0; }
  .mm-addr-btn{ flex-shrink:0; padding:0 14px; border-radius:11px; background:var(--void); color:#fff; font-size:13px; font-weight:700; border:0; white-space:nowrap; cursor:pointer; }
  .mm-field input[readonly]{ background:var(--shell); }
  .mm-field input:disabled{ background:#F0EEEB; color:#B8B4AF; cursor:not-allowed; }
  /* 다음 우편번호 레이어 (하단 시트) */
  .mm-pc-layer{ position:fixed; inset:0; background:rgba(26,26,26,.5); z-index:70; display:none; align-items:flex-end; }
  .mm-pc-layer.on{ display:flex; }
  .mm-pc-box{ background:#fff; width:100%; max-height:82vh; border-radius:18px 18px 0 0; overflow:hidden; display:flex; flex-direction:column; }
  .mm-pc-head{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); font-weight:700; font-size:14px; }
  .mm-pc-head button{ width:30px; height:30px; border:0; background:var(--shell); border-radius:8px; font-size:15px; cursor:pointer; }
  .mm-pc-inner{ min-height:160px; } /* 높이는 Daum onresize가 내용에 맞춰 동적 설정 (빈 흰 공간 방지) */
  /* 상단 안내장 캐러셀 (가로 스와이프, 1000×1500=2:3, 자동재생 X) — full-bleed: 폭 끝·상단까지 꽉 */
  .mm-car-wrap{ position:relative; margin:-24px -18px 18px; }
  /* 슬라이드 페이지 카운터 (1/N) — 여러 장·넘기기 신호 */
  .mm-car-count{ position:absolute; top:14px; right:14px; display:none; background:rgba(26,26,26,.55); color:#fff; font-size:11px; font-weight:700; letter-spacing:.3px; padding:4px 10px; border-radius:999px; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); z-index:2; }
  .mm-car{ display:flex; gap:0; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .mm-car::-webkit-scrollbar{ display:none; }
  .mm-slide{ flex:0 0 100%; scroll-snap-align:start; }
  .mm-slide img{ display:block; width:100%; aspect-ratio:1000/1500; object-fit:cover; }
  .mm-car-dots{ display:flex; justify-content:center; gap:6px; margin-top:11px; }
  .mm-dot{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:width .2s, background .2s; }
  .mm-dot.on{ background:var(--void); width:18px; border-radius:3px; }
  /* SVG 아이콘 공간 (사장님 업로드 전 임시 X) */
  .mm-chip--ico{ display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:10px; padding-bottom:10px; }
  .mm-chip__ico{ width:30px; height:30px; object-fit:contain; }
  .mm-ico-x{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1.5px dashed var(--line); border-radius:8px; color:#C9C5C0; font-size:14px; }
  .mm-chip[aria-pressed="true"] .mm-ico-x{ border-color:rgba(255,255,255,.4); color:rgba(255,255,255,.7); }
  /* 선택(검정 배경) 시 손 아이콘 흰색 반전 */
  .mm-chip[aria-pressed="true"] .mm-chip__ico{ filter: brightness(0) invert(1); }
  .mm-catgroup__h{ display:flex; align-items:center; gap:9px; }
  .mm-cat-ico{ width:24px; height:24px; object-fit:contain; }
  .mm-cat-ico-x{ width:24px; height:24px; display:flex; align-items:center; justify-content:center; border:1.5px dashed var(--line); border-radius:6px; color:#C9C5C0; font-size:11px; }
  /* 분류명 — 단위(인치/감모량)는 우측, 카드별 단위 반복 제거. 페이지 제목보다 작게(위계) */
  .mm-catgroup__name{ font-size:19px; font-weight:800; line-height:1.1; }
  .mm-catgroup__unit{ margin-left:auto; font-size:12px; font-weight:600; color:#9A948C; white-space:nowrap; }
  /* 카탈로그 — 종류별 섹션 + 카드(spec 상단 / 가격칩 하단) */
  .mm-catgroup{ margin-top:22px; }
  .mm-catgroup__h{ color:var(--void); margin-bottom:12px; padding-bottom:8px; border-bottom:1.5px solid var(--void); }
  .mm-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:460px){ .mm-grid{ grid-template-columns:repeat(3,1fr); } }
  .mm-pcard{ border:1px solid var(--line); border-radius:16px; background:#fff; padding:14px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .mm-pcard__spec{ font-size:16px; font-weight:800; color:var(--void); line-height:1.25; min-height:40px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .mm-pcard__price{ font-size:13px; font-weight:800; color:var(--void); background:#fff; border:1.5px solid var(--void); border-radius:999px; padding:5px 14px; }
  /* 가격대별 은은한 톤 (저→고: 세이지→블루→라벤더, 부정색 X) */
  .mm-pcard--t1{ background:#F2F6F3; border-color:#DCE8E0; }
  .mm-pcard--t1 .mm-pcard__price{ color:#3F7A5A; border-color:#BFD9C8; }
  .mm-pcard--t2{ background:#EEF1FB; border-color:#DBE3F5; }
  .mm-pcard--t2 .mm-pcard__price{ color:#3A5BB0; border-color:#C5D2F0; }
  .mm-pcard--t3{ background:#F4EFFB; border-color:#E5DBF2; }
  .mm-pcard--t3 .mm-pcard__price{ color:#6B4BA8; border-color:#D8C8EE; }
  /* 가격 필터 칩 — 카드와 동일 가격대 톤(미선택=은은한 틴트, 선택=진한 동일색) */
  .mm-chip--t1{ background:#F2F6F3; border-color:#DCE8E0; color:#3F7A5A; }
  .mm-chip--t2{ background:#EEF1FB; border-color:#DBE3F5; color:#3A5BB0; }
  .mm-chip--t3{ background:#F4EFFB; border-color:#E5DBF2; color:#6B4BA8; }
  .mm-chip--t1[aria-pressed="true"]{ background:#3F7A5A; border-color:#3F7A5A; color:#fff; }
  .mm-chip--t2[aria-pressed="true"]{ background:#3A5BB0; border-color:#3A5BB0; color:#fff; }
  .mm-chip--t3[aria-pressed="true"]{ background:#6B4BA8; border-color:#6B4BA8; color:#fff; }
  .mm-pcard .mm-stock{ margin:0; }
  .mm-pcard__add{ width:100%; height:34px; border-radius:10px; background:var(--void); color:#fff; font-size:12px; font-weight:700; border:0; cursor:pointer; }
  .mm-pcard__add:disabled{ background:#CFCBC6; }
  .mm-pcard__qty{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .mm-pcard__qty button{ width:28px; height:28px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:15px; cursor:pointer; }
  .mm-pcard__slice{ display:flex; align-items:flex-start; gap:6px; font-size:10px; color:var(--ink); text-align:left; background:var(--shell); border-radius:8px; padding:6px 7px; }
  .mm-pcard__slice input{ margin-top:1px; }
</style>
</head>
<body>
<div class="mm-wrap">
  <!-- 상단 안내장 캐러셀 — icons/event-slide-1~3.png (있는 만큼 자동 표시, 없으면 영역 숨김) -->
  <div class="mm-car-wrap" id="mmCarWrap" style="display:none;">
    <div class="mm-car-count" id="mmCarCount"></div>
    <div class="mm-car" id="mmCar"></div>
    <div class="mm-car-dots" id="mmCarDots"></div>
  </div>

  <div class="mm-head">
    <div class="mm-head__kicker">MAMORU EVENT</div>
    <div class="mm-head__title" id="catTitle">EVENT 접수</div>
    <div class="mm-head__sub">원하시는 가위를 선택해 접수해 주세요.<br/>재고 확인 후 입금 안내를 보내드립니다.</div>
  </div>

  <!-- 손 -->
  <div class="mm-sec">
    <div class="mm-sec__label">1. 가위 종류 (손)</div>
    <div class="mm-chips" id="handChips">
      <button class="mm-chip mm-chip--ico" data-hand="left" aria-pressed="false">
        <img class="mm-chip__ico" src="icons/hand-left.svg" alt="" onerror="this.outerHTML='<span class=&quot;mm-ico-x&quot;>✕</span>'"/>
        <span>왼손</span>
      </button>
      <button class="mm-chip mm-chip--ico" data-hand="right" aria-pressed="false">
        <img class="mm-chip__ico" src="icons/hand-right.svg" alt="" onerror="this.outerHTML='<span class=&quot;mm-ico-x&quot;>✕</span>'"/>
        <span>오른손</span>
      </button>
    </div>
  </div>

  <!-- 가격 필터 -->
  <div class="mm-sec mm-hide" id="priceSec">
    <div class="mm-sec__label">2. 가격</div>
    <div class="mm-chips" id="priceChips"></div>
  </div>

  <!-- 카탈로그 (종류별 섹션 + 카드) -->
  <div class="mm-sec mm-hide" id="catalogSec">
    <div class="mm-sec__label">3. 품목 선택 <small>원하는 가위를 담아주세요</small></div>
    <div id="catalog"></div>
  </div>

  <!-- 장바구니 -->
  <div class="mm-sec mm-hide" id="cartSec">
    <div class="mm-sec__label">선택한 품목</div>
    <div class="mm-cart">
      <div id="cartItems"></div>
      <div class="mm-cart__total"><span>합계</span><span id="cartTotal">0원</span></div>
    </div>
  </div>

  <!-- 수령방법 -->
  <div class="mm-sec mm-hide" id="receiveSec">
    <div class="mm-sec__label">수령 방법</div>
    <div class="mm-chips">
      <button class="mm-chip" data-recv="delivery" aria-pressed="true">택배 발송</button>
      <button class="mm-chip" data-recv="visit" aria-pressed="false">매장 방문</button>
    </div>
  </div>

  <!-- 접수자 정보 (성함·연락처 필수) -->
  <div class="mm-sec mm-hide" id="contactSec">
    <div class="mm-sec__label">접수자 정보</div>
    <div class="mm-field"><label>성함 *</label><input id="name" placeholder="성함" /></div>
    <div class="mm-field"><label>연락처 *</label><input id="phone" inputmode="numeric" placeholder="010-0000-0000" /></div>
  </div>

  <!-- 배송지 (택배 발송 시) -->
  <div class="mm-sec mm-hide" id="addrSec">
    <div class="mm-sec__label">배송지</div>
    <div class="mm-field">
      <label>주소</label>
      <div class="mm-addr-search">
        <input id="postcode" readonly placeholder="우편번호" />
        <button type="button" id="addrSearchBtn" class="mm-addr-btn">주소 검색</button>
      </div>
    </div>
    <div class="mm-field"><input id="address1" readonly placeholder="도로명 주소 (검색)" /></div>
    <div class="mm-field"><input id="address2" disabled placeholder="상세 주소 (주소 검색 후 입력)" /></div>
  </div>

  <!-- 메모 + 동의 -->
  <div class="mm-sec mm-hide" id="extraSec">
    <div class="mm-field"><label>메모 (선택)</label><textarea id="memo" placeholder="요청사항이 있으면 적어주세요"></textarea></div>
    <label class="mm-consent"><input type="checkbox" id="consent" /> 개인정보 수집·이용에 동의합니다 (접수·배송 목적)</label>
  </div>
</div>

<!-- 다음 우편번호 검색 레이어 -->
<div class="mm-pc-layer" id="pcLayer">
  <div class="mm-pc-box">
    <div class="mm-pc-head"><span>주소 검색</span><button type="button" id="pcClose">✕</button></div>
    <div class="mm-pc-inner" id="pcInner"></div>
  </div>
</div>

<div class="mm-submit">
  <div class="mm-submit__inner">
    <button id="submitBtn" disabled>품목을 선택해 주세요</button>
  </div>
</div>

<div class="mm-modal" id="doneModal">
  <div class="mm-modal__box">
    <h3>신청이 완료되었습니다</h3>
    <p>곧 알림톡을 통하여 안내드리겠습니다.</p>
    <button onclick="closeInapp()">확인</button>
    <p id="doneHint" style="display:none; font-size:12px; color:var(--gray); margin-top:12px; line-height:1.5;">창이 자동으로 닫히지 않으면<br/>좌측 상단 ✕ 또는 뒤로가기로 닫아주세요.</p>
  </div>
</div>

<script>
/* 접수 완료 후 인앱 브라우저 닫기 — 카톡 인앱은 scheme로 닫힘, 그 외는 뒤로가기/close 시도 후 안내 */
function closeInapp(){
  var ua=navigator.userAgent||'';
  var isKakao=/KAKAOTALK/i.test(ua);
  var isIOS=/iPhone|iPad|iPod/i.test(ua);
  if(isKakao){
    location.href = isIOS ? 'kakaoweb://closeBrowser' : 'kakaotalk://inappbrowser/close';
    setTimeout(function(){ if(history.length>1) history.back(); }, 600);
    setTimeout(function(){ try{ window.close(); }catch(e){} }, 1200);
  } else {
    try{ window.close(); }catch(e){}
    if(history.length>1) history.back();
  }
  // 닫기 실패 대비 — 보조 안내 노출
  setTimeout(function(){ var h=document.getElementById('doneHint'); if(h) h.style.display='block'; }, 1300);
}

/* 상단 안내장 캐러셀 — 존재하는 슬라이드만 순서대로 표시 + 도트 동기화 (자동재생 X) */
(function(){
  var track = document.getElementById('mmCar'), dots = document.getElementById('mmCarDots'), wrap = document.getElementById('mmCarWrap'), count = document.getElementById('mmCarCount');
  if (!track) return;
  var srcs = ['icons/event-slide-1.png','icons/event-slide-2.png','icons/event-slide-3.png'];
  var exists = new Array(srcs.length).fill(false), done = 0;
  srcs.forEach(function(src, i){
    var im = new Image();
    im.onload = function(){ exists[i] = true; tick(); };
    im.onerror = function(){ exists[i] = false; tick(); };
    im.src = src;
  });
  function tick(){ if (++done < srcs.length) return; build(); }
  function build(){
    var ok = srcs.filter(function(_, i){ return exists[i]; });
    if (ok.length === 0) { wrap.style.display = 'none'; return; }
    ok.forEach(function(src, i){
      var s = document.createElement('div'); s.className = 'mm-slide';
      var im = document.createElement('img'); im.src = src; im.alt = 'EVENT 안내 ' + (i+1); s.appendChild(im);
      track.appendChild(s);
      var d = document.createElement('span'); d.className = 'mm-dot' + (i === 0 ? ' on' : ''); dots.appendChild(d);
    });
    wrap.style.display = 'block';
    if (ok.length < 2) { dots.style.display = 'none'; }
    else { count.style.display = 'block'; count.textContent = '1 / ' + ok.length; }
    track.addEventListener('scroll', function(){
      var idx = Math.max(0, Math.min(ok.length - 1, Math.round(track.scrollLeft / track.clientWidth)));
      for (var i = 0; i < dots.children.length; i++) dots.children[i].classList.toggle('on', i === idx);
      if (ok.length >= 2) count.textContent = (idx + 1) + ' / ' + ok.length;
    }, { passive: true });
  }
})();
(function(){
  var API = 'https://app-eta-sandy-75.vercel.app/api/event/public';
  var SLICE = 20000;
  var TYPES = [{k:'blunt',l:'블런트'},{k:'thinning',l:'틴닝'},{k:'long',l:'장가위'},{k:'dry',l:'DRY'}];
  var REDUCTION = {under20:'20% 미만','21to29':'21~29%',over30:'30% 이상'};
  var $ = function(id){ return document.getElementById(id); };
  // 이벤트 가벼운 느낌 — 만원 단위 표기 (50000→5만, 130000→13만, 135000→13.5만)
  var won = function(n){
    n = n||0;
    if(n>=10000){ var m=n/10000; return ((m%1===0)?String(m):String(Math.round(m*10)/10))+'만'; }
    return n.toLocaleString()+'원';
  };

  var CAT_ORDER = [{k:'blunt',l:'블런트'},{k:'long',l:'장가위'},{k:'thinning',l:'틴닝'},{k:'dry',l:'DRY'}];
  var products = [], curHand = '', curPrice = null, recv = 'delivery';
  var cart = []; // {key, product_id, product_name, category_type, spec, slicing, qty, unit_price}
  var CAMPAIGN_ID = (new URLSearchParams(location.search).get('campaign')) || ''; // 캠페인별 접수 구분
  var CAMPAIGN_BASE = 'https://app-eta-sandy-75.vercel.app/api/campaigns';
  var DISCOUNT_RULES = []; // [{unit_price,min_qty,bundle_price}] 같은 단가 묶음할인

  // 로드 — 캠페인(할인규칙·기본) 먼저 → 그 캠페인 품목만 로드
  fetch(CAMPAIGN_BASE).then(function(r){return r.json();}).then(function(j){
    var list = j.campaigns||[];
    var c = CAMPAIGN_ID ? list.filter(function(x){return x.id===CAMPAIGN_ID;})[0]
                        : list.filter(function(x){return x.is_default && x.status==='active';})[0];
    if(c){ DISCOUNT_RULES = c.discount_rules||[]; CAMPAIGN_ID=c.id; var t=$('catTitle'); if(t) t.textContent=c.name; }
    loadProducts();
  }).catch(function(){ loadProducts(); });

  function loadProducts(){
    var url = API+'/products'+(CAMPAIGN_ID?('?campaign='+encodeURIComponent(CAMPAIGN_ID)):'');
    fetch(url).then(function(r){return r.json();}).then(function(j){
      products = (j.items||[]);
      if(curHand) renderCatalog();
    }).catch(function(){});
  }

  // 손 선택 → 가격칩 + 카탈로그
  [].forEach.call(document.querySelectorAll('#handChips [data-hand]'), function(b){
    b.onclick=function(){
      curHand=b.getAttribute('data-hand');
      curPrice=null; // 손 바꾸면 가격필터 초기화
      [].forEach.call($('handChips').children, function(x){ x.setAttribute('aria-pressed', x.getAttribute('data-hand')===curHand?'true':'false'); });
      renderPriceChips();
      $('catalogSec').classList.remove('mm-hide');
      renderCatalog();
    };
  });

  // 가격 필터 칩 (현재 손의 품목 중 distinct 가격, 오름차순) — 5만/10만/20만
  function renderPriceChips(){
    var c=$('priceChips'); c.innerHTML='';
    var prices=[];
    products.filter(function(p){return (p.hand||'right')===curHand;}).forEach(function(p){ if(prices.indexOf(p.price)<0) prices.push(p.price); });
    prices.sort(function(a,b){return a-b;});
    var all=document.createElement('button'); all.className='mm-chip'; all.textContent='전체';
    all.setAttribute('aria-pressed', curPrice===null?'true':'false');
    all.onclick=function(){ curPrice=null; renderPriceChips(); renderCatalog(); };
    c.appendChild(all);
    prices.forEach(function(pr){
      var b=document.createElement('button'); b.className='mm-chip mm-chip--'+priceTier(pr);
      b.setAttribute('aria-pressed', curPrice===pr?'true':'false');
      b.textContent=won(pr);
      b.onclick=function(){ curPrice=pr; renderPriceChips(); renderCatalog(); };
      c.appendChild(b);
    });
    $('priceSec').classList.remove('mm-hide');
  }

  // 가격 계산 (서버 lib/event/pricing.ts 와 동일 로직 — 함께 수정)
  function priceCart(){
    var byPrice={}, slicing=0, listTotal=0;
    cart.forEach(function(it){
      var q=Math.max(1,it.qty||1), p=it.unit_price||0;
      byPrice[p]=(byPrice[p]||0)+q; listTotal+=p*q;
      if(it.slicing) slicing+=SLICE*q;
    });
    var base=0;
    Object.keys(byPrice).forEach(function(ps){
      var p=Number(ps), q=byPrice[ps];
      var rule=(DISCOUNT_RULES||[]).filter(function(r){return Number(r.unit_price)===p && r.min_qty>0 && r.bundle_price>0 && q>=r.min_qty;})[0];
      if(rule){ var b=Math.floor(q/rule.min_qty), rem=q%rule.min_qty; base+=b*rule.bundle_price+rem*p; }
      else base+=q*p;
    });
    return { base:base, slicing:slicing, total:base+slicing, listTotal:listTotal, discount:listTotal-base };
  }

  function renderCatalog(){
    var box=$('catalog'); box.innerHTML='';
    var any=false;
    CAT_ORDER.forEach(function(cat){
      var inCat = products.filter(function(p){
        return (p.hand||'right')===curHand && (p.event_type||'')===cat.k
          && (curPrice===null || p.price===curPrice);
      });
      inCat.sort(function(a,b){ return (a.price||0)-(b.price||0); }); // 5만→10만→20만 순
      if(!inCat.length) return;
      any=true;
      var g=document.createElement('div'); g.className='mm-catgroup';
      var h=document.createElement('div'); h.className='mm-catgroup__h';
      var ico=document.createElement('img'); ico.className='mm-cat-ico'; ico.src='icons/cat-'+cat.k+'.svg'; ico.alt='';
      ico.onerror=function(){ var x=document.createElement('span'); x.className='mm-cat-ico-x'; x.textContent='✕'; ico.replaceWith(x); };
      var hl=document.createElement('span'); hl.className='mm-catgroup__name'; hl.textContent=cat.l;
      var unit=document.createElement('span'); unit.className='mm-catgroup__unit';
      unit.textContent=(cat.k==='thinning')?'감모량으로 표기':'인치로 표기';
      h.appendChild(ico); h.appendChild(hl); h.appendChild(unit); g.appendChild(h);
      var grid=document.createElement('div'); grid.className='mm-grid';
      inCat.forEach(function(p){ grid.appendChild(productCard(p)); });
      g.appendChild(grid); box.appendChild(g);
    });
    if(!any){ box.innerHTML='<div class="mm-empty">해당 조건의 품목이 없습니다.</div>'; }
  }

  function priceTier(n){ return n<70000 ? 't1' : (n<150000 ? 't2' : 't3'); } // 5만/10만/20만급

  var DRY_LABEL = { stroke:'스트록', slicing:'슬라이싱', curve:'커브' };

  function productCard(p){
    var card=document.createElement('div'); card.className='mm-pcard mm-pcard--'+priceTier(p.price||0);
    // 슬라이싱 가공 추가 체크란은 'DRY 스트록'에만 (슬라이싱·커브는 미표시)
    var isDryStroke = (p.event_type==='dry') && (p.dry_subtype==='stroke');
    var qty=1, slicing=false;
    var specTxt = (p.event_type==='dry') ? (p.spec || DRY_LABEL[p.dry_subtype] || 'DRY') : (p.spec||p.name||'');
    // 옵션값에 '|' 또는 줄바꿈 넣으면 카드에서 줄바꿈 표시 (예: "슬라이싱|5.8 - 6.0 인치")
    var spec=document.createElement('div'); spec.className='mm-pcard__spec';
    spec.innerHTML=specTxt.split(/[|\n]/).map(function(s){return esc(s.trim());}).filter(Boolean).join('<br>');
    var price=document.createElement('div'); price.className='mm-pcard__price'; price.textContent=won(p.price);
    var stock=document.createElement('span'); stock.className='mm-stock mm-stock--'+(p.stock_tone||'ok'); stock.textContent=p.stock_text||'';
    card.appendChild(spec); card.appendChild(price); card.appendChild(stock);
    if(isDryStroke){
      var sl=document.createElement('label'); sl.className='mm-pcard__slice';
      sl.innerHTML='<input type="checkbox"/><span>슬라이싱 가공 +'+won(SLICE)+' (모발 밀림형, 직접 가공)</span>';
      sl.children[0].onchange=function(e){ slicing=e.target.checked; };
      card.appendChild(sl);
    }
    // 재고 상한 — 재고 수만큼만 담기 가능 (초과 방지)
    var maxQty = (typeof p.stock==='number' && p.stock>0) ? p.stock : 1;
    var qd=document.createElement('div'); qd.className='mm-pcard__qty';
    qd.innerHTML='<button type="button">−</button><span>1</span><button type="button">+</button>';
    qd.children[0].onclick=function(){ qty=Math.max(1,qty-1); qd.children[1].textContent=qty; };
    qd.children[2].onclick=function(){ if(qty<maxQty){ qty=qty+1; qd.children[1].textContent=qty; } };
    card.appendChild(qd);
    var add=document.createElement('button'); add.className='mm-pcard__add'; add.textContent='담기';
    if(p.soldout){ add.disabled=true; add.textContent='소진 완료'; }
    add.onclick=function(){ addToCart(p, qty, slicing); };
    card.appendChild(add);
    return card;
  }

  function addToCart(p, qty, slicing){
    cart.push({ key:Date.now()+'-'+Math.random().toString(36).slice(2,6),
      product_id:p.id, product_name:p.name, category_type:(p.event_type||''), spec:(p.spec||''),
      slicing:!!slicing, qty:qty, unit_price:p.price });
    renderCart();
  }

  function renderCart(){
    var sec=$('cartSec'), items=$('cartItems'); items.innerHTML='';
    if(!cart.length){ sec.classList.add('mm-hide'); showTail(false); updateSubmit(); return; }
    cart.forEach(function(it){
      var line = it.unit_price*it.qty + (it.slicing?SLICE*it.qty:0);
      var row=document.createElement('div'); row.className='mm-cart__item';
      row.innerHTML='<span>'+esc(it.product_name)+(it.slicing?' (슬라이싱)':'')+' ×'+it.qty+'</span><span>'+won(line)+' <button>삭제</button></span>';
      row.querySelector('button').onclick=function(){ cart=cart.filter(function(x){return x.key!==it.key;}); renderCart(); };
      items.appendChild(row);
    });
    var pr = priceCart();
    if(pr.discount>0){
      var d=document.createElement('div'); d.className='mm-cart__item'; d.style.color='#B45309';
      d.innerHTML='<span>묶음 할인</span><span>-'+won(pr.discount)+'</span>';
      items.appendChild(d);
    }
    $('cartTotal').textContent=won(pr.total);
    sec.classList.remove('mm-hide'); showTail(true); updateSubmit();
  }

  function showTail(on){
    $('receiveSec').classList.toggle('mm-hide', !on);
    $('contactSec').classList.toggle('mm-hide', !on);
    $('extraSec').classList.toggle('mm-hide', !on);
    // 배송지는 택배일 때만
    $('addrSec').classList.toggle('mm-hide', !on || recv==='visit');
  }

  // 수령방법
  [].forEach.call(document.querySelectorAll('[data-recv]'), function(b){
    b.onclick=function(){
      recv=b.getAttribute('data-recv');
      document.querySelectorAll('[data-recv]').forEach(function(x){x.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');
      $('addrSec').classList.toggle('mm-hide', recv==='visit');
    };
  });

  // 다음(Daum) 우편번호 검색 — 임베드 레이어 (인앱 안전)
  function loadDaum(cb){
    if(window.daum && window.daum.Postcode){ cb(); return; }
    var s=document.createElement('script');
    s.src='https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    s.onload=cb; s.onerror=function(){ alert('주소검색을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.'); };
    document.head.appendChild(s);
  }
  function openPostcode(){
    loadDaum(function(){
      // 레이어 먼저 표시(컨테이너 크기 확보) → display:none 상태에서 embed하면 iframe이 0높이로 빈 채 렌더됨
      $('pcInner').innerHTML='';
      $('pcLayer').classList.add('on');
      requestAnimationFrame(function(){
        new daum.Postcode({
          oncomplete:function(d){
            $('postcode').value = d.zonecode || '';
            $('address1').value = d.roadAddress || d.jibunAddress || '';
            var a2=$('address2'); a2.disabled=false; a2.placeholder='상세 주소 (동·호수 등)';
            $('pcLayer').classList.remove('on');
            a2.focus();
          },
          // 내용 높이에 맞춰 시트 크기 조절 — 결과 적을 때 아래 빈 흰 공간 방지(최대 72vh, 넘으면 내부 스크롤)
          onresize:function(size){
            var inner=$('pcInner');
            if(inner) inner.style.height = Math.min(size.height||400, Math.round(window.innerHeight*0.72)) + 'px';
          },
          width:'100%'
        }).embed($('pcInner'));
      });
    });
  }
  $('addrSearchBtn').onclick=openPostcode;
  $('pcClose').onclick=function(){ $('pcLayer').classList.remove('on'); };
  $('pcLayer').onclick=function(e){ if(e.target===$('pcLayer')) $('pcLayer').classList.remove('on'); };

  function updateSubmit(){
    var btn=$('submitBtn');
    if(!cart.length){ btn.disabled=true; btn.textContent='품목을 선택해 주세요'; return; }
    btn.disabled=false; btn.textContent='접수하기';
  }

  $('submitBtn').onclick=function(){
    if(!cart.length) return;
    var name=$('name').value.trim(), phone=$('phone').value.replace(/\D/g,'');
    if(!name){ alert('성함을 입력해 주세요'); return; }
    if(phone.length<10){ alert('연락처를 정확히 입력해 주세요'); return; }
    if(recv==='delivery' && !$('address1').value.trim()){ alert('택배 발송은 주소가 필요합니다'); return; }
    if(!$('consent').checked){ alert('개인정보 수집·이용에 동의해 주세요'); return; }

    var payload={ name:name, phone:phone, receive_method:recv, campaign_id:CAMPAIGN_ID||undefined,
      postcode:recv==='delivery'?$('postcode').value.trim():'',
      address1:recv==='delivery'?$('address1').value.trim():'',
      address2:recv==='delivery'?$('address2').value.trim():'',
      memo:$('memo').value.trim(),
      items:cart.map(function(it){return {product_id:it.product_id,product_name:it.product_name,category_type:it.category_type,spec:it.spec,slicing:it.slicing,qty:it.qty,unit_price:it.unit_price};}) };

    $('doneModal').classList.add('on'); // fire & forget
    fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .catch(function(e){ console.error('submit error',e); });
  };

  function uniq(a){ var s={},o=[]; a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x);}}); return o; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
})();
</script>
