<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAMORU 정품 인증</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- MAMORU: 한글 본문 서체 Pretendard (Google Fonts 미제공 → jsDelivr) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css">
  <style>
    :root{
      --void:#1A1A1A; --graphite:#2D2D2D; --stone:#4A4A4A; --warm-gray:#8A8580;
      --mist:#B8B4AF; --sand:#D4D0CB; --parchment:#EDEBE8; --shell:#F5F3F0;
      --cream:#FAF9F7; --white:#FFFFFF;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html{overflow-x:hidden;}
    body{
      font-family:'Pretendard',sans-serif;background:var(--cream);color:var(--void);
      min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden;
      display:flex;flex-direction:column;align-items:center;
    }
    .en{font-family:'Outfit',sans-serif;}

    /* 헤더 */
    .header{width:100%;padding:22px 0 18px;text-align:center;}
    .header h1{font-family:'Outfit',sans-serif;font-weight:800;font-size:19px;letter-spacing:.32em;padding-left:.32em;}
    .header h1{padding-left:0;} .header h1 .mm-wordmark{display:block;height:14px;width:auto;margin:0 auto;}  /* 로고 = AGRESSIVE 워드마크(SVG) — 원본 projects/brand/img/mamoru-wordmark.svg */
    .header p{font-family:'Outfit',sans-serif;font-size:10px;color:var(--warm-gray);margin-top:5px;letter-spacing:.28em;padding-left:.28em;font-weight:600;}

    .wrap{width:100%;max-width:440px;padding:8px 20px 40px;}

    /* 로딩 */
    .loading{text-align:center;padding:80px 0;color:var(--warm-gray);font-size:13px;}
    .spinner{width:30px;height:30px;border:2px solid var(--sand);border-top-color:var(--void);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── 인증서 카드 ── */
    .cert{background:var(--white);border:1px solid var(--parchment);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(26,26,26,.05);}

    /* 인증 씰 (상단, 몰입 다크 띠) */
    .seal{background:var(--void);color:var(--cream);text-align:center;padding:clamp(30px,8vw,42px) 24px clamp(26px,6vw,34px);}
    .seal-ring{width:64px;height:64px;border-radius:50%;border:1.5px solid rgba(250,249,247,.28);display:flex;align-items:center;justify-content:center;margin:0 auto clamp(16px,4vw,20px);}
    .seal-mark{width:40px;height:40px;border-radius:50%;background:var(--cream);color:var(--void);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;}
    .seal-title{font-size:clamp(19px,5vw,22px);font-weight:800;letter-spacing:-.01em;}
    .seal-sub{font-size:clamp(12px,3.2vw,13px);color:rgba(250,249,247,.6);margin-top:7px;}

    /* 제품 히어로 (인증의 주인공) */
    .hero{text-align:center;padding:clamp(28px,7vw,38px) 24px clamp(22px,5vw,28px);}
    .hero-eyebrow{font-family:'Outfit',sans-serif;font-weight:700;font-size:10px;letter-spacing:.24em;padding-left:.24em;color:var(--mist);margin-bottom:clamp(12px,3vw,16px);}
    .hero-name{font-family:'Outfit','Pretendard',sans-serif;font-weight:800;font-size:clamp(30px,9vw,42px);letter-spacing:-.02em;line-height:1.1;color:var(--void);word-break:break-word;}
    .hero-desc{font-size:clamp(13px,3.4vw,14px);color:var(--warm-gray);margin-top:clamp(12px,3vw,15px);line-height:1.7;max-width:320px;margin-left:auto;margin-right:auto;}

    /* 상세 — hairline 로우 */
    .rows{padding:0 24px;}
    .rows-inner{border-top:1px solid var(--parchment);}
    .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:clamp(15px,3.6vw,18px) 0;border-bottom:1px solid var(--parchment);}
    .row .k{font-size:12.5px;color:var(--warm-gray);white-space:nowrap;}
    .row .v{font-size:clamp(14px,3.6vw,15px);font-weight:600;color:var(--graphite);text-align:right;}
    .row .v.en{font-family:'Outfit',sans-serif;letter-spacing:.01em;}

    /* 혜택 + 자가진단 */
    .care{padding:clamp(22px,5vw,28px) 24px clamp(26px,6vw,32px);}
    .care-box{background:var(--shell);border-radius:16px;padding:clamp(18px,4.5vw,22px);}
    .care-h{font-family:'Outfit',sans-serif;font-weight:700;font-size:10px;letter-spacing:.18em;padding-left:.18em;color:var(--warm-gray);margin-bottom:13px;}
    .care-item{font-size:clamp(13.5px,3.6vw,14.5px);color:var(--graphite);line-height:1.75;}
    .care-item b{color:var(--void);font-weight:700;}
    .self-cta{display:block;text-align:center;margin-top:16px;padding:14px;border-radius:12px;background:var(--void);color:var(--cream);font-size:14px;font-weight:700;text-decoration:none;transition:.15s;}
    .self-cta:active{transform:scale(.99);}

    /* 슬로건 푸터 */
    .foot{text-align:center;padding:clamp(24px,6vw,32px) 0 8px;}
    .foot .slogan{font-family:'Outfit',sans-serif;font-weight:700;font-size:11px;letter-spacing:.2em;padding-left:.2em;color:var(--mist);}
    .foot .row2{margin-top:12px;font-size:12px;color:var(--warm-gray);}
    .foot a{color:var(--stone);text-decoration:none;font-weight:600;}

    /* ── 인증 실패 ── */
    .fail{background:var(--white);border:1px solid var(--parchment);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(26,26,26,.05);}
    .fail-top{background:var(--shell);text-align:center;padding:clamp(32px,8vw,44px) 24px;}
    .fail-ring{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--sand);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--stone);font-size:24px;font-weight:700;}
    .fail-title{font-size:clamp(18px,5vw,21px);font-weight:800;}
    .fail-sub{font-size:clamp(12.5px,3.3vw,13.5px);color:var(--warm-gray);margin-top:9px;line-height:1.6;max-width:300px;margin-left:auto;margin-right:auto;}
    .fail-foot{padding:22px 24px;text-align:center;border-top:1px solid var(--parchment);}
    .fail-foot p{font-size:12px;color:var(--warm-gray);line-height:1.7;}
    .fail-foot a{color:var(--stone);text-decoration:none;font-weight:600;}
  </style>
</head>
<body>

    <p>AUTHENTIC VERIFICATION</p>
  </div>

  <div class="wrap">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>정품 확인 중...</p>
    </div>
    <div id="result" style="display:none;"></div>
  </div>

  <script>
    const API_BASE = 'https://app-eta-sandy-75.vercel.app';

    function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
    function fmtDate(iso){ try { return new Date(iso).toLocaleDateString('ko-KR', { timeZone:'Asia/Seoul' }); } catch(e){ return ''; } }

    async function verify(){
      const loadingEl = document.getElementById('loading');
      const resultEl = document.getElementById('result');

      const path = window.location.pathname.split('/').filter(Boolean);
      const urlParams = new URLSearchParams(window.location.search);
      const token = path[path.length - 1] !== 'verify' ? path[path.length - 1] : urlParams.get('t');

      if (!token || token === 'index.html') {
        loadingEl.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = renderInvalid('QR 코드를 스캔하여 접속해주세요.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/verify/${token}`);
        const data = await res.json();
        loadingEl.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = data.valid ? renderValid(data) : renderInvalid(data.message || '등록되지 않은 제품입니다.');
      } catch (err) {
        loadingEl.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = renderInvalid('서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
    }

    function renderValid(data){
      const p = data.product || {};
      const d = data.details || {};

      let rows = '';
      if (d.sold_at)  rows += `<div class="row"><span class="k">구매일</span><span class="v en">${fmtDate(d.sold_at)}</span></div>`;
      if (d.sold_via) rows += `<div class="row"><span class="k">구매처</span><span class="v">${esc(d.sold_via)}</span></div>`;

      return `
        <div class="cert">
          <div class="seal">
            <div class="seal-ring"><div class="seal-mark">&#10003;</div></div>
            <div class="seal-title">정품 확인</div>
            <div class="seal-sub">이 제품은 MAMORU 정품입니다</div>
          </div>

          <div class="hero">
            <div class="hero-eyebrow">VERIFIED PRODUCT</div>
            <div class="hero-name">${esc(p.name || '제품')}</div>
            ${p.description ? `<div class="hero-desc">${esc(p.description)}</div>` : ''}
          </div>

          ${rows ? `<div class="rows"><div class="rows-inner">${rows}</div></div>` : ''}

          <div class="care">
            <div class="care-box">
              <div class="care-h">정품 등록 고객</div>
              <div class="care-item">· 복원수리 <b>50%</b> — 언제 맡겨도 반값</div>
              <div class="care-item">· 내 가위 수리 이력 조회</div>
              <a class="self-cta" href="self-check.html">내 가위 상태, 지금 괜찮은지 자가진단 →</a>
            </div>
          </div>
        </div>

        <div class="foot">
          <div class="slogan">CUT THE FAKE, KEEP THE REAL</div>
          <div class="row2">필요할 때만 오시면 됩니다 · 문의 <a href="https://mamoru.kr">mamoru.kr</a></div>
        </div>
      `;
    }

    function renderInvalid(message){
      return `
        <div class="fail">
          <div class="fail-top">
            <div class="fail-ring">&#10007;</div>
            <div class="fail-title">확인되지 않습니다</div>
            <div class="fail-sub">${esc(message)}</div>
          </div>
          <div class="fail-foot">
            <p>정식 구매처가 아닐 수 있습니다.<br>의심되시면 <a href="https://mamoru.kr">mamoru.kr</a> 로 문의해주세요.</p>
          </div>
        </div>
      `;
    }

    verify();
  </script>
</body>
</html>
