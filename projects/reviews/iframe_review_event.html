<style>
#mamoruReviewEventWrap { position: relative; width: 100%; }
#mamoruReviewEventFrame { width: 100%; border: none; display: block; }
</style>

<div id="mamoruReviewEventWrap">
  <iframe
    id="mamoruReviewEventFrame"
    src="https://page.mamoru.kr/projects/reviews/page_review_event.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true"
    title="MAMORU 리뷰 이벤트">
  </iframe>
</div>

<!-- ⚠️ 아임웹은 코드위젯 안의 <script>를 제거·미실행하는 경우가 있다(느린 회선).
     그래서 iframe 높이 조절의 '진짜 담당'은 전역 헤더의 banner-widget.js 리사이저다.
     아래 스크립트는 그게 어떤 이유로 안 돌 때를 대비한 보조 안전망일 뿐이며,
     둘 다 monotonic 이라 동시에 돌아도 충돌하지 않는다.
     [reference_imweb_strips_codewidget_script] / [reference_iframe_codewidget_pattern] -->
<script>
(function(){
  var iframe = document.getElementById('mamoruReviewEventFrame');
  if (!iframe) return;
  iframe.style.height = '0px';        // ⭐ fallback 0 — 큰 바닥값은 빈 여백 영구 잠금
  var currentHeight = 0;

  window.addEventListener('message', function(e) {
    if (e.source !== iframe.contentWindow) return;              // ① source 가드
    if (e.origin !== 'https://page.mamoru.kr') return;          // ② origin 가드
    var d = e.data;
    if (!d || d.type !== 'MAMORU_IFRAME_SIZE') return;
    if (d.id !== 'review_event' || typeof d.height !== 'number') return;  // ③ id 가드(자식 page_review_event.html 송신 id)
    var h = Math.ceil(d.height);
    if (h > currentHeight) {                                    // ④ monotonic
      currentHeight = h;
      iframe.style.height = h + 'px';
    }
  });

  // 자식이 초기 푸시를 놓쳐도 회복 — 자식은 REQUEST_HEIGHT 에 무조건 회신(force)
  function requestHeight() {
    try { iframe.contentWindow.postMessage({ type: 'REQUEST_HEIGHT' }, 'https://page.mamoru.kr'); } catch (_) {}
  }
  iframe.addEventListener('load', function(){ [50, 200, 500, 1000, 2000].forEach(function(ms){ setTimeout(requestHeight, ms); }); });
  window.addEventListener('pageshow', function(e){ if (e.persisted) requestHeight(); });
})();
</script>
