<!-- MAMORU 고객 후기 페이지 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 후기 페이지 코드위젯에 전체 복사하세요 ★ -->

<style>
#mamoruReviewsWrap {
  position: relative;
  width: 100%;
}
#mamoruReviewsFrame {
  width: 100%;
  border: none;
  display: block;
}
</style>

<div id="mamoruReviewsWrap">
  <iframe
    id="mamoruReviewsFrame"
    src="https://bsm-pixel.github.io/mamoru/projects/reviews/page_reviews.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruReviewsFrame');
  var currentHeight = 0;

  window.addEventListener('message', function(e) {
    if (e.origin !== 'https://bsm-pixel.github.io') return;

    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      if (newHeight !== currentHeight && newHeight > 0) {
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }

    // 모달 뷰포트 센터링: iframe 안 모달이 부모 viewport 가시 영역 중앙에 표시되도록
    // (다른 wrapper들과 동일 패턴 — as/iframe_form.html L50-58 참조)
    if (e.data && e.data.type === 'MAMORU_REQUEST_VIEWPORT') {
      var rect = iframe.getBoundingClientRect();
      var visibleTop = Math.max(0, -rect.top);
      var visibleHeight = Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0);
      if (visibleHeight > 0) {
        iframe.contentWindow.postMessage({
          type: 'MAMORU_VIEWPORT_INFO',
          visibleTop: visibleTop,
          visibleHeight: visibleHeight
        }, '*');
      }
    }
  });

  // 초기 높이 fallback
  iframe.style.height = (window.innerWidth <= 768 ? 1800 : 1600) + 'px';
})();
</script>
