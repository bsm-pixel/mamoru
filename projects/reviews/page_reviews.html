<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고객 후기 | MAMORU</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"></noscript>
<style>
/* ══════════════════════════════════════════════════════════════
   MAMORU 고객 후기 페이지 — Brand Guide v1.0 (Monochrome)
   ══════════════════════════════════════════════════════════════ */

/* ── 0. 변수 & 리셋 ── */
:root {
  --mm-bg-light: #FAF9F7;   /* Cream */
  --mm-bg-card: #FFFFFF;
  --mm-void: #1A1A1A;       /* Void */
  --mm-shell: #F5F5F0;      /* Shell */
  --mm-text-d: #1A1A1A;
  --mm-text-d2: #6B6B6B;
  --mm-text-d3: rgba(26,26,26,0.5);
  --mm-border-l: rgba(26,26,26,0.08);
  --mm-radius: 6px;
  --mm-radius-lg: 8px;
  --mm-max-w: 960px;
  --mm-ease-fast: 0.15s ease;
  --mm-ease: 0.25s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--mm-bg-light);
  color: var(--mm-text-d);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

/* ── 1. 페이지 헤더 ── */
.mm-rv-header {
  text-align: center;
  padding: 48px 20px 32px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}
.mm-rv-header__bar {
  display: inline-block;
  width: 28px;
  height: 3px;
  background: var(--mm-void);
  border-radius: 2px;
  margin-bottom: 16px;
}
.mm-rv-header__title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--mm-text-d);
  margin-bottom: 8px;
}
.mm-rv-header__desc {
  font-size: 14px;
  font-weight: 400;
  color: var(--mm-text-d2);
}

/* ── 2. 탭 필터 ── */
.mm-rv-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 0 20px 24px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}
.mm-rv-tab {
  padding: 8px 20px;
  border: 1px solid var(--mm-border-l);
  border-radius: 999px;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--mm-text-d2);
  cursor: pointer;
  transition: all var(--mm-ease-fast);
}
.mm-rv-tab:active { transform: scale(0.96); }
.mm-rv-tab--active {
  background: var(--mm-void);
  border-color: var(--mm-void);
  color: var(--mm-bg-light);
  font-weight: 600;
}

/* ── 3. 리뷰 그리드 ── */
.mm-rv-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: 0 20px 16px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}

/* ── 4. 리뷰 카드 ── */
.mm-rv-card {
  background: var(--mm-bg-card);
  border: 1px solid var(--mm-border-l);
  border-radius: var(--mm-radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: box-shadow var(--mm-ease);
}
.mm-rv-card__img {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--mm-radius);
  object-fit: cover;
}
.mm-rv-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mm-rv-card__name {
  font-size: 15px;
  font-weight: 700;
  color: var(--mm-text-d);
}
.mm-rv-card__source {
  font-size: 11px;
  font-weight: 500;
  color: var(--mm-text-d3);
  padding: 2px 8px;
  background: rgba(26,26,26,0.04);
  border-radius: 999px;
}
.mm-rv-card__stars {
  display: flex;
  gap: 2px;
  color: var(--mm-void);
  font-size: 14px;
  letter-spacing: 1px;
}
.mm-rv-card__text {
  font-size: 15px;
  font-weight: 400;
  color: var(--mm-text-d);
  line-height: 1.7;
}
.mm-rv-card__date {
  font-size: 12px;
  font-weight: 400;
  color: var(--mm-text-d3);
  padding-top: 8px;
  border-top: 1px solid var(--mm-border-l);
}

/* ── 5. 더보기 버튼 ── */
.mm-rv-loadmore {
  display: block;
  width: fit-content;
  margin: 32px auto 48px;
  padding: 12px 32px;
  border: 1px solid var(--mm-border-l);
  border-radius: 999px;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--mm-text-d2);
  cursor: pointer;
  transition: all var(--mm-ease-fast);
}
.mm-rv-loadmore:hover {
  border-color: var(--mm-void);
  color: var(--mm-void);
}
.mm-rv-loadmore:active { transform: scale(0.97); }

/* 비어있을 때 / 로딩 */
.mm-rv-empty, .mm-rv-loading {
  text-align: center;
  padding: 64px 20px;
  color: var(--mm-text-d3);
  font-size: 15px;
}

/* ── 6. 반응형 ── */
@media (min-width: 768px) {
  .mm-rv-header { padding: 56px 32px 36px; }
  .mm-rv-header__title { font-size: 28px; }
  .mm-rv-header__desc { font-size: 15px; }
  .mm-rv-tabs { gap: 10px; padding-bottom: 32px; }
  .mm-rv-tab { padding: 9px 24px; font-size: 14px; }
  .mm-rv-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 0 32px;
  }
  .mm-rv-card { padding: 24px; }
  .mm-rv-card__text { font-size: 15px; }
}

@media (min-width: 1024px) {
  .mm-rv-header { padding: 64px 48px 40px; }
  .mm-rv-header__title { font-size: 30px; }
  .mm-rv-header__desc { font-size: 16px; }
  .mm-rv-tab { padding: 10px 28px; font-size: 15px; }
  .mm-rv-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    padding: 0 48px;
  }
  .mm-rv-card { padding: 24px; }
  .mm-rv-card__text { font-size: 16px; line-height: 1.7; }
}

/* PC hover */
@media (hover: hover) {
  .mm-rv-card:hover {
    box-shadow: 0 4px 16px rgba(26,26,26,0.06);
  }
  .mm-rv-tab:hover:not(.mm-rv-tab--active) {
    border-color: var(--mm-void);
    color: var(--mm-void);
  }
}

/* 아임웹 iframe 통신 */
.mm-rv-page {
  overflow: visible;
  padding-bottom: 64px;
}
</style>
</head>
<body class="mm-rv-page">

<!-- 페이지 헤더 -->
<header class="mm-rv-header">
  <span class="mm-rv-header__bar"></span>
  <h1 class="mm-rv-header__title">고객 후기</h1>
  <p class="mm-rv-header__desc">마모루를 경험한 분들의 솔직한 이야기</p>
</header>

<!-- 탭 필터 -->
<nav class="mm-rv-tabs" id="rvTabs">
  <button class="mm-rv-tab mm-rv-tab--active" data-type="all">전체</button>
  <button class="mm-rv-tab" data-type="consult">컨설팅상담</button>
  <button class="mm-rv-tab" data-type="repair">복원수리</button>
  <button class="mm-rv-tab" data-type="purchase">제품구매</button>
</nav>

<!-- 리뷰 그리드 -->
<div class="mm-rv-grid" id="rvGrid">
  <div class="mm-rv-loading">후기를 불러오는 중...</div>
</div>

<!-- 더보기 -->
<button class="mm-rv-loadmore" id="rvLoadmore" style="display:none">후기 더보기</button>

<script>
(function(){
  'use strict';

  var API_URL = 'https://app-eta-sandy-75.vercel.app/api/reviews/public';
  var PER_PAGE = 6;
  var currentType = 'all';
  var currentPage = 1;
  var allReviews = []; // API에서 가져온 전체 리뷰

  /* ── 이름 마스킹 (서버에서 이미 마스킹되어 올 수도 있지만 안전장치) ── */
  function maskName(name) {
    if (!name) return '';
    if (name.length <= 1) return name;
    if (name.length === 2) return name[0] + '*';
    return name[0] + '*'.repeat(name.length - 2) + name[name.length - 1];
  }

  /* ── 소스 라벨 매핑 ── */
  function getSourceLabel(review) {
    if (review.type === 'consult') {
      var sub = review.subtype || (review.meta && review.meta.consultation_type) || '';
      if (sub === 'store_visit') return '매장방문';
      if (sub === 'field_request') return '출장상담';
      if (sub === 'talk_consult') return '톡상담';
      return '상담';
    }
    if (review.type === 'repair') return '복원수리';
    if (review.type === 'purchase') return '제품구매';
    return '';
  }

  /* ── 탭 data-type → API type 매핑 ── */
  function getTypeFilter(tabType) {
    if (tabType === 'all') return null;
    if (tabType === 'consult') return 'consult';
    // 하위 호환: consulting → consult
    if (tabType === 'consulting') return 'consult';
    return tabType;
  }

  function getFilteredReviews() {
    if (currentType === 'all') return allReviews;
    var filterType = getTypeFilter(currentType);
    return allReviews.filter(function(r) { return r.type === filterType; });
  }

  function renderStars(n) {
    var s = '';
    for (var i = 0; i < 5; i++) s += (i < n) ? '★' : '☆';
    return s;
  }

  function renderCard(r) {
    var imgHtml = '';
    if (r.photo_urls && r.photo_urls.length > 0) {
      imgHtml = '<img class="mm-rv-card__img" src="' + r.photo_urls[0] + '" alt="후기 이미지" loading="lazy">';
    }
    var date = r.created_at ? new Date(r.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '';
    return '<article class="mm-rv-card">' +
      imgHtml +
      '<div class="mm-rv-card__header">' +
        '<span class="mm-rv-card__name">' + maskName(r.name) + '</span>' +
        '<span class="mm-rv-card__source">' + getSourceLabel(r) + '</span>' +
      '</div>' +
      '<div class="mm-rv-card__stars">' + renderStars(r.stars) + '</div>' +
      '<div class="mm-rv-card__text">' + r.content + '</div>' +
      '<div class="mm-rv-card__date">' + date + '</div>' +
    '</article>';
  }

  function render() {
    var grid = document.getElementById('rvGrid');
    var btn = document.getElementById('rvLoadmore');
    var reviews = getFilteredReviews();
    var visible = reviews.slice(0, currentPage * PER_PAGE);

    grid.innerHTML = visible.length
      ? visible.map(renderCard).join('')
      : '<div class="mm-rv-empty">아직 등록된 후기가 없습니다.</div>';

    btn.style.display = (visible.length < reviews.length) ? 'block' : 'none';
  }

  /* ── API에서 리뷰 로드 ── */
  function loadReviews() {
    fetch(API_URL + '?type=all')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (Array.isArray(data)) {
          allReviews = data;
        } else {
          allReviews = [];
          console.error('리뷰 로드 실패:', data);
        }
        render();
      })
      .catch(function(err) {
        console.error('리뷰 API 에러:', err);
        allReviews = [];
        render();
      });
  }

  /* 탭 전환 */
  document.getElementById('rvTabs').addEventListener('click', function(e) {
    var btn = e.target.closest('.mm-rv-tab');
    if (!btn || btn.classList.contains('mm-rv-tab--active')) return;
    this.querySelectorAll('.mm-rv-tab').forEach(function(t) {
      t.classList.remove('mm-rv-tab--active');
    });
    btn.classList.add('mm-rv-tab--active');
    currentType = btn.dataset.type;
    currentPage = 1;
    render();
  });

  /* 더보기 */
  document.getElementById('rvLoadmore').addEventListener('click', function() {
    currentPage++;
    render();
  });

  /* 아임웹 iframe 높이 자동 전달 */
  function initIframeComm() {
    function sendHeight() {
      var h = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: 'MAMORU_IFRAME_SIZE', height: h }, '*');
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(sendHeight).observe(document.body);
    } else {
      setInterval(sendHeight, 500);
    }
    sendHeight();
  }

  /* 초기화 */
  loadReviews();
  initIframeComm();
})();
</script>
</body>
</html>
