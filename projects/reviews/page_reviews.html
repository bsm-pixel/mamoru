<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고객 후기 | MAMORU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   MAMORU 고객 후기 페이지 — Brand Guide v1.0 (Monochrome)
   ══════════════════════════════════════════════════════════════ */

/* ── 0. 변수 & 리셋 ── */
:root {
  --mm-bg-light: #FAF9F7;   /* Cream */
  --mm-bg-card: #FFFFFF;
  --mm-void: #1A1A1A;       /* Void */
  --mm-shell: #F5F3F0;      /* Shell */
  --mm-text-d: #1A1A1A;
  --mm-text-d2: #6B6B6B;
  --mm-text-d3: rgba(26,26,26,0.5);
  --mm-border-l: rgba(26,26,26,0.08);
  --mm-radius: 8px;
  --mm-radius-lg: 12px;
  --mm-max-w: 960px;
  --mm-ease-fast: 0.15s ease;
  --mm-ease: 0.25s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--mm-bg-light);
  color: var(--mm-text-d);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

/* ── 1. 페이지 헤더 ── */
.mm-rv-header {
  text-align: center;
  padding: 48px 20px 32px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}
.mm-rv-header__bar {
  display: inline-block;
  width: 28px;
  height: 3px;
  background: var(--mm-void);
  border-radius: 2px;
  margin-bottom: 16px;
}
.mm-rv-header__title {
  font-family: 'Outfit', sans-serif;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--mm-text-d);
  margin-bottom: 8px;
}
.mm-rv-header__desc {
  font-size: 14px;
  font-weight: 400;
  color: var(--mm-text-d2);
}

/* ── 2. 탭 필터 ── */
.mm-rv-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 0 16px 24px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
  overflow-x: auto;
  scrollbar-width: none;
}
.mm-rv-tabs::-webkit-scrollbar { display: none; }
.mm-rv-tab {
  padding: 8px 16px;
  border: 1px solid var(--mm-border-l);
  border-radius: 999px;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--mm-text-d2);
  cursor: pointer;
  transition: all var(--mm-ease-fast);
  white-space: nowrap;
  flex-shrink: 0;
}
.mm-rv-tab:active { transform: scale(0.96); }
.mm-rv-tab--active {
  background: var(--mm-void);
  border-color: var(--mm-void);
  color: var(--mm-bg-light);
  font-weight: 600;
}

/* ── 3. 리뷰 그리드 — Masonry (JS 열 분배) ── */
.mm-rv-grid {
  display: flex;
  gap: 10px;
  padding: 0 16px 16px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}
.mm-rv-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── 4. 리뷰 카드 — 잡지 스타일 ── */
.mm-rv-card {
  background: var(--mm-bg-card);
  border: 1px solid var(--mm-border-l);
  border-radius: var(--mm-radius-lg);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  transition: box-shadow var(--mm-ease);
}
.mm-rv-card__img {
  width: 100%;
  aspect-ratio: 4 / 5;
  border-radius: var(--mm-radius);
  object-fit: cover;
}
.mm-rv-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}
.mm-rv-card__name {
  font-size: 13px;
  font-weight: 700;
  color: var(--mm-text-d);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mm-rv-card__source {
  font-size: 11px;
  font-weight: 500;
  color: var(--mm-text-d3);
  padding: 2px 8px;
  background: rgba(26,26,26,0.04);
  border-radius: 999px;
}
.mm-rv-card__stars {
  display: flex;
  gap: 1px;
  color: var(--mm-void);
  font-size: 12px;
  letter-spacing: 1px;
}
.mm-rv-card__text {
  font-size: 13px;
  font-weight: 400;
  color: var(--mm-text-d);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.mm-rv-card__date {
  font-size: 11px;
  font-weight: 400;
  color: var(--mm-text-d3);
  padding-top: 6px;
  border-top: 1px solid var(--mm-border-l);
  display: flex;
  gap: 8px;
}
/* 칩 (type + subtype) */
.mm-rv-card__chips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.mm-rv-chip {
  font-size: 10px;
  font-weight: 500;
  color: var(--mm-text-d3);
  padding: 2px 7px;
  background: rgba(26,26,26,0.04);
  border-radius: 999px;
}
/* 네이버 출처 — 연녹색 칩 */
.mm-rv-chip--naver {
  background: rgba(3,199,90,0.1);
  color: #03C75A;
  font-weight: 600;
}
/* 속성 태그 */
.mm-rv-card__tags, .mm-rv-modal__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.mm-rv-tag {
  font-size: 11px;
  font-weight: 500;
  color: var(--mm-text-d2);
  padding: 2px 8px;
  border: 1px solid var(--mm-border-l);
  border-radius: 6px;
  background: transparent;
}

/* ── 모달 — iframe 뷰포트 센터링 ── */
.mm-rv-overlay {
  position: absolute; z-index: 9999;
  left: 0; right: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
}
.mm-rv-overlay--open { opacity: 1; visibility: visible; }
.mm-rv-modal {
  background: #fff; border-radius: 14px;
  max-width: 520px; width: 100%;
  max-height: 80vh; overflow-y: auto;
  padding: 28px 24px;
  position: relative;
}
.mm-rv-modal__close {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px; border: none; background: rgba(26,26,26,0.06);
  border-radius: 50%; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--mm-text-d2);
}
.mm-rv-modal__stars {
  color: var(--mm-void); font-size: 18px; letter-spacing: 2px; margin-bottom: 12px;
}
.mm-rv-modal__name {
  font-size: 17px; font-weight: 700; margin-bottom: 4px;
}
.mm-rv-modal__chips {
  display: flex; gap: 6px; margin-bottom: 16px;
}
.mm-rv-modal__text {
  font-size: 15px; line-height: 1.8; color: var(--mm-text-d); margin-bottom: 16px;
  white-space: pre-wrap;
}
.mm-rv-modal__photos {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.mm-rv-modal__photo {
  width: 120px; height: 120px; border-radius: 8px; object-fit: cover; cursor: pointer;
  flex-shrink: 0;
}
/* 모바일: 가로 스크롤 캐러셀 */
@media (max-width: 767px) {
  .mm-rv-modal__photos {
    flex-wrap: nowrap;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  .mm-rv-modal__photos::-webkit-scrollbar { display: none; }
  .mm-rv-modal__photo {
    width: 75vw; height: auto; aspect-ratio: 4/3;
    scroll-snap-align: center;
  }
  /* 사진 1장이면 캐러셀 불필요 → 중앙 정렬 */
  .mm-rv-modal__photos--single {
    justify-content: center;
    overflow-x: hidden;
    scroll-snap-type: none;
  }
  .mm-rv-modal__photos--single .mm-rv-modal__photo {
    width: 100%; max-width: 320px;
  }
}
.mm-rv-modal__date {
  font-size: 12px; color: var(--mm-text-d3);
  display: flex; gap: 12px;
  padding-top: 12px; border-top: 1px solid var(--mm-border-l);
}

/* ── 라이트박스 (사진 확대) ── */
.mm-lb {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(0,0,0,0.92);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
  touch-action: pan-y;
}
.mm-lb--open { opacity: 1; visibility: visible; }
.mm-lb__img {
  max-width: 90vw; max-height: 85vh;
  object-fit: contain; border-radius: 4px;
  user-select: none; -webkit-user-drag: none;
}
.mm-lb__close {
  position: absolute; top: 16px; right: 16px;
  width: 40px; height: 40px; border: none;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
  border-radius: 50%; font-size: 20px; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.mm-lb__close:hover { background: rgba(255,255,255,0.3); }
.mm-lb__arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border: none;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
  border-radius: 50%; font-size: 20px; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.mm-lb__arrow:hover { background: rgba(255,255,255,0.3); }
.mm-lb__arrow--prev { left: 16px; }
.mm-lb__arrow--next { right: 16px; }
.mm-lb__counter {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 13px; color: rgba(255,255,255,0.7);
}
/* 사진 1장이면 화살표/카운터 숨김 */
.mm-lb__arrow.hidden, .mm-lb__counter.hidden { display: none; }
@media (max-width: 767px) {
  .mm-lb__arrow { display: none; }
}

/* ── 5. 베스트 리뷰 섹션 ── */
.mm-rv-best {
  max-width: var(--mm-max-w);
  margin: 0 auto 8px;
  padding: 0 20px;
}
.mm-rv-best__title {
  font-size: 13px;
  font-weight: 600;
  color: var(--mm-text-d2);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-left: 2px;
}
.mm-rv-best__scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.mm-rv-best__scroll::-webkit-scrollbar { display: none; }
.mm-rv-best__card {
  flex: 0 0 280px;
  scroll-snap-align: start;
  background: var(--mm-void);
  color: #fff;
  border-radius: var(--mm-radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
  transition: transform var(--mm-ease-fast);
}
.mm-rv-best__card:active { transform: scale(0.98); }
.mm-rv-best__stars {
  font-size: 13px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.9);
}
.mm-rv-best__name {
  font-size: 14px;
  font-weight: 700;
}
.mm-rv-best__chip {
  display: inline-block;
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,0.6);
  padding: 2px 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 999px;
}
.mm-rv-best__text {
  font-size: 14px;
  font-weight: 400;
  line-height: 1.7;
  color: rgba(255,255,255,0.85);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.mm-rv-best__divider {
  width: 40px;
  height: 1px;
  background: var(--mm-border-l);
  margin: 16px auto 24px;
  max-width: var(--mm-max-w);
}
@media (min-width: 768px) {
  .mm-rv-best { padding: 0 32px; }
  .mm-rv-best__card { flex: 0 0 320px; padding: 24px; }
  .mm-rv-best__text { font-size: 15px; }
}
@media (min-width: 1024px) {
  .mm-rv-best { padding: 0 48px; }
  .mm-rv-best__card { flex: 0 0 340px; }
}
@media (hover: hover) {
  .mm-rv-best__card:hover { transform: translateY(-2px); }
}

/* ── 6. 더보기 버튼 ── */
.mm-rv-loadmore {
  display: block;
  width: fit-content;
  margin: 32px auto 48px;
  padding: 12px 32px;
  border: 1px solid var(--mm-border-l);
  border-radius: 999px;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--mm-text-d2);
  cursor: pointer;
  transition: all var(--mm-ease-fast);
}
.mm-rv-loadmore:hover {
  border-color: var(--mm-void);
  color: var(--mm-void);
}
.mm-rv-loadmore:active { transform: scale(0.97); }

/* 비어있을 때 / 로딩 */
.mm-rv-empty, .mm-rv-loading {
  text-align: center;
  padding: 64px 20px;
  color: var(--mm-text-d3);
  font-size: 15px;
}

/* ── 6. 반응형 ── */
@media (min-width: 768px) {
  .mm-rv-header { padding: 56px 32px 36px; }
  .mm-rv-header__title { font-size: 28px; }
  .mm-rv-header__desc { font-size: 15px; }
  .mm-rv-tabs { gap: 10px; padding-bottom: 32px; }
  .mm-rv-tab { padding: 9px 24px; font-size: 14px; }
  .mm-rv-grid { gap: 16px; padding: 0 32px; }
  .mm-rv-col { gap: 16px; }
  .mm-rv-card { padding: 20px; }
  .mm-rv-card__name { font-size: 15px; }
  .mm-rv-card__stars { font-size: 14px; }
  .mm-rv-card__text { font-size: 15px; -webkit-line-clamp: 4; }
  .mm-rv-card__img { aspect-ratio: 16 / 9; }
}

@media (min-width: 1024px) {
  .mm-rv-header { padding: 64px 48px 40px; }
  .mm-rv-header__title { font-size: 30px; }
  .mm-rv-header__desc { font-size: 16px; }
  .mm-rv-tab { padding: 10px 28px; font-size: 15px; }
  .mm-rv-grid { gap: 20px; padding: 0 48px; }
  .mm-rv-col { gap: 20px; }
  .mm-rv-card { padding: 24px; }
  .mm-rv-card__text { font-size: 16px; line-height: 1.7; -webkit-line-clamp: 5; }
}

/* PC hover */
@media (hover: hover) {
  .mm-rv-card:hover {
    box-shadow: 0 4px 16px rgba(26,26,26,0.06);
  }
  .mm-rv-tab:hover:not(.mm-rv-tab--active) {
    border-color: var(--mm-void);
    color: var(--mm-void);
  }
}

/* 아임웹 iframe 통신 */
.mm-rv-page {
  overflow: visible;
  padding-bottom: 64px;
}
</style>
</head>
<body class="mm-rv-page">

<!-- 페이지 헤더 -->
<header class="mm-rv-header">
  <span class="mm-rv-header__bar"></span>
  <h1 class="mm-rv-header__title">고객 후기</h1>
  <p class="mm-rv-header__desc">마모루를 경험한 분들의 솔직한 이야기</p>
</header>

<!-- 베스트 리뷰 -->
<section class="mm-rv-best" id="rvBest" style="display:none">
  <div class="mm-rv-best__title">Best Reviews</div>
  <div class="mm-rv-best__scroll" id="rvBestScroll"></div>
</section>
<div class="mm-rv-best__divider" id="rvBestDivider" style="display:none"></div>

<!-- 탭 필터 -->
<nav class="mm-rv-tabs" id="rvTabs">
  <button class="mm-rv-tab mm-rv-tab--active" data-type="all">전체</button>
  <button class="mm-rv-tab" data-type="consult">컨설팅상담</button>
  <button class="mm-rv-tab" data-type="repair">복원수리</button>
  <button class="mm-rv-tab" data-type="purchase">제품구매</button>
</nav>

<!-- 리뷰 그리드 -->
<div class="mm-rv-grid" id="rvGrid">
  <div class="mm-rv-loading">후기를 불러오는 중...</div>
</div>

<!-- 더보기 -->
<button class="mm-rv-loadmore" id="rvLoadmore" style="display:none">후기 더보기</button>

<!-- 상세 모달 -->
<div class="mm-rv-overlay" id="rvOverlay">
  <div class="mm-rv-modal" id="rvModal">
    <button class="mm-rv-modal__close" id="rvModalClose">✕</button>
    <div id="rvModalBody"></div>
  </div>
</div>

<!-- 사진 라이트박스 -->
<div class="mm-lb" id="rvLightbox">
  <button class="mm-lb__close" id="lbClose">✕</button>
  <button class="mm-lb__arrow mm-lb__arrow--prev" id="lbPrev">‹</button>
  <img class="mm-lb__img" id="lbImg" src="" alt="사진 확대">
  <button class="mm-lb__arrow mm-lb__arrow--next" id="lbNext">›</button>
  <div class="mm-lb__counter" id="lbCounter"></div>
</div>

<script>
(function(){
  'use strict';

  var API_URL = 'https://app-eta-sandy-75.vercel.app/api/reviews/public';
  var PER_PAGE = 6;
  var currentType = 'all';
  var currentPage = 1;
  var allReviews = []; // API에서 가져온 전체 리뷰

  /* ── 이름 마스킹 (서버에서 이미 마스킹되어 올 수도 있지만 안전장치) ── */
  function maskName(name) {
    if (!name) return '';
    if (name.length <= 1) return name;
    if (name.length === 2) return name[0] + '*';
    return name[0] + '*'.repeat(name.length - 2) + name[name.length - 1];
  }

  /* ── 타입/서브타입 라벨 ── */
  var SOURCE_LABELS = { naver: '네이버', site: '' };
  var TYPE_LABELS = { consult: '컨설팅상담', repair: '복원수리', purchase: '제품구매' };
  /* 속성 태그 key→한글 */
  var TAG_LABELS = {
    comfortable:'강요없이 편안해요', detailed_guide:'설명이 자세해요', professional:'전문적이에요',
    personalized:'맞춤 안내', worth_time:'시간이 아깝지 않았어요',
    reasonable_price:'합리적이에요', fair_price:'적당해요',
    like_new:'새 가위처럼', better_cut:'커트감이 달라요', above_expect:'기대 이상',
    precise_edge:'날 조절 정확', thorough_info:'안내 꼼꼼', fast_service:'진행 빠름', good_value:'가격 대비 만족',
    good_quality:'품질이 좋아요', fast_delivery:'배송이 빨라요', neat_packaging:'포장이 꼼꼼해요',
    would_recommend:'추천하고 싶어요'
  };
  function renderTagChips(r, cls) {
    var tags = r.meta && r.meta.tags;
    if (!tags || !tags.length) return '';
    return '<div class="' + cls + '">' +
      tags.map(function(t) { return '<span class="mm-rv-tag">' + (TAG_LABELS[t] || t) + '</span>'; }).join('') +
    '</div>';
  }
  var SUBTYPE_LABELS = { store_visit: '매장방문', field_request: '출장상담', talk_consult: '톡상담', restoration: '복원수리' };

  function getTypeLabel(r) { return TYPE_LABELS[r.type] || ''; }
  function getSubtypeLabel(r) {
    var sub = r.subtype || (r.meta && r.meta.consultation_type) || '';
    return SUBTYPE_LABELS[sub] || '';
  }

  /* ── 칩 HTML 생성 ── */
  function renderChips(r, cls) {
    var chips = '<span class="' + cls + '">' + getTypeLabel(r) + '</span>';
    var sub = getSubtypeLabel(r);
    if (sub && sub !== getTypeLabel(r)) {
      chips += '<span class="' + cls + '">' + sub + '</span>';
    }
    return chips;
  }

  /* ── 날짜 포맷 ── */
  function fmtDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  /* ── 날짜 영역 (접수일 + 작성일) ── */
  function renderDates(r, cls) {
    var receivedAt = r.meta && r.meta.received_at ? fmtDate(r.meta.received_at) : '';
    var createdAt = fmtDate(r.created_at);
    var html = '';
    if (receivedAt) html += '<span>접수 ' + receivedAt + '</span>';
    if (createdAt) html += '<span>작성 ' + createdAt + '</span>';
    return '<div class="' + cls + '">' + html + '</div>';
  }

  function getFilteredReviews() {
    if (currentType === 'all') return allReviews;
    return allReviews.filter(function(r) { return r.type === currentType; });
  }

  function renderStars(n) {
    var s = '';
    for (var i = 0; i < 5; i++) s += (i < n) ? '★' : '☆';
    return s;
  }

  function renderCard(r, idx) {
    var imgHtml = '';
    if (r.photo_urls && r.photo_urls.length > 0) {
      imgHtml = '<img class="mm-rv-card__img" src="' + r.photo_urls[0] + '" alt="후기 이미지" loading="lazy">';
    } else if (r.product_image_url) {
      imgHtml = '<img class="mm-rv-card__img" src="' + r.product_image_url + '" alt="제품 이미지" loading="lazy">';
    }
    // 제품명 (purchase 타입)
    var productHtml = r.product ? '<div style="font-size:13px;color:var(--mm-text-d2);margin-bottom:2px">' + r.product + '</div>' : '';
    // 본문 미리보기 (모바일 2열 Masonry — 50자)
    var preview = r.content.length > 50 ? r.content.substring(0, 50) + '…' : r.content;
    return '<article class="mm-rv-card" data-idx="' + idx + '" style="cursor:pointer">' +
      imgHtml +
      '<div class="mm-rv-card__header">' +
        '<span class="mm-rv-card__name">' + maskName(r.name) + '</span>' +
        '<div class="mm-rv-card__chips">' + renderChips(r, 'mm-rv-chip') +
          (r.source === 'naver' ? '<span class="mm-rv-chip mm-rv-chip--naver">네이버</span>' : '') +
        '</div>' +
      '</div>' +
      productHtml +
      '<div class="mm-rv-card__stars">' + renderStars(r.stars) + '</div>' +
      renderTagChips(r, 'mm-rv-card__tags') +
      '<div class="mm-rv-card__text">' + preview + '</div>' +
      renderDates(r, 'mm-rv-card__date') +
    '</article>';
  }

  /* ── 베스트 리뷰 렌더링 ── */
  function renderBestReviews() {
    var bestReviews = allReviews.filter(function(r) { return r.is_best; });
    var bestSection = document.getElementById('rvBest');
    var bestScroll = document.getElementById('rvBestScroll');
    var bestDivider = document.getElementById('rvBestDivider');

    if (bestReviews.length === 0) {
      bestSection.style.display = 'none';
      bestDivider.style.display = 'none';
      return;
    }

    bestSection.style.display = '';
    bestDivider.style.display = '';

    bestScroll.innerHTML = bestReviews.map(function(r, i) {
      var preview = r.content.length > 100 ? r.content.substring(0, 100) + '…' : r.content;
      var sourceLabel = (r.source && SOURCE_LABELS[r.source]) || '';
      var chipHtml = '<span class="mm-rv-best__chip">' + getTypeLabel(r) + '</span>';
      if (sourceLabel) chipHtml += ' <span class="mm-rv-best__chip">' + sourceLabel + '</span>';

      return '<div class="mm-rv-best__card" data-best-idx="' + i + '">' +
        '<div class="mm-rv-best__stars">' + renderStars(r.stars) + '</div>' +
        '<div class="mm-rv-best__name">' + maskName(r.name) + '</div>' +
        '<div>' + chipHtml + '</div>' +
        '<div class="mm-rv-best__text">' + preview + '</div>' +
      '</div>';
    }).join('');

    // 베스트 카드 클릭 → 모달
    bestScroll.onclick = function(e) {
      var card = e.target.closest('.mm-rv-best__card');
      if (!card) return;
      var idx = parseInt(card.dataset.bestIdx);
      if (bestReviews[idx]) openModal(bestReviews[idx]);
    };
  }

  /* 열 수 결정 — 반응형 */
  function getColCount() {
    var w = window.innerWidth;
    if (w >= 1024) return 4;
    if (w >= 768) return 2;
    return 2;
  }

  function render() {
    var grid = document.getElementById('rvGrid');
    var btn = document.getElementById('rvLoadmore');
    var reviews = getFilteredReviews();
    var visible = reviews.slice(0, currentPage * PER_PAGE);

    if (!visible.length) {
      grid.innerHTML = '<div class="mm-rv-empty">아직 등록된 후기가 없습니다.</div>';
      btn.style.display = 'none';
      return;
    }

    /* Masonry: 가로 우선 → 가장 짧은 열에 배치 */
    var colCount = getColCount();
    var cols = [];
    for (var c = 0; c < colCount; c++) cols.push([]);

    /* 첫 라운드: 순서대로 가로 배분 (높이 동일 가정) */
    for (var i = 0; i < visible.length; i++) {
      cols[i % colCount].push(renderCard(visible[i], i));
    }

    grid.innerHTML = cols.map(function(cards) {
      return '<div class="mm-rv-col">' + cards.join('') + '</div>';
    }).join('');

    btn.style.display = (visible.length < reviews.length) ? 'block' : 'none';
  }

  /* ── 상세 모달 — iframe 뷰포트 센터링 ── */
  var overlay = document.getElementById('rvOverlay');
  var modalBody = document.getElementById('rvModalBody');
  var pendingReview = null; // 뷰포트 응답 대기 중인 리뷰

  var currentModalPhotos = [];

  /* 부모에게 뷰포트 정보 요청 → 응답 받아서 모달 위치 설정 */
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'MAMORU_VIEWPORT_INFO' && pendingReview) {
      var vTop = e.data.visibleTop || 0;
      var vH = e.data.visibleHeight || window.innerHeight;
      overlay.style.top = vTop + 'px';
      overlay.style.height = vH + 'px';
      showModalContent(pendingReview);
      pendingReview = null;
    }
  });

  function openModal(r) {
    pendingReview = r;
    /* 부모에게 뷰포트 요청 */
    window.parent.postMessage({ type: 'MAMORU_REQUEST_VIEWPORT' }, '*');
    /* fallback: 200ms 내 응답 없으면 현재 스크롤 기준으로 표시 */
    setTimeout(function() {
      if (!pendingReview) return;
      overlay.style.top = window.scrollY + 'px';
      overlay.style.height = window.innerHeight + 'px';
      showModalContent(pendingReview);
      pendingReview = null;
    }, 200);
  }

  function showModalContent(r) {
    currentModalPhotos = (r.photo_urls && r.photo_urls.length > 0) ? r.photo_urls : [];
    var photosHtml = '';
    if (currentModalPhotos.length > 0) {
      var singleCls = currentModalPhotos.length === 1 ? ' mm-rv-modal__photos--single' : '';
      photosHtml = '<div class="mm-rv-modal__photos' + singleCls + '">' +
        currentModalPhotos.map(function(url, i) {
          return '<img class="mm-rv-modal__photo" src="' + url + '" alt="후기 사진" data-lb-idx="' + i + '">';
        }).join('') + '</div>';
    }
    var productHtml = r.product ? '<div style="font-size:14px;color:var(--mm-text-d2);margin-bottom:12px">' + r.product + '</div>' : '';
    modalBody.innerHTML =
      '<div class="mm-rv-modal__stars">' + renderStars(r.stars) + '</div>' +
      '<div class="mm-rv-modal__name">' + maskName(r.name) + '</div>' +
      '<div class="mm-rv-modal__chips">' + renderChips(r, 'mm-rv-chip') +
        (r.source === 'naver' ? '<span class="mm-rv-chip mm-rv-chip--naver">네이버</span>' : '') +
      '</div>' +
      renderTagChips(r, 'mm-rv-modal__tags') +
      productHtml +
      '<div class="mm-rv-modal__text">' + r.content + '</div>' +
      photosHtml +
      renderDates(r, 'mm-rv-modal__date');
    overlay.classList.add('mm-rv-overlay--open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    overlay.classList.remove('mm-rv-overlay--open');
    document.body.style.overflow = '';
  }

  document.getElementById('rvModalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeModal();
  });

  /* ── 사진 라이트박스 ── */
  var lb = document.getElementById('rvLightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCounter = document.getElementById('lbCounter');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var lbIdx = 0;

  function openLightbox(idx) {
    lbIdx = idx;
    updateLightbox();
    lb.classList.add('mm-lb--open');
  }

  function closeLightbox() {
    lb.classList.remove('mm-lb--open');
  }

  function updateLightbox() {
    lbImg.src = currentModalPhotos[lbIdx];
    var single = currentModalPhotos.length <= 1;
    lbPrev.classList.toggle('hidden', single);
    lbNext.classList.toggle('hidden', single);
    lbCounter.classList.toggle('hidden', single);
    if (!single) {
      lbCounter.textContent = (lbIdx + 1) + ' / ' + currentModalPhotos.length;
    }
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lb.addEventListener('click', function(e) {
    if (e.target === lb) closeLightbox();
  });
  lbPrev.addEventListener('click', function() {
    lbIdx = (lbIdx - 1 + currentModalPhotos.length) % currentModalPhotos.length;
    updateLightbox();
  });
  lbNext.addEventListener('click', function() {
    lbIdx = (lbIdx + 1) % currentModalPhotos.length;
    updateLightbox();
  });

  // 키보드: ESC 닫기, 좌우 화살표
  document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('mm-lb--open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbPrev.click();
    if (e.key === 'ArrowRight') lbNext.click();
  });

  // 모바일 스와이프
  var touchStartX = 0;
  lb.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx > 0) lbPrev.click(); else lbNext.click();
    }
  });

  // 모달 내 사진 클릭 → 라이트박스
  modalBody.addEventListener('click', function(e) {
    var img = e.target.closest('[data-lb-idx]');
    if (img) openLightbox(parseInt(img.dataset.lbIdx));
  });

  // 카드 클릭 → 모달
  document.getElementById('rvGrid').addEventListener('click', function(e) {
    var card = e.target.closest('.mm-rv-card');
    if (!card) return;
    var idx = parseInt(card.dataset.idx);
    var reviews = getFilteredReviews();
    var visible = reviews.slice(0, currentPage * PER_PAGE);
    if (visible[idx]) openModal(visible[idx]);
  });

  /* ── API에서 리뷰 로드 ── */
  function loadReviews() {
    fetch(API_URL + '?type=all')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (Array.isArray(data)) {
          allReviews = data;
        } else {
          allReviews = [];
          console.error('리뷰 로드 실패:', data);
        }
        renderBestReviews();
        render();
      })
      .catch(function(err) {
        console.error('리뷰 API 에러:', err);
        allReviews = [];
        render();
      });
  }

  /* 탭 전환 */
  document.getElementById('rvTabs').addEventListener('click', function(e) {
    var btn = e.target.closest('.mm-rv-tab');
    if (!btn || btn.classList.contains('mm-rv-tab--active')) return;
    this.querySelectorAll('.mm-rv-tab').forEach(function(t) {
      t.classList.remove('mm-rv-tab--active');
    });
    btn.classList.add('mm-rv-tab--active');
    currentType = btn.dataset.type;
    currentPage = 1;
    render();
  });

  /* 더보기 */
  document.getElementById('rvLoadmore').addEventListener('click', function() {
    currentPage++;
    render();
  });

  /* 아임웹 iframe 높이 자동 전달 */
  function initIframeComm() {
    function sendHeight() {
      var h = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: 'MAMORU_IFRAME_SIZE', height: h }, '*');
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(sendHeight).observe(document.body);
    } else {
      setInterval(sendHeight, 500);
    }
    sendHeight();
  }

  /* 초기화 */
  loadReviews();
  initIframeComm();
})();
</script>
</body>
</html>
