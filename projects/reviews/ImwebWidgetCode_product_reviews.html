<!-- Google Fonts: Outfit (display) + Plus Jakarta Sans + Noto Sans KR (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════════
   MAMORU 제품별 후기 — Brand Guide v1.0 (Monochrome)
   아임웹 상품 상세 하단 코드위젯 삽입용
   자동 감지: URL의 idx 파라미터로 상품 식별 → 리뷰 자동 표시
   ══════════════════════════════════════════════════════════════ */

/* ── 아임웹 네이티브 구매평 내용 + 탭 자체 숨김 (2026-05-15 Phase 1) ── */
._review_wrap { display: none !important; }
[class*="review-tab"],
[class*="review_tab"],
.shop_review_tab,
li[data-tab="review"],
a[href*="review"][class*="tab"] { display: none !important; }

/* ── 아임웹 네이티브 Q&A 영역 자체 숨김 (2026-05-15 Phase 1) ──
   자체 시스템 없음 + 고객 문의는 공통 영역 카톡/이메일/전화로 유도
   탭 설정에서 "사용안함" 1차 + CSS 강제 숨김 2차 (이중 안전) */
._detail_qna_wrap, ._detail_qna_wrap_mobile,
.detail_qna_wrap, .detail_qna_wrap_mobile,
._qna_wrap, ._qna,
.prod_detail_qna,
#first_qna,
#prod_detail_qna_target,
#prod_detail_qna_target_mobile,
[class*="qna-tab"], [class*="qna_tab"],
li[data-tab="qna"],
a[href*="qna"][class*="tab"] { display: none !important; }

/* ── 반품/교환 영역 자체 숨김 (FAQ에 정책 포함되어 있음) ── */
[class*="exchange_wrap"], [class*="refund_wrap"],
[class*="exchange-tab"], [class*="refund-tab"],
li[data-tab="exchange"], li[data-tab="refund"],
a[href*="exchange"][class*="tab"], a[href*="refund"][class*="tab"] { display: none !important; }

/* ── 아임웹 네이티브 sticky 탭바 자체 숨김 (Phase 2-C 2026-05-16) ──
   자체 탭바 [정보 | 후기 | 문의] 로 대체 → 중복 방지 */
._prod_detail_tab_fixed,
.site_prod_nav_wrap,
.background_tab { display: none !important; }

/* ── 위젯 초기 숨김 (DOM 이동 완료 후 표시 → 깜빡임 방지) ── */
.mm-prv--ready { opacity: 1 !important; transition: opacity 0.2s ease; }
.mm-prv-initial-hidden { opacity: 0; pointer-events: none; }

/* ══════════════════════════════════════════════════════════════
   Phase 2-C — 자체 sticky 탭바 (모바일 전용) + 모달 화살표
   ══════════════════════════════════════════════════════════════ */

/* ── 자체 탭바 (모바일에서만 표시) ── */
.mm-tabs {
  display: none; /* 기본 숨김, 모바일에서만 표시 */
  position: sticky;
  top: 0;
  z-index: 99;
  background: var(--mm-cream);
  border-bottom: 1px solid var(--mm-border);
  font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
  -webkit-font-smoothing: antialiased;
  /* ⚠️ JS가 탭바를 상세정보 부모(그리드 안)로 이동 → 부모 너비 상속 시 우측 여백 발생
     width:100vw 명시 + 음수 마진으로 좌우 대칭 풀폭 (2026-05-17 갱신) */
  width: 100vw;
  margin-left: calc((100% - 100vw) / 2);
  margin-right: calc((100% - 100vw) / 2);
  box-sizing: border-box;
}
.mm-tabs__inner {
  display: flex;
  max-width: var(--mm-max-w);
  margin: 0 auto;
  width: 100%;
}
.mm-tab {
  flex: 1;
  padding: 14px 8px 12px;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--mm-warm-gray);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  background: transparent;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: inherit;
  letter-spacing: 0.02em;
  transition: color 0.2s ease, border-bottom-color 0.2s ease;
}
.mm-tab.active {
  color: var(--mm-void);
  font-weight: 700;
  border-bottom-color: var(--mm-void);
}
.mm-tab:focus { outline: none; }

@media (max-width: 767px) {
  .mm-tabs { display: block; }
}

/* ── 모달 좌우 화살표 (Phase 2-C 신규) ── */
.mm-prv__modal-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border: none;
  background: var(--mm-shell);
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--mm-void);
  transition: background var(--mm-ease-fast), opacity var(--mm-ease-fast);
  z-index: 2;
}
.mm-prv__modal-nav:hover { background: var(--mm-parchment); }
.mm-prv__modal-nav--prev { left: -52px; }
.mm-prv__modal-nav--next { right: -52px; }
.mm-prv__modal-nav.hidden { display: none; }
.mm-prv__modal-counter {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  color: var(--mm-warm-gray);
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}
.mm-prv__modal-counter.hidden { display: none; }

@media (max-width: 767px) {
  /* 모바일: 화살표를 모달 밖이 아닌 안쪽 상단에 배치 (공간 절약) */
  .mm-prv__modal-nav { position: absolute; top: 14px; transform: none; width: 32px; height: 32px; font-size: 16px; }
  .mm-prv__modal-nav--prev { left: 14px; }
  .mm-prv__modal-nav--next { right: 56px; } /* 닫기(✕) 좌측 */
  .mm-prv__modal-counter { top: 18px; bottom: auto; transform: translateX(-50%); }
  /* 모바일 모달은 상단 padding 더 → 화살표·카운터 자리 확보 */
  .mm-prv__modal { padding-top: 56px; }
}

/* ── 0. 변수 & 리셋 ── */
:root {
  --mm-void: #1A1A1A;
  --mm-graphite: #2D2D2D;
  --mm-stone: #4A4A4A;
  --mm-warm-gray: #8A8580;
  --mm-mist: #B8B4AF;
  --mm-sand: #D4D0CB;
  --mm-parchment: #EDEBE8;
  --mm-shell: #F5F3F0;
  --mm-cream: #FAF9F7;
  --mm-white: #FFFFFF;
  --mm-border: rgba(26,26,26,0.08);
  --mm-radius-sm: 8px;
  --mm-radius-md: 12px;
  --mm-radius-lg: 16px;
  --mm-max-w: 780px;
  --mm-ease: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --mm-ease-fast: 0.15s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.mm-prv {
  font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--mm-cream);
  color: var(--mm-void);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: visible;
}

/* ⚠️ JS가 후기 위젯을 상세정보 부모(그리드 안)로 이동 → 좌우 여백 발생
   PC + 모바일 양쪽에서 viewport 풀폭 강제 (2026-05-17 갱신 — 공통 영역과 폭 통일)
   내부 콘텐츠는 자체 max-width 컨테이너로 중앙 정렬 유지 */
.mm-prv {
  margin-left: calc((100% - 100vw) / 2);
  margin-right: calc((100% - 100vw) / 2);
  width: 100vw;
}

a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

/* ── 1. 요약 헤더 — 큰 평균숫자 + 영문 라벨 (Phase 2) ── */
.mm-prv__summary {
  text-align: center;
  padding: 56px 20px 28px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}
.mm-prv__bar {
  display: inline-block;
  width: 24px;
  height: 2px;
  background: var(--mm-void);
  border-radius: 2px;
  margin-bottom: 18px;
}
.mm-prv__title {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mm-warm-gray);
  margin-bottom: 16px;
}
.mm-prv__avg {
  font-family: 'Outfit', sans-serif;
  font-size: 48px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--mm-void);
  display: block;
  margin-bottom: 12px;
}
.mm-prv__stars-display {
  font-size: 16px;
  letter-spacing: 4px;
  color: var(--mm-void);
  margin-bottom: 8px;
}
.mm-prv__count {
  font-size: 12px;
  font-weight: 500;
  color: var(--mm-warm-gray);
  letter-spacing: 0.02em;
}

/* ── 1-B. 별점 분포 그래프 — 슬림화 (Phase 2 미세조정) ── */
.mm-prv__dist {
  max-width: 360px;
  margin: 0 auto 8px;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.mm-prv__dist-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  cursor: pointer;
  transition: opacity var(--mm-ease-fast);
}
.mm-prv__dist-row:hover { opacity: 0.7; }
.mm-prv__dist-row.active { font-weight: 700; }
.mm-prv__dist-star {
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  color: var(--mm-warm-gray);
  width: 28px;
  flex-shrink: 0;
  font-size: 11px;
}
.mm-prv__dist-row.active .mm-prv__dist-star { color: var(--mm-void); }
.mm-prv__dist-bar {
  flex: 1;
  height: 4px;
  background: var(--mm-parchment);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.mm-prv__dist-bar-fill {
  height: 100%;
  background: var(--mm-void);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.mm-prv__dist-count {
  font-size: 10px;
  color: var(--mm-mist);
  width: 32px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

/* ── 1-C. 필터/정렬 바 — 슬림 (Phase 2 미세조정) ── */
.mm-prv__controls {
  max-width: var(--mm-max-w);
  margin: 20px auto 4px;
  padding: 0 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.mm-prv__filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.mm-prv__filter-btn {
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  color: var(--mm-warm-gray);
  background: transparent;
  border: 1px solid var(--mm-border);
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
  transition: all var(--mm-ease-fast);
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.mm-prv__filter-btn:hover {
  border-color: var(--mm-stone);
  color: var(--mm-void);
}
.mm-prv__filter-btn.active {
  background: var(--mm-void);
  color: var(--mm-cream);
  border-color: var(--mm-void);
  font-weight: 600;
}
.mm-prv__sort {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--mm-warm-gray);
}
.mm-prv__sort-select {
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  color: var(--mm-void);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--mm-border);
  border-radius: 0;
  padding: 4px 22px 4px 4px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%231A1A1A' stroke-width='1.5' fill='none'/></svg>");
  background-repeat: no-repeat;
  background-position: right 6px center;
}
.mm-prv__sort-select:focus { outline: none; border-bottom-color: var(--mm-void); }

/* ── 1-D. 포토 후기 갤러리 — 호흡 (Phase 2 미세조정) ── */
.mm-prv__gallery-wrap {
  max-width: var(--mm-max-w);
  margin: 0 auto;
  padding: 28px 20px 4px;
}
.mm-prv__gallery-title {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--mm-warm-gray);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.mm-prv__gallery-count {
  font-size: 10px;
  color: var(--mm-mist);
  letter-spacing: 0;
  text-transform: none;
  font-weight: 500;
}
.mm-prv__gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.mm-prv__gallery-item {
  aspect-ratio: 1 / 1;
  border-radius: 4px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--mm-shell);
}
.mm-prv__gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform var(--mm-ease);
}
.mm-prv__gallery-item:hover img { transform: scale(1.05); }
.mm-prv__gallery-item.more {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--mm-void);
  color: var(--mm-cream);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.05em;
}

/* ── 빈 상태 (필터 결과 0건 / 후기 0건) ── */
.mm-prv__empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--mm-warm-gray);
  font-size: 14px;
}
.mm-prv__zero {
  max-width: var(--mm-max-w);
  margin: 0 auto;
  padding: 80px 20px 96px;
  text-align: center;
}
.mm-prv__zero-label {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mm-warm-gray);
  margin-bottom: 24px;
}
.mm-prv__zero-icon {
  font-family: 'Outfit', sans-serif;
  font-size: 32px;
  letter-spacing: 4px;
  color: var(--mm-sand);
  margin-bottom: 20px;
  line-height: 1;
}
.mm-prv__zero-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--mm-void);
  line-height: 1.5;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.mm-prv__zero-sub {
  font-size: 13px;
  color: var(--mm-warm-gray);
  line-height: 1.7;
  letter-spacing: 0.01em;
}
@media (min-width: 768px) {
  .mm-prv__zero { padding: 96px 40px 112px; }
  .mm-prv__zero-icon { font-size: 36px; }
  .mm-prv__zero-title { font-size: 17px; }
  .mm-prv__zero-sub { font-size: 14px; }
}

/* ── 2. 리뷰 그리드 ── */
.mm-prv__grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: 16px 20px 0;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}

/* ── 3. 리뷰 카드 — 호흡 강화 (Phase 2 미세조정) ── */
.mm-prv__card {
  background: var(--mm-white);
  border: 1px solid var(--mm-border);
  border-radius: var(--mm-radius-md);
  padding: 22px 22px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: box-shadow var(--mm-ease), transform var(--mm-ease-fast);
  cursor: pointer;
}
.mm-prv__card-img {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--mm-radius-sm);
  object-fit: cover;
}
.mm-prv__card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.mm-prv__card-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--mm-void);
  letter-spacing: -0.01em;
}
.mm-prv__card-stars {
  color: var(--mm-void);
  font-size: 12px;
  letter-spacing: 1.5px;
}
.mm-prv__card-product {
  font-size: 12px;
  font-weight: 500;
  color: var(--mm-warm-gray);
  letter-spacing: 0.01em;
}
.mm-prv__card-text {
  font-size: 14px;
  font-weight: 400;
  color: var(--mm-graphite);
  line-height: 1.75;
}
.mm-prv__card-date {
  font-size: 11px;
  color: var(--mm-mist);
  padding-top: 12px;
  border-top: 1px solid var(--mm-border);
  letter-spacing: 0.02em;
}
/* 속성 태그 — 미니멀 (Phase 2) */
.mm-prv__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
/* 카드 '+N' — 조용한 보조 표시 */
.mm-prv__tag--more { border: none; color: var(--mm-warm-gray); font-weight: 600; padding: 2px 4px; opacity: .7; }
.mm-prv__tag {
  font-size: 10px;
  font-weight: 500;
  color: var(--mm-warm-gray);
  padding: 2px 8px;
  border: 1px solid var(--mm-border);
  border-radius: var(--mm-radius-sm);
  background: transparent;
  letter-spacing: 0.02em;
}

/* ── 모달 ── */
.mm-prv__overlay {
  position: absolute; left: 0; right: 0; z-index: 9999;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: flex-end; justify-content: center;  /* 하단 기준 — 버튼 위치 고정(다음 연타) */
  padding: 20px;
  opacity: 0; visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
}
@media (min-width: 768px) { .mm-prv__overlay { align-items: center; } }  /* PC는 중앙 */
.mm-prv__overlay--open { opacity: 1; visibility: visible; }
.mm-prv__modal {
  background: var(--mm-white); border-radius: var(--mm-radius-lg);
  max-width: 520px; width: 100%;
  max-height: calc(100% - 24px); overflow: hidden;
  padding: 28px 24px;
  position: relative;
  display: flex; flex-direction: column;
}
/* 내용(사진+글씨) 영역만 스크롤 — 상단 잘림 방지 */
#prvModalBody { flex: 1; min-height: 0; overflow-y: auto; }
/* 하단 순회/닫기 버튼 (이전·다음·닫기, 닫기는 우측·작게 — 3화면 통일) */
.mm-prv__modal-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--mm-border); display: flex; gap: 8px; flex-shrink: 0; }

<script>
(function(){
  'use strict';

  var API_URL = 'https://app-eta-sandy-75.vercel.app/api/reviews/public';
  var PER_PAGE = 6;
  var currentPage = 1;
  var allReviews = [];       // 원본 데이터 (불변)
  var filteredReviews = [];  // 필터/정렬 적용된 데이터
  var galleryPhotos = [];    // 전체 리뷰 사진 평면화 {url, review} (page_reviews 동기화)
  var currentModalReview = null;
  var lbList = [];           // 라이트박스 순회 대상 [{url, review}]
  var currentFilter = 'all'; // all | photo | 5 | 4 | 3
  var currentSort = 'recent';
  var root = document.getElementById('mmPrvRoot');

  /* ── 자동 감지: 아임웹 상품번호 추출 ── */
  var urlParams = new URLSearchParams(window.location.search);

  /* ── 데모 모드 체크 (?demo=1 — 검증용, 일반 사용자 영향 X) ── */
  var DEMO_MODE = urlParams.get('demo') === '1';

  function extractIdx(url) {
    if (!url) return null;
    try {
      var match = url.match(/[?&]idx=(\d+)/);
      return match ? match[1] : null;
    } catch(e) { return null; }
  }

  // 1순위: ?group= (수동 지정, 하위호환)
  // 2순위: ?idx= (아임웹 URL에서 직접)
  // 3순위: referrer에서 idx 추출
  var group = urlParams.get('group');
  var imwebNo = urlParams.get('idx')
    || extractIdx(document.referrer)
    || extractIdx(window.location.href);

  var apiQuery = '';
  if (group) {
    apiQuery = '?group=' + encodeURIComponent(group);
  } else if (imwebNo) {
    apiQuery = '?imweb_no=' + encodeURIComponent(imwebNo);
  } else if (!DEMO_MODE) {
    // 감지 실패 → 위젯 숨김 유지 (데모 모드는 imweb_no 없어도 통과)
    sendHeight(0);
    return;
  }

  /* ── 유틸 ── */
  function maskName(name) {
    if (!name) return '';
    if (name.length <= 1) return name;
    if (name.length === 2) return name[0] + '*';
    return name[0] + '*'.repeat(name.length - 2) + name[name.length - 1];
  }

  var TAG_LABELS = {
    comfortable:'강요없이 편안해요', detailed_guide:'설명이 자세해요', professional:'전문적이에요',
    personalized:'맞춤 안내', worth_time:'시간이 아깝지 않았어요',
    reasonable_price:'합리적이에요', fair_price:'적당해요',
    like_new:'새 가위처럼', better_cut:'커트감이 달라요', above_expect:'기대 이상',
    precise_edge:'날 조절 정확', thorough_info:'안내 꼼꼼', fast_service:'진행 빠름', good_value:'가격 대비 만족',
    good_quality:'품질이 좋아요', fast_delivery:'배송이 빨라요', neat_packaging:'포장이 꼼꼼해요',
    would_recommend:'추천하고 싶어요'
  };

  function renderTagChips(r, cls, limit) {
    var tags = r.meta && r.meta.tags;
    if (!tags || !tags.length) return '';
    var over = limit && tags.length > limit;      // 카드=상위 N + '+나머지', 모달=전량
    var shown = over ? tags.slice(0, limit) : tags;
    var more = over ? '<span class="mm-prv__tag mm-prv__tag--more">+' + (tags.length - limit) + '</span>' : '';
    return '<div class="' + cls + '">' +
      shown.map(function(t) { return '<span class="mm-prv__tag">' + (TAG_LABELS[t] || t) + '</span>'; }).join('') + more +
    '</div>';
  }

  /* 날짜 YYMMDD (page_reviews 동기화) */
  function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d);
    var yy = String(dt.getFullYear()).slice(2);
    var mm = String(dt.getMonth() + 1).padStart(2, '0');
    var dd = String(dt.getDate()).padStart(2, '0');
    return yy + mm + dd;
  }

  /* ── 타입/서브타입/칩/날짜 (page_reviews 와 동일 — 3화면 SSOT) ── */
  var TYPE_LABELS = { consult: '상담', repair: '복원수리', purchase: '제품구매' };
  var SUBTYPE_LABELS = { store_visit: '직접방문', field_request: '출장', talk_consult: '톡상담', restoration: '복원수리', direct_visit: '직접방문', pickup: '방문수거', parcel_pickup: '방문수거', self_ship: '직접발송', offline: '오프라인', online: '온라인', talk: '톡상담', visit_pickup: '방문수거', direct_send: '직접발송', same_day: '당일수리' };
  var DATE_LABELS = { consult: '상담', repair: '접수', purchase: '구매' };
  function getTypeLabel(r) { return TYPE_LABELS[r.type] || ''; }
  function getSubtypeLabel(r) {
    var sub = r.subtype || (r.meta && r.meta.consultation_type) || '';
    return SUBTYPE_LABELS[sub] || '';
  }
  function chipLabel(r) {
    var t = getTypeLabel(r), s = getSubtypeLabel(r);
    if (r.type === 'consult' && s) return t + '·' + s;
    var rawSub = r.subtype || '';
    if (s && rawSub !== 'restoration' && s !== t) return t + '·' + s;
    return t;
  }
  function chipHtml(r) {
    var lbl = chipLabel(r);
    return lbl ? '<span class="mm-prv__chip">' + lbl + '</span>' : '';
  }
  function maskStore(s) {
    if (!s) return '';
    s = String(s).trim();
    if (s.length <= 1) return s;
    if (s.length === 2) return s[0] + '*';
    if (s.length === 3) return s[0] + '**';
    return s[0] + '**' + s.slice(3);
  }
  function storeHtml(r) {
    if (!r.store_name) return '';
    return ' <span style="font-size:11px;color:#8A8580;font-weight:500;">· ' + maskStore(r.store_name) + '</span>';
  }
  function renderDates(r, cls) {
    var rec = (r.meta && r.meta.received_at) ? fmtDate(r.meta.received_at) : '';
    var cr = fmtDate(r.created_at);
    var lab = DATE_LABELS[r.type] || '접수';
    var parts = [];
    if (rec) parts.push(lab + ' ' + rec);
    if (cr) parts.push('작성 ' + cr);
    return '<div class="' + cls + '">' + parts.join(' · ') + '</div>';
  }

  function renderStars(n) {
    var s = '';
    for (var i = 0; i < 5; i++) s += (i < n) ? '★' : '☆';
    return s;
  }

  function renderSummaryStars(avg) {
    var s = '';
    for (var i = 0; i < 5; i++) s += (i < Math.round(avg)) ? '★' : '☆';
    return s;
  }

  /* ── 카드 렌더링 ── */
  function renderCard(r, idx) {
    var imgHtml = '';
    if (r.photo_urls && r.photo_urls.length > 0) {
      imgHtml = '<img class="mm-prv__card-img" src="' + r.photo_urls[0] + '" alt="후기 이미지" loading="lazy">';
    } else if (r.product_image_url) {
      imgHtml = '<img class="mm-prv__card-img" src="' + r.product_image_url + '" alt="제품 이미지" loading="lazy">';
    }
    var productHtml = r.product ? '<div class="mm-prv__card-product">' + r.product + '</div>' : '';
    var preview = r.content.length > 80 ? r.content.substring(0, 80) + '…' : r.content;

    return '<article class="mm-prv__card" data-idx="' + idx + '">' +
      imgHtml +
      '<div class="mm-prv__card-header">' +
        '<span class="mm-prv__card-name">' + maskName(r.name) + storeHtml(r) + chipHtml(r) + '</span>' +
        '<span class="mm-prv__card-stars">' + renderStars(r.stars) + '</span>' +
      '</div>' +
      productHtml +
      renderTagChips(r, 'mm-prv__tags', 2) +
      '<div class="mm-prv__card-text">' + preview + '</div>' +
      renderDates(r, 'mm-prv__card-date') +
    '</article>';
  }

  // 모바일은 가로 스크롤 → 처음부터 전체 노출 (더보기 버튼 없음)
  function getEffectivePerPage() {
    return window.innerWidth < 768 ? 999 : PER_PAGE;
  }

  function render() {
    var grid = document.getElementById('prvGrid');
    var btn = document.getElementById('prvLoadmore');
    var empty = document.getElementById('prvEmpty');
    var perPage = getEffectivePerPage();
    var visible = filteredReviews.slice(0, currentPage * perPage);
    if (filteredReviews.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      btn.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = visible.map(function(r, i) { return renderCard(r, i); }).join('');
    // PC에서만 더보기 버튼 노출 (모바일은 CSS로 추가 숨김)
    btn.style.display = (visible.length < filteredReviews.length) ? 'block' : 'none';
  }

  function renderSummary(stats) {
    if (!stats || stats.count === 0) return;
    document.getElementById('prvStars').textContent = renderSummaryStars(stats.average);
    document.getElementById('prvAvg').textContent = stats.average.toFixed(1);
    document.getElementById('prvCount').textContent = '후기 ' + stats.count + '건';
  }

  /* ── Phase 1: 별점 분포 그래프 ── */
  function renderDist() {
    var total = allReviews.length;
    if (total === 0) return;
    var counts = [0, 0, 0, 0, 0]; // index 0=★5, 1=★4, 2=★3, 3=★2, 4=★1
    allReviews.forEach(function(r) {
      var s = Math.max(1, Math.min(5, parseInt(r.stars) || 0));
      counts[5 - s]++;
    });
    var distEl = document.getElementById('prvDist');
    distEl.innerHTML = counts.map(function(c, i) {
      var star = 5 - i;
      var pct = total > 0 ? Math.round((c / total) * 100) : 0;
      return '<div class="mm-prv__dist-row" data-filter="' + star + '">' +
        '<span class="mm-prv__dist-star">★ ' + star + '</span>' +
        '<div class="mm-prv__dist-bar"><div class="mm-prv__dist-bar-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="mm-prv__dist-count">' + c + '건</span>' +
      '</div>';
    }).join('');
    // 분포 막대 클릭 → 해당 별점 필터 적용
    distEl.addEventListener('click', function(e) {
      var row = e.target.closest('.mm-prv__dist-row');
      if (!row) return;
      var star = row.dataset.filter;
      setFilter(star);
    });
  }

  /* ── 포토 후기 갤러리 — 전 사진 평면화(리뷰당 모든 사진), 사진 단위 라이트박스 (page_reviews 동기화) ── */
  var galMaxShow = 6;
  function renderGallery() {
    galleryPhotos = [];
    allReviews.forEach(function(r) {
      if (r.photo_urls && r.photo_urls.length > 0) {
        r.photo_urls.forEach(function(u) { galleryPhotos.push({ url: u, review: r }); });
      }
    });
    if (galleryPhotos.length === 0) return;

    var wrap = document.getElementById('prvGalleryWrap');
    var galleryEl = document.getElementById('prvGallery');
    var countEl = document.getElementById('prvGalleryCount');
    wrap.style.display = 'block';
    countEl.textContent = '· ' + galleryPhotos.length + '장';

    // page_reviews와 동일: PC 12 / 태블릿 8 / 모바일 6 (컬럼수×2행)
    galMaxShow = window.innerWidth >= 1024 ? 12 : (window.innerWidth >= 768 ? 8 : 6);
    var maxShow = galMaxShow;
    var displayed = galleryPhotos.slice(0, maxShow);
    var hasMore = galleryPhotos.length > maxShow;

    galleryEl.innerHTML = displayed.map(function(p, i) {
      if (hasMore && i === maxShow - 1) {
        return '<div class="mm-prv__gallery-item more" data-gallery-more="1">+' + (galleryPhotos.length - maxShow + 1) + '</div>';
      }
      return '<div class="mm-prv__gallery-item" data-gal-idx="' + i + '">' +
        '<img src="' + p.url + '" alt="포토 후기" loading="lazy">' +
      '</div>';
    }).join('');

    // 사진 클릭 → 라이트박스. 리스너는 1회만 바인딩(리사이즈 재렌더 시 중복 방지), galMaxShow는 공유값
    if (!galleryEl.__galBound) {
      galleryEl.__galBound = true;
      galleryEl.addEventListener('click', function(e) {
        if (e.target.closest('[data-gallery-more]')) { openLightbox(galleryPhotos, galMaxShow - 1); return; }
        var item = e.target.closest('[data-gal-idx]');
        if (item) openLightbox(galleryPhotos, parseInt(item.dataset.galIdx));
      });
    }
  }

  // 뷰포트 폭 변화 시 갤러리 노출 장수 재계산 (page_reviews와 동일, 디바운스)
  var _prvGalRz;
  window.addEventListener('resize', function () {
    clearTimeout(_prvGalRz);
    _prvGalRz = setTimeout(function () { if (galleryPhotos.length) renderGallery(); }, 200);
  });

  /* ── Phase 1: 필터 + 정렬 ── */
  function applyFilterSort() {
    var arr = allReviews.slice();

    // 필터
    if (currentFilter === 'photo') {
      arr = arr.filter(function(r) { return r.photo_urls && r.photo_urls.length > 0; });
    } else if (currentFilter === '5' || currentFilter === '4' || currentFilter === '3') {
      var target = parseInt(currentFilter);
      arr = arr.filter(function(r) { return parseInt(r.stars) === target; });
    }

    // 정렬
    if (currentSort === 'recent') {
      arr.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    } else if (currentSort === 'rating_high') {
      arr.sort(function(a, b) {
        if (b.stars !== a.stars) return b.stars - a.stars;
        return new Date(b.created_at) - new Date(a.created_at);
      });
    } else if (currentSort === 'rating_low') {
      arr.sort(function(a, b) {
        if (a.stars !== b.stars) return a.stars - b.stars;
        return new Date(b.created_at) - new Date(a.created_at);
      });
    }

    filteredReviews = arr;
    currentPage = 1; // 필터 변경 시 페이지 초기화
  }

  function setFilter(filter) {
    currentFilter = filter;
    // 버튼 active 상태 갱신
    var btns = document.querySelectorAll('.mm-prv__filter-btn');
    btns.forEach(function(b) {
      b.classList.toggle('active', b.dataset.filter === filter);
    });
    // 분포 행 active 표시
    var rows = document.querySelectorAll('.mm-prv__dist-row');
    rows.forEach(function(r) {
      r.classList.toggle('active', r.dataset.filter === filter);
    });
    applyFilterSort();
    render();
    // 그리드 위로 스크롤
    var grid = document.getElementById('prvGrid');
    if (grid && grid.scrollIntoView) grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 필터 버튼 클릭
  document.getElementById('prvFilters').addEventListener('click', function(e) {
    var btn = e.target.closest('.mm-prv__filter-btn');
    if (!btn) return;
    setFilter(btn.dataset.filter);
  });

  // 정렬 변경
  document.getElementById('prvSort').addEventListener('change', function(e) {
    currentSort = e.target.value;
    applyFilterSort();
    render();
  });

  /* ── 상세 모달 — 좌우 화살표로 다음/이전 후기 순환 (Phase 2-C) ── */
  var overlay = document.getElementById('prvOverlay');
  /* 뷰포트 앵커 — 높이동기 iframe 안에서 fixed 오버레이가 잘리는 문제 해결(page_reviews 패턴) */
  var _pendingVpCb = null;
  window.addEventListener('message', function(e){
    if (e.data && e.data.type === 'MAMORU_VIEWPORT_INFO' && _pendingVpCb) {
      var cb = _pendingVpCb; _pendingVpCb = null; cb(e.data.visibleTop || 0, e.data.visibleHeight || window.innerHeight);
    }
  });
  function placeInViewport(el, done){
    _pendingVpCb = function(top, h){ el.style.top = top + 'px'; el.style.height = h + 'px'; if (done) done(); };
    try { window.parent.postMessage({ type: 'MAMORU_REQUEST_VIEWPORT' }, '*'); } catch(_) {}
    setTimeout(function(){ if (!_pendingVpCb) return; _pendingVpCb = null; el.style.top = (window.scrollY||0) + 'px'; el.style.height = window.innerHeight + 'px'; if (done) done(); }, 200);
  }
  var modalBody = document.getElementById('prvModalBody');
  var modalPrev = document.getElementById('prvModalPrev');
  var modalNext = document.getElementById('prvModalNext');
  var modalCounter = document.getElementById('prvModalCounter');
  var currentModalPhotos = [];
  var modalContext = { list: [], idx: -1, source: 'card' }; // list = 순회 대상, idx = 현재 인덱스

  function renderModalContent(r) {
    currentModalReview = r;
    currentModalPhotos = (r.photo_urls && r.photo_urls.length > 0) ? r.photo_urls : [];
    var photosHtml = '';
    if (currentModalPhotos.length > 0) {
      var singleCls = currentModalPhotos.length === 1 ? ' mm-prv__modal-photos--single' : '';
      photosHtml = '<div class="mm-prv__modal-photos' + singleCls + '">' +
        currentModalPhotos.map(function(url, i) {
          return '<img class="mm-prv__modal-photo" src="' + url + '" alt="후기 사진" data-lb-idx="' + i + '">';
        }).join('') + '</div>';
    }
    var productHtml = r.product ? '<div class="mm-prv__modal-product">' + r.product + '</div>' : '';
    // 시안 순서: 사진(상단) → 이름 → 별점 → product → 태그 → 내용 → 날짜
    modalBody.innerHTML =
      photosHtml +
      '<div class="mm-prv__modal-name">' + maskName(r.name) + storeHtml(r) + chipHtml(r) + '</div>' +
      '<div class="mm-prv__modal-stars">' + renderStars(r.stars) + '</div>' +
      productHtml +
      renderTagChips(r, 'mm-prv__tags') +
      '<div class="mm-prv__modal-text">' + r.content + '</div>' +
      renderDates(r, 'mm-prv__modal-date');
  }

  function updateModalNav() {
    var total = modalContext.list.length;
    // 하단 이전/다음 버튼 disabled (page_reviews 와 통일)
    var fp = document.getElementById('prvModalFootPrev'), fn = document.getElementById('prvModalFootNext');
    if (fp) fp.disabled = modalContext.idx <= 0;
    if (fn) fn.disabled = modalContext.idx >= total - 1;
  }

  function openModalAt(list, idx, source) {
    if (!list || list.length === 0) return;
    var safeIdx = ((idx % list.length) + list.length) % list.length; // 음수 보정 + 순환
    modalContext = { list: list, idx: safeIdx, source: source || 'card' };
    var doRender = function(){
      renderModalContent(list[safeIdx]);
      updateModalNav();
      overlay.classList.add('mm-prv__overlay--open');
      document.body.style.overflow = 'hidden';
      // 모달 내용 위로 스크롤 (긴 후기 후 다음 후기 진입 시 상단부터 보이도록)
      var modalEl = document.querySelector('.mm-prv__modal');
      if (modalEl) modalEl.scrollTop = 0;
    };
    // 최초 열기만 뷰포트 배치(순회 중엔 이미 배치돼 있어 재요청 불필요)
    if (overlay.classList.contains('mm-prv__overlay--open')) doRender();
    else placeInViewport(overlay, function(){ doRender(); try { history.pushState({ mmPrvModal: 1 }, ''); } catch(_) {} try { window.parent.postMessage({ type: 'MAMORU_LOCK_SCROLL' }, '*'); } catch(_) {} }); // 폰 뒤로가기 → 모달만 닫힘 + 배경 스크롤 잠금
  }

  function navigateModal(dir) {
    if (!modalContext.list || modalContext.list.length === 0) return;
    var newIdx = modalContext.idx + dir;
    openModalAt(modalContext.list, newIdx, modalContext.source);
  }

  function doCloseModal() {
    overlay.classList.remove('mm-prv__overlay--open');
    document.body.style.overflow = '';
    try { window.parent.postMessage({ type: 'MAMORU_UNLOCK_SCROLL' }, '*'); } catch(_) {}
  }
  function closeModal() { if (history.state && history.state.mmPrvModal) history.back(); else doCloseModal(); }
  window.addEventListener('popstate', function(){ if (overlay.classList.contains('mm-prv__overlay--open')) doCloseModal(); });

  document.getElementById('prvModalClose').addEventListener('click', closeModal);
  document.getElementById('prvModalCloseBtn').addEventListener('click', closeModal);
  modalPrev.addEventListener('click', function(e) { e.stopPropagation(); navigateModal(-1); });
  modalNext.addEventListener('click', function(e) { e.stopPropagation(); navigateModal(1); });
  document.getElementById('prvModalFootPrev').addEventListener('click', function(){ navigateModal(-1); });
  document.getElementById('prvModalFootNext').addEventListener('click', function(){ navigateModal(1); });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });

  document.getElementById('prvGrid').addEventListener('click', function(e) {
    var card = e.target.closest('.mm-prv__card');
    if (!card) return;
    var idx = parseInt(card.dataset.idx);
    // 모달 순회는 전체 리뷰 기준(더보기 로드 여부 무관 끝까지)
    if (filteredReviews[idx]) openModalAt(filteredReviews, idx, 'card');
  });

  // 모달이 열려있을 때 스와이프 (모바일) — 라이트박스 닫혀있을 때만
  var modalTouchStartX = 0;
  overlay.addEventListener('touchstart', function(e) {
    if (!overlay.classList.contains('mm-prv__overlay--open')) return;
    modalTouchStartX = e.touches[0].clientX;
  }, { passive: true });
  overlay.addEventListener('touchend', function(e) {
    if (!overlay.classList.contains('mm-prv__overlay--open')) return;
    // 라이트박스가 열려있으면 라이트박스 스와이프가 우선 (모달 스와이프 무시)
    if (document.getElementById('prvLightbox').classList.contains('mm-lb--open')) return;
    var dx = e.changedTouches[0].clientX - modalTouchStartX;
    if (Math.abs(dx) > 60) navigateModal(dx > 0 ? -1 : 1);
  });

  /* ── 라이트박스 (lbList = [{url, review}], 캡션 = 부모 리뷰 — page_reviews 동기화) ── */
  var lb = document.getElementById('prvLightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCounter = document.getElementById('lbCounter');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var capEl = document.getElementById('lbCaption');
  var lbIdx = 0;

  function openLightbox(list, idx) {
    lbList = list || [];
    lbIdx = idx || 0;
    updateLightbox();
    // 라이트박스도 오버레이와 동일 뷰포트 좌표로(잘림 방지)
    lb.style.top = overlay.style.top || '0px';
    lb.style.height = overlay.style.height || window.innerHeight + 'px';
    lb.classList.add('mm-lb--open');
  }
  function closeLightbox() { lb.classList.remove('mm-lb--open'); }

  function capDates(r) {
    var rec = (r.meta && r.meta.received_at) ? fmtDate(r.meta.received_at) : '';
    var cr = fmtDate(r.created_at);
    var lab = DATE_LABELS[r.type] || '접수';
    var parts = [];
    if (rec) parts.push('<span>' + lab + ' ' + rec + '</span>');
    if (cr) parts.push('<span>작성 ' + cr + '</span>');
    return parts.length ? '<div class="mm-lb__cap-date">' + parts.join('') + '</div>' : '';
  }

  function updateLightbox() {
    var item = lbList[lbIdx];
    if (!item) return;
    lbImg.src = item.url;
    var multi = lbList.length > 1;
    lbPrev.classList.toggle('hidden', !multi);
    lbNext.classList.toggle('hidden', !multi);
    lbCounter.classList.toggle('hidden', !multi);
    if (multi) lbCounter.textContent = (lbIdx + 1) + ' / ' + lbList.length;
    var r = item.review;
    if (r) {
      lb.classList.add('mm-lb--cap');
      capEl.style.display = '';
      capEl.innerHTML = '<div class="mm-lb__cap-inner">' +
        '<div class="mm-lb__cap-stars">' + renderStars(r.stars) + '</div>' +
        '<div class="mm-lb__cap-name">' + maskName(r.name) + (r.name ? ' 님' : '') +
          '<span class="mm-lb__cap-chip">' + chipLabel(r) + '</span>' +
        '</div>' +
        '<div class="mm-lb__cap-text">' + (r.content || '') + '</div>' +
        capDates(r) +
      '</div>';
    } else {
      lb.classList.remove('mm-lb--cap'); capEl.style.display = 'none'; capEl.innerHTML = '';
    }
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lb.addEventListener('click', function(e) { if (e.target === lb) closeLightbox(); });
  lbPrev.addEventListener('click', function() {
    if (!lbList.length) return;
    lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; updateLightbox();
  });
  lbNext.addEventListener('click', function() {
    if (!lbList.length) return;
    lbIdx = (lbIdx + 1) % lbList.length; updateLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (lb.classList.contains('mm-lb--open')) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lbPrev.click();
      if (e.key === 'ArrowRight') lbNext.click();
    } else if (overlay.classList.contains('mm-prv__overlay--open')) {
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') navigateModal(-1);
      if (e.key === 'ArrowRight') navigateModal(1);
    }
  });

  var touchStartX = 0;
  lb.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) { dx > 0 ? lbPrev.click() : lbNext.click(); }
  });

  // 모달 내 사진 클릭 → 라이트박스 (그 리뷰 사진들 + 캡션)
  modalBody.addEventListener('click', function(e) {
    var img = e.target.closest('[data-lb-idx]');
    if (!img) return;
    var list = currentModalPhotos.map(function(u) { return { url: u, review: currentModalReview }; });
    openLightbox(list, parseInt(img.dataset.lbIdx));
  });

  /* 더보기 */
  document.getElementById('prvLoadmore').addEventListener('click', function() { currentPage++; render(); });

  /* ── iframe 높이 전달 ── */
  function sendHeight(h) {
    var height = (h !== undefined) ? h : document.documentElement.scrollHeight;
    window.parent.postMessage({ type: 'MAMORU_IFRAME_SIZE', height: height }, '*');
  }
  function initIframeComm() {
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(function() { sendHeight(); }).observe(document.body);
    } else {
      setInterval(function() { sendHeight(); }, 500);
    }
    sendHeight();
  }

  /* ══════════════════════════════════════════════════════════════
     Phase 2-C: DOM 배치 + sticky 탭바 (2026-05-16)
     ──────────────────────────────────────────────────────────────
     배치 흐름 (무신사 표준):
       1) 상품 메인 (이미지·가격·구매하기)
       2) [sticky 탭바: 정보 | 후기 | 문의]  ← 모바일만 표시
       3) 상세정보 (아임웹 네이티브)
       4) 후기 위젯
       5) 공통 영역 (PROMISE·카카오·FAQ) — 외부 코드위젯

     아임웹 PC/모바일 DOM 분리 대응:
       findVisible(selector) — offsetParent !== null 인 노드만 선택
       resize 이벤트에서 viewport 변경 시 재배치 */

  // 보이는(현재 viewport에서 렌더되는) 노드 1개만 반환
  function findVisible(selector) {
    var nodes = document.querySelectorAll(selector);
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].offsetParent !== null) return nodes[i];
    }
    return null;
  }

  // 상세정보 본문 영역 (PC: lazy_load, 모바일: lazy_load_mobile)
  function findDetailSection() {
    var selectors = [
      '._prod_detail_detail_lazy_load',
      '._prod_detail_detail_lazy_load_mobile',
      '._detail_detail_wrap',
      '._detail_detail_wrap_mobile'
    ];
    for (var i = 0; i < selectors.length; i++) {
      var el = findVisible(selectors[i]);
      if (el) return el;
    }
    return null;
  }

  // ⚠️ 상세정보 블록 끝(펼쳐보기 버튼) 찾기 — 후기 위젯을 *그 다음*에 배치하기 위함
  //    아임웹 lazy_load_mobile 은 미리보기만 감싸고, "펼쳐보기" 버튼은 형제로 존재
  //    → 펼쳐보기 버튼 다음으로 후기 위젯을 옮겨야 사장님 의도(상세정보 블록 전체 아래) 일치
  function findExpandAnchor(detail) {
    if (!detail || !detail.parentNode) return null;
    var parent = detail.parentNode;
    var children = parent.children;
    var passed = false;
    for (var i = 0; i < children.length; i++) {
      var el = children[i];
      if (el === detail) { passed = true; continue; }
      if (!passed) continue;
      // detail 다음 형제 중 "펼쳐보기"·"더보기" 텍스트 or 일반적인 more/expand 클래스
      var text = (el.textContent || '').trim();
      if (text.length < 30 && /펼쳐보기|상세보기|더보기|펼치기/.test(text)) return el;
      var cls = el.className || '';
      if (typeof cls === 'string' && /\b(view_more|view-more|btn_more|btn-more|_more|more_btn|expand|detail_more)\b/i.test(cls)) return el;
      // 또는 자식에 펼쳐보기 버튼이 포함된 경우 (감싸는 div)
      if (el.querySelector && el.querySelector('a, button')) {
        var inner = el.querySelector('a, button');
        var innerText = (inner.textContent || '').trim();
        if (innerText.length < 30 && /펼쳐보기|상세보기|더보기|펼치기/.test(innerText)) return el;
      }
    }
    return null; // 못 찾으면 null → fallback 으로 detail 직후 사용
  }

  function tryArrangeLayout() {
    try {
      var widget = root && root.parentElement; // 후기 위젯 코드위젯 래퍼
      var tabs = document.getElementById('mmTabs');
      if (!widget) return false;

      var detail = findDetailSection();
      if (!detail || !detail.parentNode) {
        console.log('[MAMORU 리뷰] 상세정보 영역 미발견 — 재시도 대기');
        return false;
      }

      // (1) 후기 위젯 위치 결정:
      //     1순위: "상세정보 펼쳐보기" 버튼 *직후* (사장님 의도)
      //     2순위: 펼쳐보기 버튼 못 찾으면 상세정보 미리보기 직후 (fallback)
      var expand = findExpandAnchor(detail);
      var widgetAnchor = expand || detail;
      var anchorLabel = expand ? '펼쳐보기 버튼 직후' : '상세정보 직후 (펼쳐보기 미발견)';

      if (widgetAnchor.nextElementSibling !== widget) {
        widgetAnchor.parentNode.insertBefore(widget, widgetAnchor.nextElementSibling);
        console.log('[MAMORU 리뷰] 후기 위젯 배치:', anchorLabel,
          expand ? '(matched: ' + (expand.className || expand.tagName) + ')' : '');
      }

      // (2) sticky 탭바 → 상세정보 *직전* (모바일에서만 보임, CSS 처리)
      if (tabs && detail.previousElementSibling !== tabs) {
        detail.parentNode.insertBefore(tabs, detail);
        console.log('[MAMORU 리뷰] 탭바 배치: 상세정보 직전');
      }

      return true;
    } catch(e) {
      console.warn('[MAMORU 리뷰] 레이아웃 배치 실패:', e.message);
      return false;
    }
  }

  // 아임웹은 페이지 동적 로딩 → 여러 시점에 시도 + viewport 변경 대응
  function scheduleMove() {
    if (root) root.classList.add('mm-prv-initial-hidden');

    var attempts = [50, 200, 500, 1000, 2000];
    var arranged = false;
    attempts.forEach(function(ms) {
      setTimeout(function() {
        if (!arranged) arranged = tryArrangeLayout();
        if (ms === attempts[attempts.length - 1] && root) {
          root.classList.remove('mm-prv-initial-hidden');
          root.classList.add('mm-prv--ready');
        }
      }, ms);
    });

    // viewport 변경(PC↔모바일 전환) 시 재배치 (visible 노드 갱신)
    var resizeTimer = null;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() { tryArrangeLayout(); }, 200);
    });
  }

  /* ── 탭 클릭 핸들러 + scroll spy (Phase 2-C) ── */
  function getTabTargets() {
    return {
      info: findDetailSection(),
      reviews: root,
      contact: document.getElementById('mm-contact-anchor')
    };
  }

  function setActiveTab(name) {
    var tabs = document.querySelectorAll('.mm-tab');
    tabs.forEach(function(t) {
      t.classList.toggle('active', t.dataset.target === name);
    });
  }

  function scrollToSection(name) {
    var targets = getTabTargets();
    var el = targets[name];
    if (!el) {
      console.log('[MAMORU 리뷰] 탭 대상 미발견:', name);
      return;
    }
    var stickyOffset = 56; // sticky 탭바 높이 보정
    var top = el.getBoundingClientRect().top + window.pageYOffset - stickyOffset;
    window.scrollTo({ top: top, behavior: 'smooth' });
    setActiveTab(name);
  }

  function initTabs() {
    var tabBar = document.getElementById('mmTabs');
    if (!tabBar) return;
    tabBar.addEventListener('click', function(e) {
      var btn = e.target.closest('.mm-tab');
      if (!btn) return;
      scrollToSection(btn.dataset.target);
    });

    // scroll spy: 현재 viewport에 보이는 영역에 따라 active 탭 갱신
    var spyTimer = null;
    window.addEventListener('scroll', function() {
      clearTimeout(spyTimer);
      spyTimer = setTimeout(updateActiveTabByScroll, 80);
    }, { passive: true });
  }

  function updateActiveTabByScroll() {
    // 모바일만 (PC는 탭바 자체 숨김)
    if (window.innerWidth >= 768) return;
    var targets = getTabTargets();
    var triggerY = 80; // sticky 탭바 아래 80px 지점 기준
    var active = 'info';
    ['info', 'reviews', 'contact'].forEach(function(name) {
      var el = targets[name];
      if (!el) return;
      var rect = el.getBoundingClientRect();
      if (rect.top <= triggerY) active = name;
    });
    setActiveTab(active);
  }

  /* ── 후기 0건 빈 상태 렌더 — 위젯 본체는 유지(탭바 작동 위해) ── */
  function renderZeroState() {
    // 후기 데이터가 없을 때: 요약/분포/갤러리/필터/그리드/더보기 모두 숨김
    var summary = document.getElementById('prvSummary');
    var dist = document.getElementById('prvDist');
    var galleryWrap = document.getElementById('prvGalleryWrap');
    var controls = document.querySelector('.mm-prv__controls');
    var grid = document.getElementById('prvGrid');
    var loadmore = document.getElementById('prvLoadmore');
    var zero = document.getElementById('prvZero');
    if (summary) summary.style.display = 'none';
    if (dist) dist.style.display = 'none';
    if (galleryWrap) galleryWrap.style.display = 'none';
    if (controls) controls.style.display = 'none';
    if (grid) grid.style.display = 'none';
    if (loadmore) loadmore.style.display = 'none';
    if (zero) zero.style.display = 'block';
  }

  /* ── 데이터 로드 ── */

    var demo = getDemoData();
    allReviews = demo.reviews;
    root.style.display = '';
    renderSummary(demo.stats);
    renderDist();
    renderGallery();
    applyFilterSort();
    render();
    initIframeComm();
    scheduleMove();   // DOM 배치 (상세정보 직후 + 탭바 상세정보 직전)
    initTabs();       // 탭 클릭 핸들러 + scroll spy (Phase 2-C)
    console.log('[MAMORU 리뷰 — 데모 모드] 더미 데이터 ' + demo.reviews.length + '건 표시');
  } else {
    fetch(API_URL + apiQuery)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var reviews = [];
        var stats = { count: 0, average: 0 };

        if (data && data.reviews) {
          reviews = Array.isArray(data.reviews) ? data.reviews : [];
          stats = data.stats || stats;
        } else if (Array.isArray(data)) {
          reviews = data;
        }

        allReviews = reviews;
        root.style.display = '';

        if (reviews.length === 0) {
          // 후기 0건 — 빈 상태 메시지만 + sticky 탭바 정상 작동 (정보/문의 점프)
          renderZeroState();
        } else {
          renderSummary(stats);
          renderDist();
          renderGallery();
          applyFilterSort();
          render();
        }

        initIframeComm();
        scheduleMove();   // DOM 배치 (Phase 2-C) — 후기 0건이어도 탭바 배치
        initTabs();       // 탭 핸들러 — 후기 0건이어도 [정보]/[문의] 점프 작동
      })
      .catch(function(err) {
        console.error('[MAMORU 리뷰] API 에러:', err);
        // 에러 시에도 위젯·탭바는 유지 (정보/문의는 작동)
        allReviews = [];
        root.style.display = '';
        renderZeroState();
        initIframeComm();
        scheduleMove();
        initTabs();
      });
  }
