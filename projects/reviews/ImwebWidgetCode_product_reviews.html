<style>
/* ══════════════════════════════════════════════════════════════
   MAMORU 제품별 후기 — Brand Guide v1.0 (Monochrome)
   아임웹 상품 페이지 코드위젯 삽입용
   사용법: iframe src에 ?group=R4 파라미터 추가
   ══════════════════════════════════════════════════════════════ */

/* ── 0. 변수 & 리셋 ── */
:root {
  --mm-bg-light: #FAF9F7;
  --mm-bg-card: #FFFFFF;
  --mm-void: #1A1A1A;
  --mm-shell: #F5F5F0;
  --mm-text-d: #1A1A1A;
  --mm-text-d2: #6B6B6B;
  --mm-text-d3: rgba(26,26,26,0.5);
  --mm-border-l: rgba(26,26,26,0.08);
  --mm-radius: 6px;
  --mm-radius-lg: 8px;
  --mm-max-w: 960px;
  --mm-ease-fast: 0.15s ease;
  --mm-ease: 0.25s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.mm-prv-page {
  font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--mm-bg-light);
  color: var(--mm-text-d);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: visible;
}

a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

/* ── 1. 요약 헤더 (별점 + 리뷰 수) ── */
.mm-prv-summary {
  text-align: center;
  padding: 40px 20px 28px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}
.mm-prv-summary__bar {
  display: inline-block;
  width: 28px;
  height: 3px;
  background: var(--mm-void);
  border-radius: 2px;
  margin-bottom: 16px;
}
.mm-prv-summary__title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--mm-text-d);
  margin-bottom: 12px;
}
.mm-prv-summary__stars {
  font-size: 28px;
  letter-spacing: 3px;
  color: var(--mm-void);
  margin-bottom: 6px;
}
.mm-prv-summary__meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14px;
  color: var(--mm-text-d2);
}
.mm-prv-summary__avg {
  font-size: 20px;
  font-weight: 800;
  color: var(--mm-void);
}
.mm-prv-summary__count {
  font-size: 14px;
  font-weight: 500;
  color: var(--mm-text-d3);
}

/* ── 2. 리뷰 그리드 ── */
.mm-prv-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: 0 20px;
  max-width: var(--mm-max-w);
  margin: 0 auto;
}

/* ── 3. 리뷰 카드 ── */
.mm-prv-card {
  background: var(--mm-bg-card);
  border: 1px solid var(--mm-border-l);
  border-radius: var(--mm-radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: box-shadow var(--mm-ease);
  cursor: pointer;
}
.mm-prv-card__img {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--mm-radius);
  object-fit: cover;
}
.mm-prv-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mm-prv-card__name {
  font-size: 15px;
  font-weight: 700;
  color: var(--mm-text-d);
}
.mm-prv-card__stars {
  display: flex;
  gap: 2px;
  color: var(--mm-void);
  font-size: 14px;
  letter-spacing: 1px;
}
.mm-prv-card__text {
  font-size: 15px;
  font-weight: 400;
  color: var(--mm-text-d);
  line-height: 1.7;
}
.mm-prv-card__date {
  font-size: 12px;
  font-weight: 400;
  color: var(--mm-text-d3);
  padding-top: 8px;
  border-top: 1px solid var(--mm-border-l);
  display: flex;
  gap: 12px;
}
/* 속성 태그 */
.mm-prv-card__tags, .mm-prv-modal__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.mm-prv-tag {
  font-size: 12px;
  font-weight: 500;
  color: var(--mm-text-d2);
  padding: 3px 10px;
  border: 1px solid var(--mm-border-l);
  border-radius: 8px;
  background: transparent;
}
.mm-prv-product-badge {
  font-size: 13px;
  color: var(--mm-text-d2);
  margin-bottom: 2px;
}

/* ── 모달 ── */
.mm-prv-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
}
.mm-prv-overlay--open { opacity: 1; visibility: visible; }
.mm-prv-modal {
  background: #fff; border-radius: 14px;
  max-width: 520px; width: 100%;
  max-height: 85vh; overflow-y: auto;
  padding: 28px 24px;
  position: relative;
}
.mm-prv-modal__close {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px; border: none; background: rgba(26,26,26,0.06);
  border-radius: 50%; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--mm-text-d2);
}
.mm-prv-modal__stars {
  color: var(--mm-void); font-size: 18px; letter-spacing: 2px; margin-bottom: 12px;
}
.mm-prv-modal__name {
  font-size: 17px; font-weight: 700; margin-bottom: 12px;
}
.mm-prv-modal__text {
  font-size: 15px; line-height: 1.8; color: var(--mm-text-d); margin-bottom: 16px;
  white-space: pre-wrap;
}
.mm-prv-modal__photos {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.mm-prv-modal__photo {
  width: 120px; height: 120px; border-radius: 8px; object-fit: cover; cursor: pointer;
  flex-shrink: 0;
}
@media (max-width: 767px) {
  .mm-prv-modal__photos {
    flex-wrap: nowrap;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  .mm-prv-modal__photos::-webkit-scrollbar { display: none; }
  .mm-prv-modal__photo {
    width: 75vw; height: auto; aspect-ratio: 4/3;
    scroll-snap-align: center;
  }
  .mm-prv-modal__photos--single {
    justify-content: center;
    overflow-x: hidden;
    scroll-snap-type: none;
  }
  .mm-prv-modal__photos--single .mm-prv-modal__photo {
    width: 100%; max-width: 320px;
  }
}
.mm-prv-modal__date {
  font-size: 12px; color: var(--mm-text-d3);
  display: flex; gap: 12px;
  padding-top: 12px; border-top: 1px solid var(--mm-border-l);
}

/* ── 더보기 버튼 ── */
.mm-prv-loadmore {
  display: block;
  width: fit-content;
  margin: 32px auto 48px;
  padding: 12px 32px;
  border: 1px solid var(--mm-border-l);
  border-radius: 999px;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--mm-text-d2);
  cursor: pointer;
  transition: all var(--mm-ease-fast);
}
.mm-prv-loadmore:hover {
  border-color: var(--mm-void);
  color: var(--mm-void);
}
.mm-prv-loadmore:active { transform: scale(0.97); }

/* 비어있을 때 / 로딩 */
.mm-prv-empty, .mm-prv-loading {
  text-align: center;
  padding: 48px 20px;
  color: var(--mm-text-d3);
  font-size: 15px;
}

/* ── 반응형 ── */
@media (min-width: 768px) {
  .mm-prv-summary { padding: 48px 32px 32px; }
  .mm-prv-summary__title { font-size: 26px; }
  .mm-prv-summary__stars { font-size: 32px; }
  .mm-prv-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 0 32px;
  }
  .mm-prv-card { padding: 24px; }
}

@media (min-width: 1024px) {
  .mm-prv-summary { padding: 56px 48px 36px; }
  .mm-prv-summary__title { font-size: 28px; }
  .mm-prv-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    padding: 0 48px;
  }
  .mm-prv-card__text { font-size: 16px; line-height: 1.7; }
}

/* PC hover */
@media (hover: hover) {
  .mm-prv-card:hover {
    box-shadow: 0 4px 16px rgba(26,26,26,0.06);
  }
}

/* ── 라이트박스 (사진 확대) ── */
.mm-lb {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(0,0,0,0.92);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
  touch-action: pan-y;
}
.mm-lb--open { opacity: 1; visibility: visible; }
.mm-lb__img {
  max-width: 90vw; max-height: 85vh;
  object-fit: contain; border-radius: 4px;
  user-select: none; -webkit-user-drag: none;
}
.mm-lb__close {
  position: absolute; top: 16px; right: 16px;
  width: 40px; height: 40px; border: none;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
  border-radius: 50%; font-size: 20px; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.mm-lb__close:hover { background: rgba(255,255,255,0.3); }
.mm-lb__arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border: none;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
  border-radius: 50%; font-size: 20px; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.mm-lb__arrow:hover { background: rgba(255,255,255,0.3); }
.mm-lb__arrow--prev { left: 16px; }
.mm-lb__arrow--next { right: 16px; }
.mm-lb__counter {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 13px; color: rgba(255,255,255,0.7);
}
.mm-lb__arrow.hidden, .mm-lb__counter.hidden { display: none; }
@media (max-width: 767px) {
  .mm-lb__arrow { display: none; }
}
</style>

<div class="mm-prv-page">

<!-- 요약 헤더 -->
<header class="mm-prv-summary" id="prvSummary" style="display:none">
  <span class="mm-prv-summary__bar"></span>
  <h2 class="mm-prv-summary__title">고객 후기</h2>
  <div class="mm-prv-summary__stars" id="prvStars"></div>
  <div class="mm-prv-summary__meta">
    <span class="mm-prv-summary__avg" id="prvAvg"></span>
    <span class="mm-prv-summary__count" id="prvCount"></span>
  </div>
</header>

<!-- 리뷰 그리드 -->
<div class="mm-prv-grid" id="prvGrid">
  <div class="mm-prv-loading">후기를 불러오는 중...</div>
</div>

<!-- 더보기 -->
<button class="mm-prv-loadmore" id="prvLoadmore" style="display:none">후기 더보기</button>

<!-- 상세 모달 -->
<div class="mm-prv-overlay" id="prvOverlay">
  <div class="mm-prv-modal" id="prvModal">
    <button class="mm-prv-modal__close" id="prvModalClose">✕</button>
    <div id="prvModalBody"></div>
  </div>
</div>

<!-- 사진 라이트박스 -->
<div class="mm-lb" id="prvLightbox">
  <button class="mm-lb__close" id="lbClose">✕</button>
  <button class="mm-lb__arrow mm-lb__arrow--prev" id="lbPrev">‹</button>
  <img class="mm-lb__img" id="lbImg" src="" alt="사진 확대">
  <button class="mm-lb__arrow mm-lb__arrow--next" id="lbNext">›</button>
  <div class="mm-lb__counter" id="lbCounter"></div>
</div>

</div>

<script>
(function(){
  'use strict';

  var API_URL = 'https://app-eta-sandy-75.vercel.app/api/reviews/public';
  var PER_PAGE = 6;
  var currentPage = 1;
  var allReviews = [];

  /* URL에서 group 파라미터 추출 */
  var urlParams = new URLSearchParams(window.location.search);
  var group = urlParams.get('group');

  if (!group) {
    document.getElementById('prvGrid').innerHTML =
      '<div class="mm-prv-empty">리뷰를 표시할 제품군이 설정되지 않았습니다.</div>';
    return;
  }

  function maskName(name) {
    if (!name) return '';
    if (name.length <= 1) return name;
    if (name.length === 2) return name[0] + '*';
    return name[0] + '*'.repeat(name.length - 2) + name[name.length - 1];
  }

  /* 속성 태그 key→한글 */
  var TAG_LABELS = {
    comfortable:'강요없이 편안해요', detailed_guide:'설명이 자세해요', professional:'전문적이에요',
    personalized:'맞춤 안내', worth_time:'시간이 아깝지 않았어요',
    reasonable_price:'합리적이에요', fair_price:'적당해요',
    like_new:'새 가위처럼', better_cut:'커트감이 달라요', above_expect:'기대 이상',
    precise_edge:'날 조절 정확', thorough_info:'안내 꼼꼼', fast_service:'진행 빠름', good_value:'가격 대비 만족',
    good_quality:'품질이 좋아요', fast_delivery:'배송이 빨라요', neat_packaging:'포장이 꼼꼼해요',
    would_recommend:'추천하고 싶어요'
  };

  function renderTagChips(r, cls) {
    var tags = r.meta && r.meta.tags;
    if (!tags || !tags.length) return '';
    return '<div class="' + cls + '">' +
      tags.map(function(t) { return '<span class="mm-prv-tag">' + (TAG_LABELS[t] || t) + '</span>'; }).join('') +
    '</div>';
  }

  function fmtDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  function renderStars(n) {
    var s = '';
    for (var i = 0; i < 5; i++) s += (i < n) ? '★' : '☆';
    return s;
  }

  function renderSummaryStars(avg) {
    var s = '';
    for (var i = 0; i < 5; i++) {
      s += (i < Math.round(avg)) ? '★' : '☆';
    }
    return s;
  }

  function renderCard(r, idx) {
    var imgHtml = '';
    if (r.photo_urls && r.photo_urls.length > 0) {
      imgHtml = '<img class="mm-prv-card__img" src="' + r.photo_urls[0] + '" alt="후기 이미지" loading="lazy">';
    } else if (r.product_image_url) {
      imgHtml = '<img class="mm-prv-card__img" src="' + r.product_image_url + '" alt="제품 이미지" loading="lazy">';
    }
    var productHtml = r.product ? '<div class="mm-prv-product-badge">' + r.product + '</div>' : '';
    var preview = r.content.length > 80 ? r.content.substring(0, 80) + '…' : r.content;
    var dateHtml = '<div class="mm-prv-card__date"><span>' + fmtDate(r.created_at) + '</span></div>';

    return '<article class="mm-prv-card" data-idx="' + idx + '">' +
      imgHtml +
      '<div class="mm-prv-card__header">' +
        '<span class="mm-prv-card__name">' + maskName(r.name) + '</span>' +
      '</div>' +
      productHtml +
      '<div class="mm-prv-card__stars">' + renderStars(r.stars) + '</div>' +
      renderTagChips(r, 'mm-prv-card__tags') +
      '<div class="mm-prv-card__text">' + preview + '</div>' +
      dateHtml +
    '</article>';
  }

  function render() {
    var grid = document.getElementById('prvGrid');
    var btn = document.getElementById('prvLoadmore');
    var visible = allReviews.slice(0, currentPage * PER_PAGE);

    grid.innerHTML = visible.length
      ? visible.map(function(r, i) { return renderCard(r, i); }).join('')
      : '<div class="mm-prv-empty">아직 등록된 후기가 없습니다.</div>';

    btn.style.display = (visible.length < allReviews.length) ? 'block' : 'none';
  }

  function renderSummary(stats) {
    var el = document.getElementById('prvSummary');
    if (!stats || stats.count === 0) {
      el.style.display = 'none';
      return;
    }
    el.style.display = '';
    document.getElementById('prvStars').textContent = renderSummaryStars(stats.average);
    document.getElementById('prvAvg').textContent = stats.average.toFixed(1);
    document.getElementById('prvCount').textContent = '후기 ' + stats.count + '건';
  }

  /* ── 상세 모달 ── */
  var overlay = document.getElementById('prvOverlay');
  var modalBody = document.getElementById('prvModalBody');
  var currentModalPhotos = [];

  function openModal(r) {
    currentModalPhotos = (r.photo_urls && r.photo_urls.length > 0) ? r.photo_urls : [];
    var photosHtml = '';
    if (currentModalPhotos.length > 0) {
      var singleCls = currentModalPhotos.length === 1 ? ' mm-prv-modal__photos--single' : '';
      photosHtml = '<div class="mm-prv-modal__photos' + singleCls + '">' +
        currentModalPhotos.map(function(url, i) {
          return '<img class="mm-prv-modal__photo" src="' + url + '" alt="후기 사진" data-lb-idx="' + i + '">';
        }).join('') + '</div>';
    }
    var productHtml = r.product ? '<div style="font-size:14px;color:var(--mm-text-d2);margin-bottom:12px">' + r.product + '</div>' : '';
    modalBody.innerHTML =
      '<div class="mm-prv-modal__stars">' + renderStars(r.stars) + '</div>' +
      '<div class="mm-prv-modal__name">' + maskName(r.name) + '</div>' +
      renderTagChips(r, 'mm-prv-modal__tags') +
      productHtml +
      '<div class="mm-prv-modal__text">' + r.content + '</div>' +
      photosHtml +
      '<div class="mm-prv-modal__date"><span>' + fmtDate(r.created_at) + '</span></div>';
    overlay.classList.add('mm-prv-overlay--open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    overlay.classList.remove('mm-prv-overlay--open');
    document.body.style.overflow = '';
  }

  document.getElementById('prvModalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeModal();
  });

  document.getElementById('prvGrid').addEventListener('click', function(e) {
    var card = e.target.closest('.mm-prv-card');
    if (!card) return;
    var idx = parseInt(card.dataset.idx);
    var visible = allReviews.slice(0, currentPage * PER_PAGE);
    if (visible[idx]) openModal(visible[idx]);
  });

  /* ── 사진 라이트박스 ── */
  var lb = document.getElementById('prvLightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCounter = document.getElementById('lbCounter');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var lbIdx = 0;

  function openLightbox(idx) {
    lbIdx = idx;
    updateLightbox();
    lb.classList.add('mm-lb--open');
  }

  function closeLightbox() {
    lb.classList.remove('mm-lb--open');
  }

  function updateLightbox() {
    lbImg.src = currentModalPhotos[lbIdx];
    var single = currentModalPhotos.length <= 1;
    lbPrev.classList.toggle('hidden', single);
    lbNext.classList.toggle('hidden', single);
    lbCounter.classList.toggle('hidden', single);
    if (!single) {
      lbCounter.textContent = (lbIdx + 1) + ' / ' + currentModalPhotos.length;
    }
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lb.addEventListener('click', function(e) {
    if (e.target === lb) closeLightbox();
  });
  lbPrev.addEventListener('click', function() {
    lbIdx = (lbIdx - 1 + currentModalPhotos.length) % currentModalPhotos.length;
    updateLightbox();
  });
  lbNext.addEventListener('click', function() {
    lbIdx = (lbIdx + 1) % currentModalPhotos.length;
    updateLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (lb.classList.contains('mm-lb--open')) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lbPrev.click();
      if (e.key === 'ArrowRight') lbNext.click();
    } else if (overlay.classList.contains('mm-prv-overlay--open')) {
      if (e.key === 'Escape') closeModal();
    }
  });

  var touchStartX = 0;
  lb.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx > 0) lbPrev.click(); else lbNext.click();
    }
  });

  modalBody.addEventListener('click', function(e) {
    var img = e.target.closest('[data-lb-idx]');
    if (img) openLightbox(parseInt(img.dataset.lbIdx));
  });

  /* 더보기 */
  document.getElementById('prvLoadmore').addEventListener('click', function() {
    currentPage++;
    render();
  });

  /* ── 데이터 로드 ── */
  function loadReviews() {
    fetch(API_URL + '?group=' + encodeURIComponent(group))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.reviews) {
          allReviews = Array.isArray(data.reviews) ? data.reviews : [];
          renderSummary(data.stats);
        } else {
          allReviews = Array.isArray(data) ? data : [];
        }
        render();
      })
      .catch(function(err) {
        console.error('리뷰 API 에러:', err);
        allReviews = [];
        render();
      });
  }

  /* 아임웹 iframe 높이 자동 전달 */
  function initIframeComm() {
    function sendHeight() {
      var h = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: 'MAMORU_IFRAME_SIZE', height: h }, '*');
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(sendHeight).observe(document.body);
    } else {
      setInterval(sendHeight, 500);
    }
    sendHeight();
  }

  /* 초기화 */
  loadReviews();
  initIframeComm();
})();
</script>
