<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"><!-- 내부 도구: 검색 비노출 -->
<title>MAMORU 카탈로그 디자인 작업대</title>
<style>
  :root{ --void:#1A1A1A; --mute:#8A8580; --line:#EDEBE8; --cream:#FAF9F7; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{ font-family:'Plus Jakarta Sans','Noto Sans KR',sans-serif; background:#E8E6E2; color:var(--void); display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  .ws-top{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; background:var(--void); color:var(--cream); padding:0 20px; height:52px; }
  .ws-top .logo{ font-family:'Outfit',sans-serif; font-weight:900; font-size:16px; letter-spacing:.04em; }
  .ws-top .sub{ font-size:12px; color:rgba(245,245,243,.55); margin-left:10px; }
  .ws-top .hint{ font-size:12px; color:rgba(245,245,243,.6); }
  .ws-top .openlink{ font-size:12px; font-weight:700; color:var(--void); background:var(--cream); padding:7px 14px; border-radius:8px; text-decoration:none; }
  .ws-modetoggle{ display:flex; background:rgba(245,245,243,.12); border-radius:8px; padding:3px; }
  .ws-mbtn{ border:0; background:transparent; color:rgba(245,245,243,.6); font-size:12px; font-weight:700; padding:6px 12px; border-radius:6px; cursor:pointer; }
  .ws-mbtn.on{ background:var(--cream); color:var(--void); }

  /* PC + 모바일 동시 미리보기 (PC 가변폭, 모바일 390px 고정 → vw 가 실제 폰 폭) */
  #frameWrap{ flex:1 1 auto; min-height:0; display:flex; background:#E8E6E2; }
  .pane{ display:flex; flex-direction:column; min-width:0; }
  .pane--pc{ flex:1 1 0; }
  .pane--mo{ flex:0 0 390px; border-left:1px solid #d8d5cf; }
  .pane__label{ flex:0 0 auto; font-family:'Outfit',sans-serif; font-size:11px; font-weight:800; letter-spacing:.12em; color:var(--mute); padding:7px 14px; background:#fff; border-bottom:1px solid var(--line); }
  .pane iframe{ flex:1 1 auto; width:100%; border:0; background:#E8E6E2; }
  @media (max-width:760px){ .pane--mo{ display:none; } } /* 작업대를 좁은 창에서 열면 PC 패널만 */
</style>
</head>
<body>

<header class="ws-top">
  <div><span class="logo">MAMORU</span><span class="sub">카탈로그 디자인 작업대</span></div>
  <div style="display:flex;align-items:center;gap:14px;">
    <div class="ws-modetoggle">
      <button id="wsNeutral" class="ws-mbtn on" type="button">정보 보기</button>
      <button id="wsSelected" class="ws-mbtn" type="button">선택 미리보기</button>
    </div>
    <a class="openlink" href="./studio.html" target="_blank" rel="noopener">🎛 스튜디오 ↗</a>
    <a class="openlink" href="./index.html" target="_blank" rel="noopener">🏗 빌더 ↗</a>
    <a class="openlink" href="./editor.html" target="_blank" rel="noopener">✏️ 문구 편집기 ↗</a>
  </div>
</header>

<div id="frameWrap">
  <div class="pane pane--pc"><div class="pane__label">PC</div><iframe id="wsPC_frame" title="PC 미리보기"></iframe></div>
  <div class="pane pane--mo"><div class="pane__label">모바일 · 390px</div><iframe id="wsMo_frame" title="모바일 미리보기"></iframe></div>
</div>

<script src="./catalog.js"></script>
<script src="./template.js"></script>
<script src="./workspace.js"></script>
</body>
</html>
