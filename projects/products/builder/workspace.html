<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"><!-- 내부 도구: 검색 비노출 -->
<title>MAMORU 카탈로그 디자인 작업대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css" rel="stylesheet">
<style>
  :root{ --void:#1A1A1A; --mute:#8A8580; --line:#EDEBE8; --shell:#F5F3F0; --cream:#FAF9F7; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Plus Jakarta Sans','Noto Sans KR',sans-serif; background:#E8E6E2; color:var(--void); -webkit-font-smoothing:antialiased; }
  .ws-top{ position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; background:var(--void); color:var(--cream); padding:0 20px; height:52px; }
  .ws-top .logo{ font-family:'Outfit',sans-serif; font-weight:900; font-size:16px; letter-spacing:.04em; }
  .ws-top .sub{ font-size:12px; color:rgba(245,245,243,.55); margin-left:10px; }
  .ws-toggle{ display:flex; background:rgba(245,245,243,.1); border-radius:8px; padding:3px; }
  .ws-vbtn{ border:0; background:transparent; color:rgba(245,245,243,.6); font-size:12px; font-weight:700; padding:6px 14px; border-radius:6px; cursor:pointer; }
  .ws-vbtn.on{ background:var(--cream); color:var(--void); }

  .ws-wrap{ max-width:980px; margin:0 auto; padding:28px 16px 120px; }
  .ws-wrap.mobile{ max-width:430px; }
  .ws-h2{ font-family:'Outfit',sans-serif; font-size:13px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--void); margin:36px 0 14px; padding-bottom:8px; border-bottom:2px solid var(--void); }
  .ws-h2:first-child{ margin-top:8px; }
  .ws-note{ font-size:12px; color:#6b6862; line-height:1.7; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:8px; }
  .ws-note b{ color:var(--void); }

  .ws-card{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:18px; }
  .ws-card__bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); background:#fbfaf9; }
  .ws-card__id{ font-family:'Outfit',sans-serif; font-size:12px; font-weight:800; color:var(--void); }
  .ws-card__label{ font-size:12px; color:var(--mute); }
  .ws-card__applies{ margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.05em; color:#fff; background:#B8B4AF; border-radius:999px; padding:3px 9px; }
  .ws-card__file{ font-size:10px; color:#a8a49e; font-family:'Outfit',sans-serif; }
  /* 카드가 실제 페이지처럼 보이도록 cream 배경 위 렌더 */
  .ws-stage{ background:var(--cream); padding:clamp(18px,3vw,28px); }
  .ws-loading{ text-align:center; padding:60px 20px; color:var(--mute); }

  /* 카피 풀 */
  .ws-copy{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .ws-copy__bar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .ws-copy__opt{ font-size:13px; color:#2D2D2D; line-height:1.6; padding:7px 0; border-top:1px dashed var(--line); white-space:pre-line; }
  .ws-copy__opt:first-of-type{ border-top:0; }
  .ws-copy__id{ font-family:'Outfit',sans-serif; font-size:10px; color:#a8a49e; }
</style>
</head>
<body>

<header class="ws-top">
  <div><span class="logo">MAMORU</span><span class="sub">카탈로그 디자인 작업대</span></div>
  <div class="ws-toggle">
    <button id="wsPC" class="ws-vbtn on" type="button">PC</button>
    <button id="wsMobile" class="ws-vbtn" type="button">모바일</button>
  </div>
</header>

<main id="ws" class="ws-wrap">
  <div class="ws-loading">카탈로그 로딩 중…</div>
</main>

<script src="./catalog.js"></script>
<script src="./template.js"></script>
<script src="./workspace.js"></script>
</body>
</html>
