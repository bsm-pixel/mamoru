  사용법:
  1. 아임웹 admin → 상품 등록 → "상품 상세 설명" → </> 코드보기
  2. 아래 <section> ... </section> 코드 전체를 통째로 복사 → 붙여넣기 → 저장
  3. PC + 모바일 두 화면에서 확인:
     - ✅ 박스 정상 표시 + 스타일 적용 + 반응형 → 본격 4섹션 마스터로 진행
     - ⚠️ 표시되지만 스타일 깨짐 → <style> 차단된 것 → inline style 버전으로 전환
     - ❌ 아예 표시 안 됨 → 다른 fallback

  주의:
  - <html>, <head>, <body> 태그는 빼고 <section>부터 시작 (아임웹은 본문 마크업만 받음)
  - 모든 클래스명에 'mm-detail-' prefix → 아임웹 다른 영역과 CSS 충돌 방지
-->

.mm-detail-label {

  background: #1A1A1A;
  color: #FAF9F7;

.mm-detail-title {

}

.mm-detail-subtitle {

}

.mm-detail-checklist {

}

.mm-detail-check-title {

  letter-spacing: 0.05em;
  margin-bottom: 16px;
  text-transform: uppercase;
}

.mm-detail-check-item {
  font-size: 15px;
  color: #2D2D2D;
  padding: 8px 0;
  border-bottom: 1px solid #D4D0CB;

.mm-detail-check-item:last-child { border-bottom: 0; }
.mm-detail-check-item::before {

  color: #1A1A1A;
  font-weight: 700;
  flex-shrink: 0;
}

.mm-detail-note {
  font-size: 12px;
  color: #8A8580;
  letter-spacing: 0.04em;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
}

/* ── 모바일 (Brand Guide B-05) ── */
@media (max-width: 767px) {
  .mm-detail-frame {
    margin: 24px auto;
    padding: 32px 20px;
    border-radius: 12px;
  }
  .mm-detail-title { font-size: 22px; }
  .mm-detail-subtitle { font-size: 13px; margin-bottom: 32px; }
  .mm-detail-checklist { padding: 20px 18px; }
  .mm-detail-check-item { font-size: 13px; padding: 7px 0; }
}
</style>

<section class="mm-detail-frame">
