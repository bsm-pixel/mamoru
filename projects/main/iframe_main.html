<!-- MAMORU 메인 페이지 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯에 전체 복사하세요 ★ -->
<!-- GitHub Pages 배포 - postMessage 동적 높이 조절 -->

<style>
#mamoruMainWrap {
  position: relative;
  width: 100%;
}
#mamoruMainFrame {
  width: 100%;
  border: none;
  display: block;
}
</style>

<div id="mamoruMainWrap">
  <iframe
    id="mamoruMainFrame"
    src="https://page.mamoru.kr/projects/main/page_main.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruMainFrame');
  // 초기 fallback — 첫 송신 도착 즉시 정확값으로 교체됨
  var fallbackH = window.innerWidth <= 768 ? 3600 : 4200;
  iframe.style.height = fallbackH + 'px';
  var currentHeight = fallbackH;
  var hasReceivedMessage = false;

  window.addEventListener('message', function(e) {
    // ① source 체크
    if (e.source !== iframe.contentWindow) return;
    // ② origin 체크
    if (e.origin !== 'https://page.mamoru.kr') return;

    // ③ id 체크
    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && e.data.id === 'main' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      if (newHeight <= 0) return;

      if (!hasReceivedMessage) {
        // 첫 메시지 무조건 적용 (fallback 빈 공간 차단, 2026-05-18 fix)
        hasReceivedMessage = true;
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      } else if (newHeight > currentHeight) {
        // 이후 monotonic
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });
})();
</script>
