<!-- MAMORU 메인 페이지 하단 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯 B에 전체 복사하세요 ★ -->
<!-- 도구·소모품 → 서비스 쇼케이스 → 고객 후기 → 브랜드 한마디 -->

<style>
#mamoruMainBtmWrap {
  position: relative;
  width: 100%;
}
#mamoruMainBtmFrame {
  width: 100%;
  border: none;
  display: block;
}
</style>

<div id="mamoruMainBtmWrap">
  <iframe
    id="mamoruMainBtmFrame"
    src="https://page.mamoru.kr/projects/main/page_main_btm.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruMainBtmFrame');
  // 초기 높이 (postMessage 수신 전 fallback) — 하단: 도구+서비스+후기+슬로건
  var fallbackH = window.innerWidth <= 768 ? 2800 : 3000;
  iframe.style.height = fallbackH + 'px';
  var currentHeight = fallbackH;

  window.addEventListener('message', function(e) {
    // ① 우리 iframe에서 온 메시지만 처리 (다른 iframe 메시지 차단, 2026-05-18 fix)
    if (e.source !== iframe.contentWindow) return;
    // ② origin 체크
    if (e.origin !== 'https://page.mamoru.kr') return;

    // ③ id 체크 (방어 심층화): source + id 'btm' 이중 가드
    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && e.data.id === 'btm' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      // monotonic increasing — 한 번 도달한 큰 값에서 줄어들지 않음
      if (newHeight > currentHeight) {
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });
})();
</script>
