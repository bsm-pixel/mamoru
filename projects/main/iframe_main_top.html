<!-- MAMORU 메인 페이지 상단 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯 A에 전체 복사하세요 ★ -->
<!-- Hero → Trust Numbers → Quick Nav → 클리어런스 배너 → "대표 라인업" 헤더+칩 -->

<style>
#mamoruMainTopWrap {
  position: relative;
  width: 100%;
}
#mamoruMainTopFrame {
  width: 100%;
  border: none;
  display: block;
}
/* 짤림은 모바일에서만 발생 → 모바일에만 바닥값. PC는 원래 정상이라 손대지 않음(빈공간 위험 0) */
@media (max-width: 767px) {
  #mamoruMainTopFrame { min-height: 1200px; }   /* ⭐ 모바일 바닥값 — 하단 빈공간 보이면 이 숫자만 줄이세요 */
}
</style>

<div id="mamoruMainTopWrap">
  <iframe
    id="mamoruMainTopFrame"
    src="https://page.mamoru.kr/projects/main/page_main_top.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruMainTopFrame');
  iframe.style.height = '0px';
  /* ⭐ 모바일 짤림 방지 — JS로 직접 min-height 바닥값(아임웹이 <style>/@media를 무시/제거해도 안전).
     스크립트가 늦게 돌아도 iframe이 이 높이 밑으론 안 줄어 trust 항상 노출. PC(768px↑)는 미적용 */
  function applyFloor() {
    try {
      var isMobile = !window.matchMedia || window.matchMedia('(max-width: 767px)').matches;
      iframe.style.minHeight = isMobile ? '1200px' : '0px';
    } catch (_) { iframe.style.minHeight = '1200px'; }
  }
  applyFloor();
  window.addEventListener('resize', applyFloor);
  var currentHeight = 0;

  window.addEventListener('message', function(e) {
    if (e.source !== iframe.contentWindow) return;             // source 가드
    if (e.origin !== 'https://page.mamoru.kr') return;          // origin 가드

    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && e.data.id === 'top' && typeof e.data.height === 'number') {
      var h = Math.ceil(e.data.height);
      if (h > currentHeight) { currentHeight = h; iframe.style.height = h + 'px'; }  // monotonic
    }
    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });

  // iframe load 후 즉시 정확한 height 요청 (init 추정값 빈 공간 fix)
  function requestHeight() {
    try {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'REQUEST_HEIGHT' }, '*');
      }
    } catch (_) {}
  }

  iframe.addEventListener('load', function() {
    [50, 200, 500, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
  });

  if (document.readyState === 'complete') {
    [100, 400, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
  } else {
    window.addEventListener('load', function() {
      [100, 400, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
    });
  }

  // BFCache / 카카오 인앱 forward navigation 복귀 시
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) requestHeight();
  });
})();
</script>
