<!-- MAMORU 메인 페이지 상단 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯 A에 전체 복사하세요 ★ -->
<!-- Hero → Trust Numbers → Quick Nav → 클리어런스 배너 → "대표 라인업" 헤더+칩 -->

<style>
#mamoruMainTopWrap {
  position: relative;
  width: 100%;
}
#mamoruMainTopFrame {
  width: 100%;
  border: none;
  display: block;
}
</style>

<div id="mamoruMainTopWrap">
  <iframe
    id="mamoruMainTopFrame"
    src="https://bsm-pixel.github.io/mamoru/projects/main/page_main_top.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruMainTopFrame');
  var currentHeight = 0;

  window.addEventListener('message', function(e) {
    if (e.origin !== 'https://bsm-pixel.github.io') return;

    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && e.data.id === 'top' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      if (newHeight !== currentHeight && newHeight > 0) {
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });

  // 초기 높이: 보수적 추정값 (다른 wrapper와 동일 패턴) → 부모 페이지 레이아웃 안정 후
  // 정확한 높이가 postMessage로 도착하면 자동 조정.
  // 0으로 시작하면 카카오 인앱에서 첫 메시지 도착 전 부모 레이아웃이 작은 iframe 기준으로 잡혀
  // 그 후 갑자기 늘어날 때 사용자 스크롤 위치가 어긋나며 Hero 위쪽이 잘려 보이는 사고 발생.
  iframe.style.height = (window.innerWidth <= 768 ? 2400 : 2800) + 'px';
})();
</script>
