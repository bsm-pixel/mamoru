<!-- MAMORU 메인 페이지 상단 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯 A에 전체 복사하세요 ★ -->
<!-- Hero → Trust Numbers → Quick Nav → 클리어런스 배너 → "대표 라인업" 헤더+칩 -->

<style>
#mamoruMainTopWrap {
  position: relative;
  width: 100%;
}
#mamoruMainTopFrame {
  width: 100%;
  border: none;
  display: block;
}
</style>

<div id="mamoruMainTopWrap">
  <iframe
    id="mamoruMainTopFrame"
    src="https://bsm-pixel.github.io/mamoru/projects/main/page_main_top.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruMainTopFrame');
  var currentHeight = 0;

  window.addEventListener('message', function(e) {
    // ① 우리 iframe에서 온 메시지만 처리 (다른 iframe 메시지 차단)
    if (e.source !== iframe.contentWindow) return;
    // ② origin 체크
    if (e.origin !== 'https://bsm-pixel.github.io') return;

    // height 메시지 — id 체크 불필요 (e.source로 이미 우리 iframe임 확정)
    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      if (newHeight !== currentHeight && newHeight > 0) {
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    // 페이지 이동 위임
    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });

  // 초기 높이: 보수적 추정값 (잘림 방지) → postMessage로 정확값 도착 시 자동 조정
  iframe.style.height = (window.innerWidth <= 768 ? 2400 : 2800) + 'px';

  // iframe load 후 즉시 정확한 height 요청 (init 추정값 빈 공간 fix)
  function requestHeight() {
    try {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'REQUEST_HEIGHT' }, '*');
      }
    } catch (_) {}
  }

  iframe.addEventListener('load', function() {
    [50, 200, 500, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
  });

  if (document.readyState === 'complete') {
    [100, 400, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
  } else {
    window.addEventListener('load', function() {
      [100, 400, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
    });
  }

  // BFCache / 카카오 인앱 forward navigation 복귀 시
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) requestHeight();
  });
})();
</script>
