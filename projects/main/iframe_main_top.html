<!-- MAMORU 메인 페이지 상단 - 아임웹 코드위젯용 -->
<!-- ★ 이 코드를 아임웹 코드위젯 A에 전체 복사하세요 ★ -->
<!-- Hero → Trust Numbers → Quick Nav → 클리어런스 배너 → "대표 라인업" 헤더+칩 -->

<style>
#mamoruMainTopWrap {
  position: relative;
  width: 100%;
}
#mamoruMainTopFrame {
  width: 100%;
  border: none;
  display: block;
}
</style>

<div id="mamoruMainTopWrap">
  <iframe
    id="mamoruMainTopFrame"
    src="https://page.mamoru.kr/projects/main/page_main_top.html"
    scrolling="no"
    frameborder="0"
    allowtransparency="true">
  </iframe>
</div>

<script>
(function(){
  var iframe = document.getElementById('mamoruMainTopFrame');
  var currentHeight = 0;

  window.addEventListener('message', function(e) {
    // ① 우리 iframe에서 온 메시지만 처리 (다른 iframe 메시지 차단)
    if (e.source !== iframe.contentWindow) return;
    // ② origin 체크
    if (e.origin !== 'https://page.mamoru.kr') return;

    // ③ id 체크 (방어 심층화 — 2026-05-18 fix): source 체크 + id 'top' 이중 가드
    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && e.data.id === 'top' && typeof e.data.height === 'number') {
      var newHeight = Math.ceil(e.data.height);
      // monotonic increasing — 한 번 도달한 큰 값에서 줄어들지 않음 (page 쪽도 monotonic, 이중 안전)
      if (newHeight > currentHeight) {
        currentHeight = newHeight;
        iframe.style.height = newHeight + 'px';
      }
    }

    // 페이지 이동 위임
    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) {
      window.location.href = e.data.url;
    }
  });

  // 초기 높이 — Hero+Trust+QuickNav+Videos+배너 최소 보장값 (postMessage 도착 전 콘텐츠 잘림 차단, 2026-05-18 fix)
  // 모바일 2400 / PC 3400 — 실제 측정치 도달 시 늘어남 (monotonic increasing 으로 줄어들지 않음)
  var fallbackH = window.innerWidth <= 768 ? 2400 : 3400;
  iframe.style.height = fallbackH + 'px';
  currentHeight = fallbackH;

  // iframe load 후 즉시 정확한 height 요청 (init 추정값 빈 공간 fix)
  function requestHeight() {
    try {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'REQUEST_HEIGHT' }, '*');
      }
    } catch (_) {}
  }

  iframe.addEventListener('load', function() {
    [50, 200, 500, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
  });

  if (document.readyState === 'complete') {
    [100, 400, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
  } else {
    window.addEventListener('load', function() {
      [100, 400, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
    });
  }

  // BFCache / 카카오 인앱 forward navigation 복귀 시
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) requestHeight();
  });
})();
</script>
