<!-- MAMORU 이름표: 평생쓰는 라인업 — 아임웹 코드위젯용 -->
<style>
#mamoruLabelLineupWrap { position: relative; width: 100%; }
#mamoruLabelLineupFrame { width: 100%; border: none; display: block; }
</style>
<div id="mamoruLabelLineupWrap">
  <iframe id="mamoruLabelLineupFrame"
    src="https://page.mamoru.kr/projects/main/page_label_lineup.html"
    scrolling="no" frameborder="0" allowtransparency="true"></iframe>
</div>
<script>
(function(){
  var iframe = document.getElementById('mamoruLabelLineupFrame');
  iframe.style.height = '0px';
  var currentHeight = 0;
  window.addEventListener('message', function(e) {
    if (e.source !== iframe.contentWindow) return;
    if (e.origin !== 'https://page.mamoru.kr') return;
    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && e.data.id === 'label-lineup' && typeof e.data.height === 'number') {
      var h = Math.ceil(e.data.height);
      if (h > currentHeight) { currentHeight = h; iframe.style.height = h + 'px'; }
    }
    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) { window.location.href = e.data.url; }
  });

  // iframe load 후 즉시 정확한 height 요청 (정적 페이지 0px 잠금 fix)
  function requestHeight() {
    try {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'REQUEST_HEIGHT' }, '*');
      }
    } catch (_) {}
  }

  iframe.addEventListener('load', function() {
    [50, 200, 500, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
  });

  if (document.readyState === 'complete') {
    [100, 400, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
  } else {
    window.addEventListener('load', function() {
      [100, 400, 1000].forEach(function(ms) { setTimeout(requestHeight, ms); });
    });
  }

  // BFCache / 카카오 인앱 forward navigation 복귀 시
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) requestHeight();
  });
})();
</script>
