<!-- MAMORU 이름표: 평생쓰는 라인업 — 아임웹 코드위젯용 -->
<style>
#mamoruLabelLineupWrap { position: relative; width: 100%; }
#mamoruLabelLineupFrame { width: 100%; border: none; display: block; }
</style>
<div id="mamoruLabelLineupWrap">
  <iframe id="mamoruLabelLineupFrame"
    src="https://page.mamoru.kr/projects/main/page_label_lineup.html"
    scrolling="no" frameborder="0" allowtransparency="true"></iframe>
</div>
<script>
(function(){
  var iframe = document.getElementById('mamoruLabelLineupFrame');
  // 초기 fallback — 첫 송신 도착 즉시 정확값으로 교체됨
  var fallbackH = 120;
  iframe.style.height = fallbackH + 'px';
  var currentHeight = fallbackH;
  var hasReceivedMessage = false;

  window.addEventListener('message', function(e) {
    // ① source 체크
    if (e.source !== iframe.contentWindow) return;
    // ② origin 체크
    if (e.origin !== 'https://page.mamoru.kr') return;

    // ③ id 체크
    if (e.data && e.data.type === 'MAMORU_IFRAME_SIZE' && e.data.id === 'label-lineup' && typeof e.data.height === 'number') {
      var h = Math.ceil(e.data.height);
      if (h <= 0) return;

      if (!hasReceivedMessage) {
        // 첫 메시지 무조건 적용 (fallback 빈 공간 차단)
        hasReceivedMessage = true;
        currentHeight = h;
        iframe.style.height = h + 'px';
      } else if (h > currentHeight) {
        currentHeight = h;
        iframe.style.height = h + 'px';
      }
    }
    if (e.data && e.data.type === 'MAMORU_NAVIGATE' && e.data.url) { window.location.href = e.data.url; }
  });
})();
</script>
