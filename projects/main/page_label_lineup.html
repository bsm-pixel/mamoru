<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --void: #1A1A1A;
  --cream: #FAF9F7;
  --warm-gray: #8A8580;
  --font-display: 'Outfit', sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--cream); overflow: hidden; height: auto; }
body { font-family: var(--font-body); }

.mm-label {
  padding: 24px 20px 8px;
  max-width: 1200px;
  margin: 0 auto;
}
.mm-label__kicker {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--warm-gray);
  margin-bottom: 8px;
}
.mm-label__title {
  font-family: var(--font-body);
  font-size: 22px;
  font-weight: 800;
  color: var(--void);
  letter-spacing: -0.02em;
  line-height: 1.3;
}

@media (min-width: 1024px) {
  .mm-label { padding: 48px 32px 12px; }
  .mm-label__kicker { font-size: 13px; }
  .mm-label__title { font-size: 28px; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>/* ⭐ 조기 높이 부트스트랩 — 파싱 중부터 높이 전송 → iframe 짤림 차단 */
(function(){var ID='label-lineup',last=0;function gh(){var b=document.body;if(!b)return 0;var d=document.documentElement;return Math.max(b.scrollHeight||0,(d&&d.scrollHeight)||0,b.offsetHeight||0);}function s(){var h=Math.ceil(gh());if(h>last+1){last=h;try{window.parent.postMessage({type:'MAMORU_IFRAME_SIZE',id:ID,height:h},'*');}catch(_){}}}var t=setInterval(s,200);setTimeout(function(){clearInterval(t);},16000);document.addEventListener('DOMContentLoaded',s);})();</script>
</head>
<body>

<div class="mm-label">
  <!-- ✏️ 수정가능: 키커/제목 -->
  <p class="mm-label__kicker">Main Lineup</p>
  <h2 class="mm-label__title">평생쓰는 라인업</h2>
</div>

<script>
(function(){
  /* iframe height 송신 — 강화 패턴 (2026-05-18 fix). 자세한 주석은 page_label_first.html 참조 */
  var lastSent = 0;

  function getHeight() {
    var bodyScroll = document.body.scrollHeight || 0;
    var docScroll  = document.documentElement.scrollHeight || 0;
    var bodyOffset = document.body.offsetHeight || 0;
    var lastBottom = 0;
    var lastEl = document.body.lastElementChild;
    while (lastEl && (lastEl.tagName === 'SCRIPT' || lastEl.tagName === 'STYLE')) {
      lastEl = lastEl.previousElementSibling;
    }
    if (lastEl) {
      var rect = lastEl.getBoundingClientRect();
      lastBottom = (window.pageYOffset || document.documentElement.scrollTop || 0) + rect.bottom;
    }
    return Math.max(bodyScroll, docScroll, bodyOffset, lastBottom);
  }

  function send() {
    var h = Math.ceil(getHeight());
    if (h > lastSent + 1) {
      lastSent = h;
      window.parent.postMessage({ type: 'MAMORU_IFRAME_SIZE', id: 'label-lineup', height: h }, '*');
    }
  }

  function multiSend() {
    send();
    [50, 150, 400, 800, 1500, 3000, 5000, 8000].forEach(function(ms) { setTimeout(send, ms); });
  }

  if (window.ResizeObserver) {
    try { new ResizeObserver(send).observe(document.body); } catch(_) {}
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(send).catch(function(){});
  }
  if (document.readyState === 'complete') {
    multiSend();
  } else {
    window.addEventListener('load', multiSend);
    send();
  }
  window.addEventListener('pageshow', function(e) { if (e.persisted) multiSend(); else send(); });
  document.addEventListener('visibilitychange', function() { if (!document.hidden) send(); });
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'REQUEST_HEIGHT') send();
  });
  /* ⭐ 로드 윈도우 연속 재전송 안전망 — 첫 15초 매 280ms 재측정(성장분만), 이후 정지 */
  var __mmTick = setInterval(send, 280);
  setTimeout(function() { clearInterval(__mmTick); }, 15000);
  window.addEventListener('focus', send);
  window.addEventListener('orientationchange', function() { setTimeout(send, 300); });

  document.addEventListener('click', function(e) {
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href || href.startsWith('http')) return;
    e.preventDefault();
    window.parent.postMessage({ type: 'MAMORU_NAVIGATE', url: href }, '*');
  });
})();
</script>
</body>
</html>
