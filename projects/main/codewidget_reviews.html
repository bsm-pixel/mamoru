<!-- 실체 = projects/main/iframe_main_reviews.html (라이브 API fetch → 커스텀 위젯 불가, iframe으로 유지) -->

<iframe
  src="https://page.mamoru.kr/projects/main/iframe_main_reviews.html"
  title="MAMORU 고객 후기"
  loading="lazy"
  scrolling="no"
  style="width:100%;border:0;display:block;"
></iframe>
