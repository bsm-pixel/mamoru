<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no,address=no,email=no">

  <style>
    * { box-sizing: border-box; }
    :root { --ink: #1c1c1e; --muted: #6b7280; --line: #e5e7eb; --primary: #111; }

    html, body { margin: 0; padding: 0; height: 100%; -webkit-text-size-adjust: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #F3F4F6; color: var(--ink); display: flex; justify-content: center; align-items: center; }

    .container {
      width: 100%; max-width: 480px; margin: 0 auto;
      padding: 32px 24px;
      background: #fff; 
      /* 모바일에서는 꽉 차게, PC에서는 카드처럼 */
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
    }
    
    @media (min-width: 480px) {
       .container { min-height: auto; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin: 20px; }
       body { background: #F3F4F6; }
    }

    h1 { margin: 0 0 16px; font-size: 24px; font-weight: 700; line-height: 1.3; text-align: left; }
    p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 0 32px; text-align: left; }
    
    .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    
    .btn {
      display: flex; align-items: center; justify-content: center; width: 100%;
      padding: 18px; border-radius: 14px;
      font-size: 17px; font-weight: 600;
      border: 1px solid transparent; cursor: pointer;
      transition: all 0.2s; text-decoration: none;
    }
    
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
    
    .btn-outline { background: #fff; color: var(--muted); border-color: var(--line); margin-top: 8px; font-size: 15px; }
    
    /* 모달 */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(2px); }
    .modal-backdrop.show { display: flex; animation: fadeIn 0.2s; }
    .modal-content { background: #fff; border-radius: 16px; padding: 24px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .modal-content h2 { margin: 0 0 8px; font-size: 19px; }
    .modal-text { font-size: 15px; color: #666; margin: 0 0 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { padding: 14px; font-size: 16px; flex: 1; }
    .btn-cancel { background: #f3f4f6; color: #333; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>

<body>
  <div class="container" id="root">
    <h1>안녕하세요,<br><?= data.name ?>님!</h1>
    <p>상담을 위해 제안드린 시간입니다.<br>편하신 시간을 선택해주시면<br>즉시 예약이 확정됩니다.</p>

    <div id="btn-group" class="btn-group">
      <? for (let button of data.buttons) { ?>
        <button type="button" class="btn btn-primary"
                data-url="<?!= button.url ?>" data-label="<?= button.label ?>">
          <?= button.label ?>
        </button>
      <? } ?>
      
      <a href="<?= data.rescheduleUrl ?>" class="btn btn-outline">
        다른 시간이 편해요
      </a>
    </div>
  </div>

  <div id="confirm-modal" class="modal-backdrop">
    <div class="modal-content">
      <h2>예약을 확정하시겠습니까?</h2>
      <p class="modal-text" id="confirm-text"></p>
      <div class="modal-actions">
        <button type="button" id="btn-modal-cancel" class="btn btn-cancel">취소</button>
        <a id="btn-modal-confirm" href="#" class="btn btn-primary">확정하기</a>
      </div>
    </div>
  </div>

  <script>
    // 요일 자동 계산 및 표시
    const weekday = ['일', '월', '화', '수', '목', '금', '토'];
    document.querySelectorAll('#btn-group button.btn-primary').forEach(btn => {
      const raw = (btn.dataset.label || btn.textContent).trim();
      // 날짜(YYYY-MM-DD)와 시간(HH:mm) 추출
      const m = raw.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/);
      if (m) {
        const d = new Date(m[1]);
        const w = weekday[d.getDay()];
        // 보기 좋게 포맷 변경 (예: 12월 17일 (수) 13:59)
        const formatted = `${m[1]} (${w}) ${m[2]}`;
        btn.textContent = formatted;
        btn.dataset.label = formatted; 
      }
    });

    // 모달 로직
    const modal = document.getElementById('confirm-modal');
    const confirmText = document.getElementById('confirm-text');
    const confirmBtn = document.getElementById('btn-modal-confirm');

    document.getElementById('btn-group').addEventListener('click', function(e) {
      const t = e.target.closest('button.btn-primary');
      if (!t) return;
      confirmText.textContent = t.dataset.label;
      confirmBtn.href = t.dataset.url; // 확정 링크 연결
      modal.classList.add('show');
    });

    document.getElementById('btn-modal-cancel').addEventListener('click', function() {
      modal.classList.remove('show');
    });

    // "확정하기" 누르면 -> 화면 즉시 변경 (Fire & Forget)
    confirmBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const url = this.href;
      modal.classList.remove('show');
      showSuccess(); // 성공 화면 즉시 표시
      fireAndForget(url); // 백그라운드 서버 요청
    });

    function showSuccess() {
      document.getElementById('root').innerHTML = 
        '<div style="text-align:center; padding:40px 0;">' +
        '<h1 style="margin-bottom:10px;">예약 확정 완료!</h1>' +
        '<p>일정이 확정되었습니다.<br>잠시 후 알림톡을 보내드립니다.</p>' +
        '<button class="btn btn-primary" onclick="closeInapp()">닫기</button>' +
        '</div>';
    }

    function fireAndForget(url) {
      try { fetch(url, { mode: 'no-cors', keepalive: true }); } catch(_) {}
      try { new Image().src = url; } catch(_) {}
    }

    function closeInapp() {
      location.href = 'kakaoweb://closeBrowser';
      setTimeout(() => window.close(), 500);
    }
  </script>
</body>
</html>
