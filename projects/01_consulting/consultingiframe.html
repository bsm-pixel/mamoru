<div id="csWrapPC" style="position:relative; max-width: 1200px; margin: 0 auto;">
  <iframe
    id="csFramePC"
    src=""
    style="width:100%; height:1600px; border:0; display:block; overflow:hidden;"
    scrolling="no"
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
    allowtransparency="true">
  </iframe>
</div>
<script>
(function(){
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwqJr1JVeSspv6kZ-wpKPapKOjk1wvEvQQ9rTN3ZtmtgMpkn8-HLVP7Plw94m-N1EE5/exec';
  var f = document.getElementById('csFramePC');

  // ★ URL 파라미터에서 진단 데이터 확인 (DiagRef.html에서 전달)
  var urlParams = new URLSearchParams(window.location.search);
  var diagnosisData = urlParams.get('diagnosis');
  var finalURL = WEBAPP_URL;

  if (diagnosisData) {
    // iframe URL에 진단 데이터 파라미터 추가
    finalURL = WEBAPP_URL + '?diagnosis=' + encodeURIComponent(diagnosisData);
    console.log('[MAMORU] 진단 데이터를 iframe URL에 포함:', diagnosisData);
  }

  f.src = finalURL;
  
  // 높이 자동 조절
  var MIN = 1600, MAX = 5000;
  function setH(h){
    var hh = Math.max(MIN, Math.min(MAX, Number(h)||0));
    if (f && hh) f.style.height = hh + 'px';
  }
  
  window.addEventListener('message', function(e){
    var d = e && e.data;
    if (!d || d.type !== 'MAMORU_IFRAME_SIZE') return;
    setH((d.height||0) + 20);
  });
  
  f.addEventListener('load', function(){ setH(MIN); });
  setTimeout(function(){ setH(MIN); }, 3000);
})();
</script>
