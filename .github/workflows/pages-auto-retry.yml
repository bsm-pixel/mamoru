name: Pages 배포 자동 재시도

# GitHub Pages 배포가 인프라 일시 장애("Deployment failed, try again later")로
# 실패할 때, 사람이 손대지 않아도 자동으로 다시 배포한다.
# - 빌드는 항상 성공하고 마지막 배포 단계만 간헐적으로 실패하는 케이스를 복구.
# - 무한 재시도 방지: 최대 3회(run_attempt < 3)까지만.

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: 잠시 대기 후 실패한 Pages 배포 재실행
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pages 배포 실패 감지 (attempt ${{ github.event.workflow_run.run_attempt }}). 60초 대기 후 재시도."
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
